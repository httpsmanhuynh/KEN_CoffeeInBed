  **Loại:** Positive

  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; đã seed products/addons.

  **Dữ liệu vào:** {"name": "Thuê loa test", "unit": "PER_ITEM", "price": 30000}

  **Các bước thực hiện:**

  1) POST /api/addons

  **Kết quả mong đợi:** 201; unit=PER_ITEM đúng validator addons (HTTP: 201)

  **Nhánh code bao phủ:** ADD-B16

  '
