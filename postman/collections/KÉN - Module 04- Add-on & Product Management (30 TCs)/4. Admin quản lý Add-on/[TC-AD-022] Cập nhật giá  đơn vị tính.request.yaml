$kind: http-request
name: '[TC-AD-022] Cập nhật giá / đơn vị tính'
description: '**Mã TC:** TC-AD-022

  **Nhóm:** Admin quản lý Add-on

  **API / Thành phần:** PATCH /api/addons/:id

  **Loại:** Positive

  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; đã seed products/addons.

  **Dữ liệu vào:** {"price": 35000, "unit": "PER_BOOKING"}

  **Các bước thực hiện:**

  1) PATCH /api/addons/<id>

  **Kết quả mong đợi:** 200; giá và unit mới được lưu (HTTP: 200)

  **Nhánh code bao phủ:** ADD-B18

  '
url: '{{baseUrl}}/api/addons/{{addonId}}'
method: PATCH
headers:
- key: Content-Type
  value: application/json
- key: x-test-role
  value: ADMIN
order: 22000
body:
  type: json
  raw: "{\n  \"price\": 35000,\n  \"unit\": \"PER_BOOKING\"\n}"
scripts:
- type: afterResponse
  language: text/javascript
  code: "// [TC-AD-022] Cập nhật giá / đơn vị tính\npm.test(\"[TC-AD-022] Status code\
    \ is 200\", function () {\n    pm.expect(pm.response.code).to.be.oneOf([200]);\n\
    });\npm.test(\"[TC-AD-022] Response valid format\", function () {\n    pm.expect(pm.response.text()).to.be.a('string');\n\
    });"
