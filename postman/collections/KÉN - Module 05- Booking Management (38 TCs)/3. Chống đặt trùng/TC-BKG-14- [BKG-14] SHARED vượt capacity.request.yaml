  type: json
  content: |-
    {
      "spaceId": "{{sharedSpaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "{{bookingStartAt}}",
      "guestCount": 99
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-BKG-14] SHARED vượt capacity
      pm.test("[TC-BKG-14] Status code is 409", function () {
          pm.expect(pm.response.code).to.be.oneOf([409]);
      });
