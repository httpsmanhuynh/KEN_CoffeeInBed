$kind: http-request
name: "TC-BKG-14- [BKG-14] SHARED vượt capacity (Branch- BKG-B14)"
description: |-
  **Mã TC:** BKG-14 (TC-BKG-14)
  **Nhóm:** Chống đặt trùng
  **API / Thành phần:** POST /api/bookings
  **Loại:** Negative
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer; Space SHARED đã gần đầy.
  **Dữ liệu vào:** guestCount vượt remaining capacity
  **Các bước thực hiện:**
  1) POST /api/bookings
  **Kết quả mong đợi:** 409 vượt capacity (HTTP: 409)
  **Nhánh code bao phủ:** BKG-B14
  **Ghi chú:** 
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
