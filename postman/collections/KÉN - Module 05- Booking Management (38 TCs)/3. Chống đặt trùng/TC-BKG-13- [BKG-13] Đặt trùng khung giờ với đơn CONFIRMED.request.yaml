$kind: http-request
name: "TC-BKG-13- [BKG-13] Đặt trùng khung giờ với đơn CONFIRMED (Branch- BKG-B13)"
description: |-
  **Mã TC:** BKG-13 (TC-BKG-13)
  **Nhóm:** Chống đặt trùng
  **API / Thành phần:** POST /api/bookings
  **Loại:** Negative
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer; có đơn CONFIRMED chiếm khung giờ.
  **Dữ liệu vào:** Trùng startAt đơn cũ
  **Các bước thực hiện:**
  1) POST /api/bookings
  **Kết quả mong đợi:** 409 Space đã có đơn (HTTP: 409)
  **Nhánh code bao phủ:** BKG-B13
  **Ghi chú:** 
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "{{confirmedStartAt}}",
      "guestCount": 2
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-BKG-13] Đặt trùng khung giờ với đơn CONFIRMED
      pm.test("[TC-BKG-13] Status code is 409", function () {
          pm.expect(pm.response.code).to.be.oneOf([409]);
      });
    language: text/javascript
order: 13000
