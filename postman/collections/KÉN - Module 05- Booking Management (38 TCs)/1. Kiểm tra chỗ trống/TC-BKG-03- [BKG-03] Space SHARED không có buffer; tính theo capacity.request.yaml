$kind: http-request
name: "TC-BKG-03- [BKG-03] Space SHARED không có buffer; tính theo capacity (Branch- BK"
description: |-
          **Mã TC:** BKG-03 (TC-BKG-03)
          **Nhóm:** Kiểm tra chỗ trống
          **API / Thành phần:** POST /api/availability
          **Loại:** Positive
          **Điều kiện tiên quyết:** Server chạy; Space SHARED capacity=8, đơn hiện có 2 khách.
          **Dữ liệu vào:** guestCount=6 rồi guestCount=7
          **Các bước thực hiện:**
          1) POST availability guestCount=6
  2) POST availability guestCount=7
          **Kết quả mong đợi:** guestCount=6 khả dụng; guestCount=7 không khả dụng (HTTP: 200)
          **Nhánh code bao phủ:** BKG-B03
          **Ghi chú:** 
url: "{{baseUrl}}/api/availability"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{sharedSpaceId}}",
      "startAt": "{{bookingStartAt}}",
      "hours": 1,
      "guestCount": 6
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-BKG-03] Space SHARED không có buffer; tính theo capacity
      pm.test("[TC-BKG-03] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 3000
