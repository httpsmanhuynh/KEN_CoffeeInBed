$kind: http-request
name: "TC-BKG-26- [BKG-26] Đổi lịch đơn không phải CONFIRMED (Branch- BKG-B26)"
description: |-
  **Mã TC:** BKG-26 (TC-BKG-26)
  **Nhóm:** Đổi lịch
  **API / Thành phần:** POST /api/bookings/:id/reschedule
  **Loại:** Negative
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer; đơn PENDING_PAYMENT.
  **Dữ liệu vào:** đơn không CONFIRMED
  **Các bước thực hiện:**
  1) POST reschedule
  **Kết quả mong đợi:** 409 trạng thái không cho phép đổi (HTTP: 409)
  **Nhánh code bao phủ:** BKG-B26
  **Ghi chú:** 
url: "{{baseUrl}}/api/bookings/{{pendingBookingId}}/reschedule"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "newStartAt": "{{newStartAt}}"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-BKG-26] Đổi lịch đơn không phải CONFIRMED
      pm.test("[TC-BKG-26] Status code is 409", function () {
          pm.expect(pm.response.code).to.be.oneOf([409]);
      });
    language: text/javascript
order: 26000
