$kind: http-request
name: "TC-BKG-25- [BKG-25] Đổi lịch sau Cut-off hoặc giờ mới quá gần (Branch- BKG-B25)"
description: |-
  **Mã TC:** BKG-25 (TC-BKG-25)
  **Nhóm:** Đổi lịch
  **API / Thành phần:** POST /api/bookings/:id/reschedule
  **Loại:** Negative
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer.
  **Dữ liệu vào:** newStartAt < now+30 phút
  **Các bước thực hiện:**
  1) POST reschedule
  **Kết quả mong đợi:** 409 hoặc 422 vi phạm ràng buộc (HTTP: 409/422)
  **Nhánh code bao phủ:** BKG-B25
  **Ghi chú:** 
url: "{{baseUrl}}/api/bookings/{{confirmedBookingId}}/reschedule"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "newStartAt": "{{tooSoonStartAt}}"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-BKG-25] Đổi lịch sau Cut-off hoặc giờ mới quá gần
      pm.test("[TC-BKG-25] Status code is 409", function () {
          pm.expect(pm.response.code).to.be.oneOf([409, 422]);
      });
    language: text/javascript
order: 25000
