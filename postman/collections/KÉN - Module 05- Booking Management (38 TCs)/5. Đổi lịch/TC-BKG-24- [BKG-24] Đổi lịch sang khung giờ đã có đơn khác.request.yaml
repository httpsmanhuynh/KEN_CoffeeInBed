$kind: http-request
name: "TC-BKG-24- [BKG-24] Đổi lịch sang khung giờ đã có đơn khác (Branch- BKG-B24)"
description: |-
  **Mã TC:** BKG-24 (TC-BKG-24)
  **Nhóm:** Đổi lịch
  **API / Thành phần:** POST /api/bookings/:id/reschedule
  **Loại:** Negative
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer; khung giờ mới trùng đơn khác.
  **Dữ liệu vào:** newStartAt trùng đơn
  **Các bước thực hiện:**
  1) POST reschedule
  **Kết quả mong đợi:** 409 khung giờ đã có đơn (HTTP: 409)
  **Nhánh code bao phủ:** BKG-B24
  **Ghi chú:** 
url: "{{baseUrl}}/api/bookings/{{confirmedBookingId}}/reschedule"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "newStartAt": "{{conflictStartAt}}"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-BKG-24] Đổi lịch sang khung giờ đã có đơn khác
      pm.test("[TC-BKG-24] Status code is 409", function () {
          pm.expect(pm.response.code).to.be.oneOf([409]);
      });
