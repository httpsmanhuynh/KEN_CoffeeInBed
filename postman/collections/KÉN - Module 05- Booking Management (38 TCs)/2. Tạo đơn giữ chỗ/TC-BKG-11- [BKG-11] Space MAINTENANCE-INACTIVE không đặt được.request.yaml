$kind: http-request
name: "TC-BKG-11- [BKG-11] Space MAINTENANCE-INACTIVE không đặt được (Branch- BKG-B11)"
description: |-
  **Mã TC:** BKG-11 (TC-BKG-11)
  **Nhóm:** Tạo đơn giữ chỗ
  **API / Thành phần:** POST /api/bookings
  **Loại:** Negative
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer; Space ở trạng thái MAINTENANCE.
  **Dữ liệu vào:** spaceId của Space MAINTENANCE
  **Các bước thực hiện:**
  1) POST /api/bookings
  **Kết quả mong đợi:** 409 Space không khả dụng (HTTP: 409)
  **Nhánh code bao phủ:** BKG-B11
  **Ghi chú:** 
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{maintenanceSpaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "{{bookingStartAt}}",
      "guestCount": 2
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-BKG-11] Space MAINTENANCE-INACTIVE không đặt được
      pm.test("[TC-BKG-11] Status code is 409", function () {
          pm.expect(pm.response.code).to.be.oneOf([409]);
      });
    language: text/javascript
order: 11000
