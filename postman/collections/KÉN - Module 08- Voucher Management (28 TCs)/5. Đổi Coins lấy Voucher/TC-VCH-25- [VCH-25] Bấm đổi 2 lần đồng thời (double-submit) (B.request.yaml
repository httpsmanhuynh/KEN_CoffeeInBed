$kind: http-request
name: "TC-VCH-25: [VCH-25] Bấm đổi 2 lần đồng thời (double-submit) (Branch: VCH-B23)"
description: |-
  **Mã TC:** VCH-25 (TC-VCH-25)
  **Nhóm:** Đổi Coins lấy Voucher
  **API / Thành phần:** POST /api/loyalty/redeem
  **Loại:** Security
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer; Coins chỉ đủ đổi 1 lần.
  **Dữ liệu vào:** 2 request đồng thời
  **Các bước thực hiện:**
  1) Gửi đồng thời 2 POST /api/loyalty/redeem
  **Kết quả mong đợi:** Chỉ 1 lần thành công; coin_balance không âm (HTTP: 200/422)
  **Nhánh code bao phủ:** VCH-B23
  **Ghi chú:** Test concurrency thủ công
url: "{{baseUrl}}/api/loyalty/redeem"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "voucherId": "{{voucherId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-VCH-25] Bấm đổi 2 lần đồng thời (double-submit)
      pm.test("[TC-VCH-25] Status code is 200/422", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 422]);
      });
    language: text/javascript
order: 5000
