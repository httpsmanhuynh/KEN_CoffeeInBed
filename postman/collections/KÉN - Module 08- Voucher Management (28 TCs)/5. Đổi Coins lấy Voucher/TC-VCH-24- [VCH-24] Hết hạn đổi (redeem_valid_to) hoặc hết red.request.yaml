$kind: http-request
name: "TC-VCH-24: [VCH-24] Hết hạn đổi (redeem_valid_to) hoặc hết redeem_limit (Branch: VCH-B22)"
description: |-
  **Mã TC:** VCH-24 (TC-VCH-24)
  **Nhóm:** Đổi Coins lấy Voucher
  **API / Thành phần:** POST /api/loyalty/redeem
  **Loại:** Negative
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer; đủ Coins.
  **Dữ liệu vào:** Voucher quá redeem_valid_to ; redeem_count = redeem_limit
  **Các bước thực hiện:**
  1) POST redeem 2 lần
  **Kết quả mong đợi:** Cả 2 lần bị từ chối; Coins không bị trừ (HTTP: 422)
  **Nhánh code bao phủ:** VCH-B22
  **Ghi chú:** 
url: "{{baseUrl}}/api/loyalty/redeem"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "voucherId": "{{voucherId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-VCH-24] Hết hạn đổi (redeem_valid_to) hoặc hết redeem_limit
      pm.test("[TC-VCH-24] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
    language: text/javascript
order: 4000
