$kind: http-request
name: "TC-VCH-27: [VCH-27] Dùng Voucher đổi Coins của người khác / đã dùng rồi (Branch: VCH-B25)"
description: |-
  **Mã TC:** VCH-27 (TC-VCH-27)
  **Nhóm:** Ví Voucher
  **API / Thành phần:** POST /api/bookings
  **Loại:** Negative
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer; đã seed vouchers/spaces/packages.
  **Dữ liệu vào:** Voucher trong ví của A, B đem dùng
  **Các bước thực hiện:**
  1) POST /api/bookings bằng B&#10;2) Dùng lại Voucher đã có used_booking_id
  **Kết quả mong đợi:** Cả 2 lần bị từ chối (HTTP: 422)
  **Nhánh code bao phủ:** VCH-B25
  **Ghi chú:** Xác nhận mã lỗi thực tế
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "2026-12-20T02:00:00.000Z",
      "guestCount": 1,
      "voucherCode": "WELCOME10"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-VCH-27] Dùng Voucher đổi Coins của người khác / đã dùng rồi
      pm.test("[TC-VCH-27] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
    language: text/javascript
order: 2000
