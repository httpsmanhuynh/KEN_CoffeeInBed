$kind: http-request
name: "TC-VCH-16: [VCH-16] Voucher hết hạn / chưa tới hạn (Branch: VCH-B14)"
description: |-
  **Mã TC:** VCH-16 (TC-VCH-16)
  **Nhóm:** Áp dụng tại Checkout
  **API / Thành phần:** POST /api/bookings
  **Loại:** Negative
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer; đã seed vouchers/spaces/packages.
  **Dữ liệu vào:** valid_to < now ; valid_from > now
  **Các bước thực hiện:**
  1) POST /api/bookings 2 lần
  **Kết quả mong đợi:** Cả 2 lần bị từ chối; không tạo đơn (HTTP: 422)
  **Nhánh code bao phủ:** VCH-B14
  **Ghi chú:** Xác nhận mã lỗi thực tế
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "2026-12-20T02:00:00.000Z",
      "guestCount": 1,
      "voucherCode": "WELCOME10"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-VCH-16] Voucher hết hạn / chưa tới hạn
      pm.test("[TC-VCH-16] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
    language: text/javascript
order: 2000
