$kind: http-request
name: "TC-VCH-19: [VCH-19] 2 khách dùng lượt cuối cùng đồng thời (Branch: VCH-B17)"
description: |-
  **Mã TC:** VCH-19 (TC-VCH-19)
  **Nhóm:** Áp dụng tại Checkout
  **API / Thành phần:** POST /api/bookings
  **Loại:** Security
  **Điều kiện tiên quyết:** Server chạy; 2 tài khoản Customer; Voucher còn đúng 1 lượt.
  **Dữ liệu vào:** 2 request đồng thời
  **Các bước thực hiện:**
  1) Gửi đồng thời 2 POST /api/bookings dùng cùng Voucher
  **Kết quả mong đợi:** Chỉ 1 đơn dùng được Voucher; usage_count không vượt usage_limit (HTTP: 201/422)
  **Nhánh code bao phủ:** VCH-B17
  **Ghi chú:** Test concurrency thủ công
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "2026-12-20T02:00:00.000Z",
      "guestCount": 1,
      "voucherCode": "WELCOME10"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-VCH-19] 2 khách dùng lượt cuối cùng đồng thời
      pm.test("[TC-VCH-19] Status code is 201/422", function () {
          pm.expect(pm.response.code).to.be.oneOf([201, 422]);
      });
    language: text/javascript
order: 5000
