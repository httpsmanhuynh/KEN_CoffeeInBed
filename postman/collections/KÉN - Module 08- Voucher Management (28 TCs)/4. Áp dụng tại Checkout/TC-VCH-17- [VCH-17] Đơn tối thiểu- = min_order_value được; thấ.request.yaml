$kind: http-request
name: "TC-VCH-17: [VCH-17] Đơn tối thiểu: = min_order_value được; thấp hơn 1đ bị từ chối (Branch: VCH-B15)"
description: |-
  **Mã TC:** VCH-17 (TC-VCH-17)
  **Nhóm:** Áp dụng tại Checkout
  **API / Thành phần:** POST /api/bookings
  **Loại:** Boundary
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer; đã seed vouchers/spaces/packages.
  **Dữ liệu vào:** min_order_value = 100.000
  **Các bước thực hiện:**
  1) Đơn 100.000đ&#10;2) Đơn 99.999đ
  **Kết quả mong đợi:** Đơn 100.000 áp dụng được; 99.999 bị từ chối (HTTP: 201/422)
  **Nhánh code bao phủ:** VCH-B15
  **Ghi chú:** 
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "2026-12-20T02:00:00.000Z",
      "guestCount": 1,
      "voucherCode": "WELCOME10"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-VCH-17] Đơn tối thiểu: = min_order_value được; thấp hơn 1đ bị từ chối
      pm.test("[TC-VCH-17] Status code is 201/422", function () {
          pm.expect(pm.response.code).to.be.oneOf([201, 422]);
      });
    language: text/javascript
order: 3000
