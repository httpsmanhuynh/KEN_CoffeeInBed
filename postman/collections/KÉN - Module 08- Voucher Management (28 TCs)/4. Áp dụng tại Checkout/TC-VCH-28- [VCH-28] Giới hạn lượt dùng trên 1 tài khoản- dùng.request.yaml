$kind: http-request
name: "TC-VCH-28: [VCH-28] Giới hạn lượt dùng trên 1 tài khoản: dùng Voucher công khai 2 lần trên 2 đơn khác nhau (Branch: VCH-B26)"
description: |-
  **Mã TC:** VCH-28 (TC-VCH-28)
  **Nhóm:** Áp dụng tại Checkout
  **API / Thành phần:** POST /api/bookings
  **Loại:** Negative
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer; Voucher công khai usage_limit lớn.
  **Dữ liệu vào:** Cùng 1 voucherCode cho 2 đơn khác nhau
  **Các bước thực hiện:**
  1) POST /api/bookings đơn 1 kèm Voucher&#10;2) POST /api/bookings đơn 2 kèm cùng Voucher
  **Kết quả mong đợi:** 201; thiết kế hiện tại không giới hạn per_user_limit cho Voucher công khai (dùng được nhiều lần miễn usage_count < usage_limit) (HTTP: 201/422)
  **Nhánh code bao phủ:** VCH-B26
  **Ghi chú:** Chỉ Voucher đổi Coins (user_vouchers) mới giới hạn 1 lượt/bản ghi ví
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "2026-12-20T02:00:00.000Z",
      "guestCount": 1,
      "voucherCode": "WELCOME10"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-VCH-28] Giới hạn lượt dùng trên 1 tài khoản: dùng Voucher công khai 2 lần trên 2 đơn khác nhau
      pm.test("[TC-VCH-28] Status code is 201/422", function () {
          pm.expect(pm.response.code).to.be.oneOf([201, 422]);
      });
    language: text/javascript
order: 7000
