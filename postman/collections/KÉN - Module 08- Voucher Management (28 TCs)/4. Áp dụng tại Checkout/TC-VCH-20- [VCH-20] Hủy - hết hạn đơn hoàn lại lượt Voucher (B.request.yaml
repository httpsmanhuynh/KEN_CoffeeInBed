$kind: http-request
name: "TC-VCH-20: [VCH-20] Hủy / hết hạn đơn hoàn lại lượt Voucher (Branch: VCH-B18)"
description: |-
  **Mã TC:** VCH-20 (TC-VCH-20)
  **Nhóm:** Áp dụng tại Checkout
  **API / Thành phần:** POST /api/bookings
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer; đã seed vouchers/spaces/packages.
  **Dữ liệu vào:** Đơn dùng Voucher
  **Các bước thực hiện:**
  1) Hủy đơn PENDING (hoặc để EXPIRED)&#10;2) Kiểm tra usage_count
  **Kết quả mong đợi:** usage_count giảm 1; voucher_usage_released=true (HTTP: 200)
  **Nhánh code bao phủ:** VCH-B18
  **Ghi chú:** 
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "2026-12-20T02:00:00.000Z",
      "guestCount": 1,
      "voucherCode": "WELCOME10"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-VCH-20] Hủy / hết hạn đơn hoàn lại lượt Voucher
      pm.test("[TC-VCH-20] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 6000
