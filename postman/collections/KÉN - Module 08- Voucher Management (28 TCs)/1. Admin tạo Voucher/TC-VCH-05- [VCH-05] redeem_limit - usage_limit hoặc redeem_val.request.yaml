$kind: http-request
name: "TC-VCH-05: [VCH-05] redeem_limit > usage_limit hoặc redeem_valid_to > valid_to (Branch: VCH-B04)"
description: |-
  **Mã TC:** VCH-05 (TC-VCH-05)
  **Nhóm:** Admin tạo Voucher
  **API / Thành phần:** POST /api/vouchers
  **Loại:** Negative
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; đã seed vouchers.
  **Dữ liệu vào:** redeem_limit=40, usage_limit=30
  **Các bước thực hiện:**
  1) POST /api/vouchers
  **Kết quả mong đợi:** 422 VALIDATION_ERROR (HTTP: 422)
  **Nhánh code bao phủ:** VCH-B04
  **Ghi chú:** 
url: "{{baseUrl}}/api/vouchers"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "VCH_VCH05",
      "discount_type": "FIXED_AMOUNT",
      "discount_value": 10000,
      "min_order_value": 100000,
      "usage_limit": 10,
      "redeem_limit": 20,
      "coins_cost": 20,
      "valid_from": "2026-05-01T00:00:00.000Z",
      "valid_to": "2026-12-31T23:59:59.000Z"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-VCH-05] redeem_limit > usage_limit hoặc redeem_valid_to > valid_to
      pm.test("[TC-VCH-05] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
    language: text/javascript
order: 5000
