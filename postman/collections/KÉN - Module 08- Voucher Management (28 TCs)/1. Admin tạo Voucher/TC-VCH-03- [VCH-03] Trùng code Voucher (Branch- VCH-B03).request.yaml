$kind: http-request
name: "TC-VCH-03: [VCH-03] Trùng code Voucher (Branch: VCH-B03)"
description: |-
  **Mã TC:** VCH-03 (TC-VCH-03)
  **Nhóm:** Admin tạo Voucher
  **API / Thành phần:** POST /api/vouchers
  **Loại:** Negative
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; đã seed vouchers.
  **Dữ liệu vào:** code = KEN10K lần 2
  **Các bước thực hiện:**
  1) POST /api/vouchers lần 2
  **Kết quả mong đợi:** 409 (unique code) (HTTP: 409)
  **Nhánh code bao phủ:** VCH-B03
  **Ghi chú:** 
url: "{{baseUrl}}/api/vouchers"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "KEN10K",
      "discount_type": "FIXED_AMOUNT",
      "discount_value": 10000,
      "min_order_value": 100000,
      "usage_limit": 50,
      "redeem_limit": 0,
      "coins_cost": 0,
      "valid_from": "2026-05-01T00:00:00.000Z",
      "valid_to": "2026-12-31T23:59:59.000Z"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-VCH-03] Trùng code Voucher
      pm.test("[TC-VCH-03] Status code is 409", function () {
          pm.expect(pm.response.code).to.be.oneOf([409]);
      });
    language: text/javascript
order: 3000
