$kind: http-request
name: "TC-LOY-13: [LOY-13] Đổi hết KÉN Coins về 0 không làm giảm Điểm tích lũy và không bị hạ hạng (Branch: LOY-B13)"
description: |-
  **Mã TC:** LOY-13 (TC-LOY-13)
  **Nhóm:** Bảo toàn hạng trong năm
  **API / Thành phần:** POST /api/loyalty/redeem
  **Loại:** Boundary
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer hạng GOLD (tier_points=5500, coin_balance=50).
  **Dữ liệu vào:** {"cost": 50, "description": "Đổi hết Coins"}
  **Các bước thực hiện:**
  1) POST /api/loyalty/redeem&#10;2) GET /api/me kiểm tra tier và tier_points
  **Kết quả mong đợi:** 200; coin_balance=0 nhưng tier_points vẫn = 5.500 và hạng vẫn là GOLD (BR-H06) (HTTP: 200)
  **Nhánh code bao phủ:** LOY-B13
  **Ghi chú:** Đổi Coins độc lập với Điểm xét hạng (BR-H06)
url: "{{baseUrl}}/api/loyalty/redeem"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "cost": 50,
      "description": "Đổi hết Coins"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-LOY-13] Đổi hết KÉN Coins về 0 không làm giảm Điểm tích lũy và không bị hạ hạng
      pm.test("[TC-LOY-13] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 2000
