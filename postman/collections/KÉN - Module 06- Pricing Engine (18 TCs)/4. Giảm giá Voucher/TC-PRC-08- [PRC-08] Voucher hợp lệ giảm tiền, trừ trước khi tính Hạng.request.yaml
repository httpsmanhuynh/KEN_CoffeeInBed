$kind: http-request
name: "TC-PRC-08- [PRC-08] Voucher hợp lệ giảm tiền, trừ trước khi tính Hạng (Branch- P"
description: |-
  **Mã TC:** PRC-08 (TC-PRC-08)
  **Nhóm:** Giảm giá Voucher
  **API / Thành phần:** POST /api/bookings/quote
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; Voucher ACTIVE còn lượt.
  **Dữ liệu vào:** voucherCode=KEN10K
  **Các bước thực hiện:**
  1) POST quote
  **Kết quả mong đợi:** 200 voucherDiscount > 0; tính trước Hạng (HTTP: 200)
  **Nhánh code bao phủ:** PRC-B08
  **Ghi chú:** 
url: "{{baseUrl}}/api/bookings/quote"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "{{bookingStartAt}}",
      "guestCount": 1,
      "voucherCode": "KEN10K"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRC-08] Voucher hợp lệ giảm tiền, trừ trước khi tính Hạng
      pm.test("[TC-PRC-08] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 8000
