$kind: http-request
name: "TC-PRC-10- [PRC-10] Giảm giá không làm final_amount âm (Branch- PRC-B10)"
description: |-
  **Mã TC:** PRC-10 (TC-PRC-10)
  **Nhóm:** Giảm giá Voucher
  **API / Thành phần:** POST /api/bookings/quote
  **Loại:** Boundary
  **Điều kiện tiên quyết:** Server chạy; Voucher lớn hơn subtotal.
  **Dữ liệu vào:** Voucher > subtotal
  **Các bước thực hiện:**
  1) POST quote
  **Kết quả mong đợi:** 200 finalAmount = 0 (không âm) (HTTP: 200)
  **Nhánh code bao phủ:** PRC-B10
  **Ghi chú:** 
url: "{{baseUrl}}/api/bookings/quote"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{cheapPackageId}}",
      "startAt": "{{bookingStartAt}}",
      "guestCount": 1,
      "voucherCode": "BIGVOUCHER"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRC-10] Giảm giá không làm final_amount âm
      pm.test("[TC-PRC-10] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 10000
