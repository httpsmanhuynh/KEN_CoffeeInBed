$kind: http-request
name: "TC-PRC-09- [PRC-09] Voucher hết hạn - INACTIVE - hết lượt (Branch- PRC-B09)"
description: |-
  **Mã TC:** PRC-09 (TC-PRC-09)
  **Nhóm:** Giảm giá Voucher
  **API / Thành phần:** POST /api/bookings/quote
  **Loại:** Negative
  **Điều kiện tiên quyết:** Server chạy; Voucher hết hạn.
  **Dữ liệu vào:** voucherCode expired
  **Các bước thực hiện:**
  1) POST quote
  **Kết quả mong đợi:** 422 Voucher không hợp lệ (HTTP: 422)
  **Nhánh code bao phủ:** PRC-B09
  **Ghi chú:** 
url: "{{baseUrl}}/api/bookings/quote"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "{{bookingStartAt}}",
      "guestCount": 1,
      "voucherCode": "EXPIREDVOUCHER"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRC-09] Voucher hết hạn - INACTIVE - hết lượt
      pm.test("[TC-PRC-09] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
    language: text/javascript
order: 9000
