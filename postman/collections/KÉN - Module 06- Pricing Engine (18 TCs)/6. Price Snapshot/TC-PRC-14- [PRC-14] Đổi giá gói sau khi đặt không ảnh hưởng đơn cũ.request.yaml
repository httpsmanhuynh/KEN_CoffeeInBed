$kind: http-request
name: "TC-PRC-14- [PRC-14] Đổi giá gói sau khi đặt không ảnh hưởng đơn cũ (Branch- PRC-"
description: |-
          **Mã TC:** PRC-14 (TC-PRC-14)
          **Nhóm:** Price Snapshot
          **API / Thành phần:** PATCH /api/pricing/:id
          **Loại:** Positive
          **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; có đơn cũ.
          **Dữ liệu vào:** price mới
          **Các bước thực hiện:**
          1) PATCH pricing
  2) GET đơn cũ
