    code: |-
      // [TC-PRC-14] Đổi giá gói sau khi đặt không ảnh hưởng đơn cũ
      pm.test("[TC-PRC-14] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
