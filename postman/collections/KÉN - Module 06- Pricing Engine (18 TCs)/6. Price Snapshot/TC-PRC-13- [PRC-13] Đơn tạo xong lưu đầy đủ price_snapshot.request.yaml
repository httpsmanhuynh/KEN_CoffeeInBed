  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "{{bookingStartAt}}",
      "guestCount": 1
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRC-13] Đơn tạo xong lưu đầy đủ price_snapshot
      pm.test("[TC-PRC-13] Status code is 201", function () {
          pm.expect(pm.response.code).to.be.oneOf([201]);
      });
