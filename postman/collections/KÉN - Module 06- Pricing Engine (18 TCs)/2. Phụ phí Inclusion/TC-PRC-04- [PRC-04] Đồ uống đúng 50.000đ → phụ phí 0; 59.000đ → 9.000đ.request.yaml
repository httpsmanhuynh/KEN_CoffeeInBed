$kind: http-request
name: "TC-PRC-04- [PRC-04] Đồ uống đúng 50.000đ → phụ phí 0; 59.000đ → 9.000đ (Branch- "
description: |-
          **Mã TC:** PRC-04 (TC-PRC-04)
          **Nhóm:** Phụ phí Inclusion
          **API / Thành phần:** POST /api/bookings/quote
          **Loại:** Boundary
          **Điều kiện tiên quyết:** Server chạy; Inclusion STANDARD_DRINK 50.000đ.
          **Dữ liệu vào:** Đồ uống 50.000đ và 59.000đ
          **Các bước thực hiện:**
          1) POST quote inclusion 50k
  2) POST quote inclusion 59k
          **Kết quả mong đợi:** 50k: phụ phí 0; 59k: phụ phí 9.000đ (HTTP: 200)
          **Nhánh code bao phủ:** PRC-B04
          **Ghi chú:** 
url: "{{baseUrl}}/api/bookings/quote"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "{{bookingStartAt}}",
      "guestCount": 1,
      "inclusions": [{"productId": "{{standardDrinkId}}", "quantity": 1}]
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRC-04] Đồ uống đúng 50.000đ → phụ phí 0; 59.000đ → 9.000đ
      pm.test("[TC-PRC-04] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 4000
