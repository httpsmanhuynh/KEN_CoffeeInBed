$kind: http-request
name: "TC-PRC-12- [PRC-12] % Hạng tính trên phần còn lại sau Voucher, làm tròn (Branch-"
description: |-
  **Mã TC:** PRC-12 (TC-PRC-12)
  **Nhóm:** Giảm giá Hạng
  **API / Thành phần:** POST /api/bookings/quote
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer hạng GOLD; có Voucher.
  **Dữ liệu vào:** Customer GOLD + Voucher
  **Các bước thực hiện:**
  1) POST quote
  **Kết quả mong đợi:** 200 tierDiscount = floor(10% × afterVoucher) (HTTP: 200)
  **Nhánh code bao phủ:** PRC-B12
  **Ghi chú:** 
url: "{{baseUrl}}/api/bookings/quote"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "{{bookingStartAt}}",
      "guestCount": 1,
      "voucherCode": "KEN10K"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRC-12] % Hạng tính trên phần còn lại sau Voucher, làm tròn
      pm.test("[TC-PRC-12] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 12000
