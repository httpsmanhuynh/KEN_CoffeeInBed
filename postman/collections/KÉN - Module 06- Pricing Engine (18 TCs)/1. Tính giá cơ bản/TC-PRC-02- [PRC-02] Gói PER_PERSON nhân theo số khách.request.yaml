$kind: http-request
name: "TC-PRC-02- [PRC-02] Gói PER_PERSON nhân theo số khách (Branch- PRC-B02)"
description: |-
  **Mã TC:** PRC-02 (TC-PRC-02)
  **Nhóm:** Tính giá cơ bản
  **API / Thành phần:** POST /api/bookings/quote
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; gói PER_PERSON.
  **Dữ liệu vào:** guestCount=3
  **Các bước thực hiện:**
  1) POST quote
  **Kết quả mong đợi:** 200 subtotal = price × 3 (HTTP: 200)
  **Nhánh code bao phủ:** PRC-B02
  **Ghi chú:** 
url: "{{baseUrl}}/api/bookings/quote"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{perPersonPkgId}}",
      "startAt": "{{bookingStartAt}}",
      "guestCount": 3
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRC-02] Gói PER_PERSON nhân theo số khách
      pm.test("[TC-PRC-02] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 2000
