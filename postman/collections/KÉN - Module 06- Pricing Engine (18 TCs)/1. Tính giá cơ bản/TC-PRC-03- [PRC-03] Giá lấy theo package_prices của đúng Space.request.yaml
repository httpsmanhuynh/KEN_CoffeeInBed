$kind: http-request
name: "TC-PRC-03- [PRC-03] Giá lấy theo package_prices của đúng Space (Branch- PRC-B03)"
description: |-
          **Mã TC:** PRC-03 (TC-PRC-03)
          **Nhóm:** Tính giá cơ bản
          **API / Thành phần:** POST /api/bookings/quote
          **Loại:** Positive
          **Điều kiện tiên quyết:** Server chạy; 2 Space cùng gói giá khác nhau.
          **Dữ liệu vào:** spaceId A
          **Các bước thực hiện:**
          1) POST quote spaceId A
  2) POST quote spaceId B
          **Kết quả mong đợi:** 200 giá đúng theo từng Space (HTTP: 200)
          **Nhánh code bao phủ:** PRC-B03
          **Ghi chú:** 
url: "{{baseUrl}}/api/bookings/quote"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "{{bookingStartAt}}",
      "guestCount": 1
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRC-03] Giá lấy theo package_prices của đúng Space
      pm.test("[TC-PRC-03] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 3000
