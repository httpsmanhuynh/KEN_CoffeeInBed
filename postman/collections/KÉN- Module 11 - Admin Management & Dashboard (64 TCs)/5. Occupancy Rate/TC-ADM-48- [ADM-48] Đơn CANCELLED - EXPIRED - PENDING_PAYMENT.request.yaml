$kind: http-request
name: "TC-ADM-48: [ADM-48] Đơn CANCELLED / EXPIRED / PENDING_PAYMENT không chiếm chỗ (Branch: ADM-B48)"
description: |-
  **Mã TC:** ADM-48 (TC-ADM-48)
  **Nhóm:** Occupancy Rate
  **API / Thành phần:** GET /api/admin/dashboard
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; đã seed zones/spaces/bookings/booking_addons/payment_transactions.
  **Dữ liệu vào:** Space ACTIVE 1 ngày chỉ có đơn ở 3 trạng thái trên; from=to=<ngày>&zoneId=<Zone>
  **Các bước thực hiện:**
  1) GET dashboard
  **Kết quả mong đợi:** 200 occupancy.rate = 0; occupiedHours = 0 (HTTP: 200)
  **Nhánh code bao phủ:** ADM-B48
  **Ghi chú:** Theo Report: chỉ tính Booking đã thanh toán và chưa hủy (PAID_STATUSES); NO_SHOW vẫn tính vì đã thanh toán. PENDING_PAYMENT (giữ chỗ 15 phút) không tính. Tập này không còn dùng để tính doanh thu (doanh thu theo giao dịch).
url: "{{baseUrl}}/api/admin/dashboard?zoneId={{zoneId}}&from=2026-11-01&to=2026-11-01"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // [TC-ADM-48] Đơn CANCELLED / EXPIRED / PENDING_PAYMENT không chiếm chỗ
      pm.test("[TC-ADM-48] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 4000
