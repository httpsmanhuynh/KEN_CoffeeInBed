name: "TC-ADM-27: [ADM-27] Lọc theo status không hợp lệ (Branch: ADM-B27)"
description: |-
  **Mã TC:** ADM-27 (TC-ADM-27)
  **Nhóm:** Xem danh sách khách
  **API / Thành phần:** GET /api/admin/users?status
  **Loại:** Negative
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; đã seed users/bookings.
  **Dữ liệu vào:** ?status=DELETED
  **Các bước thực hiện:**
  1) GET /api/admin/users?status=DELETED
