  - type: afterResponse
    code: |-
      // [TC-ADM-32] Lịch sử Booking của khách qua endpoint Admin (phân trang, kèm Space)
      pm.test("[TC-ADM-32] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
