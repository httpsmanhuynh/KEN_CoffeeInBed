$kind: http-request
name: "TC-ADM-04: [ADM-04] Admin xem lịch sử Booking của một khách (Branch: ADM-B04)"
description: |-
  **Mã TC:** ADM-04 (TC-ADM-04)
  **Nhóm:** Xem hồ sơ & lịch sử Booking
  **API / Thành phần:** GET /api/bookings?userId
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; đã seed users/bookings.
  **Dữ liệu vào:** ?userId=<_id>
  **Các bước thực hiện:**
  1) GET /api/bookings?userId=...
  **Kết quả mong đợi:** 200 chỉ gồm đơn của khách đó (HTTP: 200)
  **Nhánh code bao phủ:** ADM-B04
  **Ghi chú:** Endpoint đã có. Review: Admin còn có GET /api/admin/users/:id/bookings (xem ADM-32); code /api/bookings không nằm trong gói đã nộp nên chưa đối chiếu.
url: "{{baseUrl}}/api/bookings?userId={{userId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // [TC-ADM-04] Admin xem lịch sử Booking của một khách
      pm.test("[TC-ADM-04] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 2000
