$kind: http-request
name: "TC-ADM-33: [ADM-33] Lọc lịch sử theo status không thuộc 7 trạng thái (Branch: ADM-B33)"
description: |-
  **Mã TC:** ADM-33 (TC-ADM-33)
  **Nhóm:** Xem hồ sơ & lịch sử Booking
  **API / Thành phần:** GET /api/admin/users/:id/bookings?status
  **Loại:** Negative
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; đã seed users/bookings.
  **Dữ liệu vào:** ?status=DELETED
  **Các bước thực hiện:**
  1) GET /api/admin/users/<id>/bookings?status=DELETED
  **Kết quả mong đợi:** 422 INVALID_STATUS (HTTP: 422)
  **Nhánh code bao phủ:** ADM-B33
  **Ghi chú:** 
url: "{{baseUrl}}/api/admin/users/{{userId}}/bookings?status=DELETED"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // [TC-ADM-33] Lọc lịch sử theo status không thuộc 7 trạng thái
      pm.test("[TC-ADM-33] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-ADM-33] Trả về 422 INVALID_STATUS", function () {
          pm.expect(pm.response.json().error).to.eql("INVALID_STATUS");
      });
    language: text/javascript
order: 7000
