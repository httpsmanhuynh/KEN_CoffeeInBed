$kind: http-request
name: "TC-ADM-14: [ADM-14] Lọc theo Zone và khoảng thời gian (Branch: ADM-B14)"
description: |-
  **Mã TC:** ADM-14 (TC-ADM-14)
  **Nhóm:** Dashboard số đơn
  **API / Thành phần:** GET /api/admin/dashboard?zoneId&from&to
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; đã seed users/bookings.
  **Dữ liệu vào:** ?zoneId=<_id hoặc zone_code>&from=2026-11-01&to=2026-11-07
  **Các bước thực hiện:**
  1) GET với bộ lọc&#10;2) Đối chiếu DB: đơn có Space thuộc Zone và start_at trong [from 00:00, to+1 00:00) giờ VN; giao dịch payment_transactions của Booking thuộc Zone có thời điểm giao dịch trong cùng khoảng
  **Kết quả mong đợi:** 200; filters.zoneId/zoneCode đúng; bookings và occupancy chỉ tính Zone và kỳ đó (theo start_at); revenue chỉ tính giao dịch của Booking thuộc Zone, theo thời điểm giao dịch trong kỳ (HTTP: 200)
  **Nhánh code bao phủ:** ADM-B14
  **Ghi chú:** Review: from/to là YYYY-MM-DD (giờ VN), không nhận ISO datetime (xem ADM-15). Cập nhật theo Report: bỏ F&B trực tiếp khỏi Dashboard.
url: "{{baseUrl}}/api/admin/dashboard?zoneId={{zoneId}}&from=2026-11-01&to=2026-11-07"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // [TC-ADM-14] Lọc theo Zone và khoảng thời gian
      pm.test("[TC-ADM-14] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 2000
