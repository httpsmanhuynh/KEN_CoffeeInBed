  1) GET dashboard với bộ lọc&#10;2) Đối chiếu booking_addons
  **Kết quả mong đợi:** 200 topAddons không chứa X (khác Zone) và Y (ngoài kỳ); số liệu khớp đối chiếu (HTTP: 200)
  **Nhánh code bao phủ:** ADM-B51
  **Ghi chú:** 
