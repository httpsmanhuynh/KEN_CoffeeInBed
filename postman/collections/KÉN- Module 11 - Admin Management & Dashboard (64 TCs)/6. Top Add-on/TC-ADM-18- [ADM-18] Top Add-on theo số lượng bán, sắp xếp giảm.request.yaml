$kind: http-request
name: "TC-ADM-18: [ADM-18] Top Add-on theo số lượng bán, sắp xếp giảm dần (Branch: ADM-B18)"
description: |-
  **Mã TC:** ADM-18 (TC-ADM-18)
  **Nhóm:** Top Add-on
  **API / Thành phần:** GET /api/admin/dashboard
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; đã seed users/bookings.
  **Dữ liệu vào:** Dữ liệu nhiều add-on; tham số mặc định (topAddons=5)
  **Các bước thực hiện:**
  1) GET /api/admin/dashboard&#10;2) Đối chiếu booking_addons của đơn CONFIRMED/CHECKED_IN/CHECKED_OUT/NO_SHOW
  **Kết quả mong đợi:** 200 topAddons[] { addonId, name, quantity, revenue, bookings } xếp giảm dần theo quantity (hòa → revenue → tên); tối đa 5 phần tử; số liệu khớp (HTTP: 200)
  **Nhánh code bao phủ:** ADM-B18
  **Ghi chú:** Review: tên field booking_addons (quantity, unit_price, line_total…) chưa xác nhận (open-questions.md); nếu sai, danh sách rỗng hoặc revenue = 0.
url: "{{baseUrl}}/api/admin/dashboard"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // [TC-ADM-18] Top Add-on theo số lượng bán, sắp xếp giảm dần
      pm.test("[TC-ADM-18] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
      pm.test("[TC-ADM-18] topAddons tối đa 5 phần tử và sắp xếp giảm dần theo quantity", function () {
          const top = pm.response.json().topAddons;
          pm.expect(top).to.be.an("array");
          pm.expect(top.length).to.be.at.most(5);
          for (let i = 1; i < top.length; i++) {
              pm.expect(top[i - 1].quantity).to.be.at.least(top[i].quantity);
          }
      });
    language: text/javascript
order: 1000
