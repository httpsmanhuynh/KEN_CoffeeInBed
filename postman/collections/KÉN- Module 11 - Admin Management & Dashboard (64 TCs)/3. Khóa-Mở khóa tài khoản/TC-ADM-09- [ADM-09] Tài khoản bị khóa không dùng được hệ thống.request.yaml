$kind: http-request
name: "TC-ADM-09: [ADM-09] Tài khoản bị khóa không dùng được hệ thống: session đang đăng nhập bị thu hồi (BR-A05) (Branch: ADM-B09)"
description: |-
  **Mã TC:** ADM-09 (TC-ADM-09)
  **Nhóm:** Khóa/Mở khóa tài khoản
  **API / Thành phần:** GET /api/me
  **Loại:** Security
  **Điều kiện tiên quyết:** Server chạy; Customer đang đăng nhập; Admin khóa tài khoản đó.
  **Dữ liệu vào:** —
  **Các bước thực hiện:**
  1) Customer đăng nhập&#10;2) Admin khóa&#10;3) Customer gọi GET /api/me
  **Kết quả mong đợi:** 401 session bị hủy ở request kế tiếp (HTTP: 401)
  **Nhánh code bao phủ:** ADM-B09
  **Ghi chú:** Review: khớp decisions.md §1 (requireAuth đọc lại DB, user bị khóa → hủy session, 401). Theo Report, BR-A05 chỉ quy định tài khoản LOCKED không đăng nhập và không đặt chỗ mới; thu hồi session là cơ chế của code. Đặt chỗ mới sau khi bị khóa xem ADM-58.
url: "{{baseUrl}}/api/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // [TC-ADM-09] Tài khoản bị khóa không dùng được hệ thống: session đang đăng nhập bị thu hồi (BR-A05)
      pm.test("[TC-ADM-09] Status code is 401", function () {
          pm.expect(pm.response.code).to.be.oneOf([401]);
      });
    language: text/javascript
order: 3000
