$kind: http-request
name: "TC-ADM-36: [ADM-36] Khóa tài khoản Admin khác (Branch: ADM-B36)"
description: |-
  **Mã TC:** ADM-36 (TC-ADM-36)
  **Nhóm:** Khóa/Mở khóa tài khoản
  **API / Thành phần:** POST /api/admin/users/:id/lock
  **Loại:** Negative
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin A; tồn tại Admin B (ACTIVE).
  **Dữ liệu vào:** id của Admin B
  **Các bước thực hiện:**
  1) POST /api/admin/users/<id-admin-B>/lock
  **Kết quả mong đợi:** 403 CANNOT_LOCK_ADMIN; Admin B vẫn ACTIVE (HTTP: 403)
  **Nhánh code bao phủ:** ADM-B36
  **Ghi chú:** 
url: "{{baseUrl}}/api/admin/users/{{admin2Id}}/lock"
method: POST
scripts:
  - type: afterResponse
    code: |-
      // [TC-ADM-36] Khóa tài khoản Admin khác
      pm.test("[TC-ADM-36] Status code is 403", function () {
          pm.expect(pm.response.code).to.be.oneOf([403]);
      });
      pm.test("[TC-ADM-36] Trả về 403 CANNOT_LOCK_ADMIN", function () {
          pm.expect(pm.response.json().error).to.eql("CANNOT_LOCK_ADMIN");
      });
    language: text/javascript
order: 8000
