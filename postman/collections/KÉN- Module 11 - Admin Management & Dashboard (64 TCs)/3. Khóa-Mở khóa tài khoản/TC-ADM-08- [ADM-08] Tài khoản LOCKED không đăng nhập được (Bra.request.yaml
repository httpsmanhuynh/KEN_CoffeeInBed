    code: |-
      // [TC-ADM-08] Tài khoản LOCKED không đăng nhập được
      pm.test("[TC-ADM-08] Status code is 403", function () {
          pm.expect(pm.response.code).to.be.oneOf([403]);
      });
    language: text/javascript
