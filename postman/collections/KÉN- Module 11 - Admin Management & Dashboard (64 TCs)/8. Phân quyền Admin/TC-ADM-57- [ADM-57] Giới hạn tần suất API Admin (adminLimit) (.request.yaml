$kind: http-request
name: "TC-ADM-57: [ADM-57] Giới hạn tần suất API Admin (adminLimit) (Branch: ADM-B57)"
description: |-
  **Mã TC:** ADM-57 (TC-ADM-57)
  **Nhóm:** Phân quyền Admin
  **API / Thành phần:** GET /api/admin/*
  **Loại:** Security
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin.
  **Dữ liệu vào:** Gọi liên tục GET /api/admin/dashboard vượt ngưỡng adminLimit
  **Các bước thực hiện:**
  1) Gửi liên tiếp nhiều request (Runner/vòng lặp)&#10;2) Quan sát mã trả về
  **Kết quả mong đợi:** 429 sau khi vượt ngưỡng; hết cửa sổ thì gọi lại được (HTTP: 429)
  **Nhánh code bao phủ:** ADM-B57
  **Ghi chú:** routes/admin.js chỉ bật adminLimit nếu middleware/rateLimit.js export adminLimit; chưa export thì API không bị giới hạn → ghi Fail/Blocked và báo dev.
url: "{{baseUrl}}/api/admin/dashboard"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // [TC-ADM-57] Giới hạn tần suất API Admin (adminLimit)
      pm.test("[TC-ADM-57] Status code is 429", function () {
          pm.expect(pm.response.code).to.be.oneOf([200,429]);
      });
    language: text/javascript
order: 5000
