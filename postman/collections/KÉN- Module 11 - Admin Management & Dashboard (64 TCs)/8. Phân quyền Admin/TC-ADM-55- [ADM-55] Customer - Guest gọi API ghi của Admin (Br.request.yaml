$kind: http-request
name: "TC-ADM-55: [ADM-55] Customer / Guest gọi API ghi của Admin (Branch: ADM-B55)"
description: |-
  **Mã TC:** ADM-55 (TC-ADM-55)
  **Nhóm:** Phân quyền Admin
  **API / Thành phần:** POST /api/admin/users/:id/lock|unlock
  **Loại:** Security
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer; có khách ACTIVE và khách LOCKED.
  **Dữ liệu vào:** Customer có cookie; Guest không cookie
  **Các bước thực hiện:**
  1) Customer POST …/lock và …/unlock&#10;2) Guest lặp lại&#10;3) Kiểm tra users.status
  **Kết quả mong đợi:** Customer 403; Guest 401; users.status không đổi (HTTP: 403)
  **Nhánh code bao phủ:** ADM-B55
  **Ghi chú:** 
url: "{{baseUrl}}/api/admin/users/{{userId}}/lock"
method: POST
scripts:
  - type: afterResponse
    code: |-
      // [TC-ADM-55] Customer / Guest gọi API ghi của Admin
      pm.test("[TC-ADM-55] Status code is 403", function () {
          pm.expect(pm.response.code).to.be.oneOf([401,403]);
      });
    language: text/javascript
order: 3000
