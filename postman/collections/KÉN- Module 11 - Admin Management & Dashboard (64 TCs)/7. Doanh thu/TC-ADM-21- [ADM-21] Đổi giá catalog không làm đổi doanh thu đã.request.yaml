$kind: http-request
name: "TC-ADM-21: [ADM-21] Đổi giá catalog không làm đổi doanh thu đã ghi nhận (doanh thu lấy từ giao dịch thực thu) (Branch: ADM-B21)"
description: |-
  **Mã TC:** ADM-21 (TC-ADM-21)
  **Nhóm:** Doanh thu
  **API / Thành phần:** GET /api/admin/dashboard
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; đã seed users/bookings.
  **Dữ liệu vào:** Đổi giá gói rồi xem doanh thu
  **Các bước thực hiện:**
  1) GET dashboard, ghi revenue.total và revenue.breakdown&#10;2) PATCH /api/pricing/<id> đổi giá gói&#10;3) GET dashboard lại
  **Kết quả mong đợi:** revenue.total và revenue.breakdown của giao dịch cũ không đổi (đọc giao dịch và Price Snapshot của Booking, không đọc giá catalog hiện tại) (HTTP: 200)
  **Nhánh code bao phủ:** ADM-B21
  **Ghi chú:** Cập nhật theo Report: trước đây assert revenue.bookings.total (final_amount snapshot).
url: "{{baseUrl}}/api/admin/dashboard"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // [TC-ADM-21] Đổi giá catalog không làm đổi doanh thu đã ghi nhận (doanh thu lấy từ giao dịch thực thu)
      pm.test("[TC-ADM-21] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 2000
