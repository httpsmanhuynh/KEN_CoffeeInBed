$kind: http-request
name: "TC-ADM-62: [ADM-62] Chỉ giao dịch thành công mới tính: PAYMENT FAILED/PENDING và đơn PENDING_PAYMENT/EXPIRED không có doanh thu (Branch: ADM-B62)"
description: |-
  **Mã TC:** ADM-62 (TC-ADM-62)
  **Nhóm:** Doanh thu
  **API / Thành phần:** GET /api/admin/dashboard
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; payment_transactions có PAYMENT FAILED 600.000 (đơn PENDING_PAYMENT) và một PAYMENT PENDING; đơn EXPIRED không có giao dịch thành công.
  **Dữ liệu vào:** Kỳ chỉ có giao dịch PAYMENT FAILED/PENDING
  **Các bước thực hiện:**
  1) GET dashboard cho kỳ trên
  **Kết quả mong đợi:** 200 revenue.total = 0; revenue.collected { amount: 0, count: 0 }; bookings.byStatus vẫn đếm các đơn PENDING_PAYMENT/EXPIRED (HTTP: 200)
  **Nhánh code bao phủ:** ADM-B62
  **Ghi chú:** Test mới theo Report (doanh thu = PAYMENT thành công − REFUND thành công).
url: "{{baseUrl}}/api/admin/dashboard"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // [TC-ADM-62] Chỉ giao dịch thành công mới tính: PAYMENT FAILED/PENDING và đơn PENDING_PAYMENT/EXPIRED không có doanh thu
      pm.test("[TC-ADM-62] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 11000
