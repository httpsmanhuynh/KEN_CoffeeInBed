$kind: http-request
name: "TC-ADM-60: [ADM-60] Hoàn tiền đang xử lý (PENDING) chưa trừ doanh thu (Branch: ADM-B60)"
description: |-
  **Mã TC:** ADM-60 (TC-ADM-60)
  **Nhóm:** Doanh thu
  **API / Thành phần:** GET /api/admin/dashboard
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; payment_transactions có PAYMENT SUCCESS 600.000 và REFUND PENDING 600.000 của cùng một đơn CANCELLED (seed trên Atlas).
  **Dữ liệu vào:** REFUND status = PENDING; kỳ chứa cả hai giao dịch
  **Các bước thực hiện:**
  1) GET dashboard cho kỳ trên&#10;2) Đổi status của REFUND thành SUCCESS trên Atlas&#10;3) GET dashboard lại
  **Kết quả mong đợi:** Bước 1: revenue.total = 600.000, revenue.refunded.count = 0. Bước 3: revenue.total = 0, revenue.refunded { amount: 600.000, count: 1 } (HTTP: 200)
  **Nhánh code bao phủ:** ADM-B60
  **Ghi chú:** Test mới theo Report (UC-31). Theo booking-5-steps.md, hủy chỉ sinh hoàn tiền REFUNDED hoặc FAILED nên phải seed tay trạng thái PENDING.
url: "{{baseUrl}}/api/admin/dashboard"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // [TC-ADM-60] Hoàn tiền đang xử lý (PENDING) chưa trừ doanh thu
      pm.test("[TC-ADM-60] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 9000
