$kind: http-request
name: "TC-ADM-64: [ADM-64] Doanh thu theo thời điểm giao dịch: thu ở kỳ trước, hoàn ở kỳ sau (Branch: ADM-B64)"
description: |-
  **Mã TC:** ADM-64 (TC-ADM-64)
  **Nhóm:** Doanh thu
  **API / Thành phần:** GET /api/admin/dashboard?from&to
  **Loại:** Boundary
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; PAYMENT SUCCESS 600.000 lúc 2026-10-20 và REFUND SUCCESS 600.000 lúc 2026-11-05 của cùng một đơn.
  **Dữ liệu vào:** ?from=2026-10-01&to=2026-10-31 ; ?from=2026-11-01&to=2026-11-30 ; ?from=2026-10-01&to=2026-11-30
  **Các bước thực hiện:**
  1) GET lần lượt từng bộ tham số
  **Kết quả mong đợi:** 200 kỳ tháng 10: revenue.total = 600.000; kỳ tháng 11: revenue.total = −600.000 (không chặn ở 0); kỳ gộp hai tháng = 0 (HTTP: 200)
  **Nhánh code bao phủ:** ADM-B64
  **Ghi chú:** Test mới theo Report ("tính theo thời điểm giao dịch"). Report không nêu rõ kỳ chỉ có hoàn tiền: theo công thức ra số âm; xác nhận với team có muốn hiển thị số âm hay không.
url: "{{baseUrl}}/api/admin/dashboard?from=2026-10-01&to=2026-11-30"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // [TC-ADM-64] Doanh thu theo thời điểm giao dịch: thu ở kỳ trước, hoàn ở kỳ sau
      pm.test("[TC-ADM-64] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 12000
