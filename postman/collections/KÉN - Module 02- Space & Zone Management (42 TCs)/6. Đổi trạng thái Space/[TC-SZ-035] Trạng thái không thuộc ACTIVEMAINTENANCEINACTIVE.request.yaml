$kind: http-request
name: '[TC-SZ-035] Trạng thái không thuộc ACTIVE/MAINTENANCE/INACTIVE'
description: '**Mã TC:** TC-SZ-035

  **Nhóm:** Đổi trạng thái Space

  **API / Thành phần:** PATCH /api/spaces/:id

  **Loại:** Negative

  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; đã seed zones/spaces/packages.

  **Dữ liệu vào:** {"status": "DELETED"}

  **Các bước thực hiện:**

  1) PATCH status

  **Kết quả mong đợi:** 422 VALIDATION_ERROR (HTTP: 422)

  **Nhánh code bao phủ:** SPC-B24

  '
