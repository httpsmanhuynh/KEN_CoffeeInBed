  **Nhóm:** Đổi trạng thái Space

  **API / Thành phần:** PATCH /api/spaces/:id

  **Loại:** Positive

  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; đã seed zones/spaces/packages.

  **Dữ liệu vào:** {"status": "ACTIVE"}

  **Các bước thực hiện:**

  1) PATCH status

  2) GET search

  **Kết quả mong đợi:** 200; Space khả dụng trở lại (HTTP: 200)

  **Nhánh code bao phủ:** SPC-B23

  '
