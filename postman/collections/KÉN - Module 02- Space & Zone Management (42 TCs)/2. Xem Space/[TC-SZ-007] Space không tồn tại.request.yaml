$kind: http-request
name: '[TC-SZ-007] Space không tồn tại'
description: '**Mã TC:** TC-SZ-007

  **Nhóm:** Xem Space

  **API / Thành phần:** GET /api/spaces/:id

  **Loại:** Negative

  **Điều kiện tiên quyết:** Server chạy; đã seed zones/spaces/packages; không cần
  đăng nhập.

  **Dữ liệu vào:** id = 000000000000000000000000

  **Các bước thực hiện:**

  1) GET /api/spaces/<id không tồn tại>

  **Kết quả mong đợi:** 404 không tìm thấy Space (HTTP: 404)

  **Nhánh code bao phủ:** SPC-B06

  '
url: '{{baseUrl}}/api/spaces/{{spaceId}}'
method: GET
headers:
- key: Content-Type
  value: application/json
order: 7000
scripts:
- type: afterResponse
  language: text/javascript
  code: "// [TC-SZ-007] Space không tồn tại\npm.test(\"[TC-SZ-007] Status code is\
    \ 404\", function () {\n    pm.expect(pm.response.code).to.be.oneOf([404]);\n\
    });\npm.test(\"[TC-SZ-007] Response valid format\", function () {\n    pm.expect(pm.response.text()).to.be.a('string');\n\
    });"
