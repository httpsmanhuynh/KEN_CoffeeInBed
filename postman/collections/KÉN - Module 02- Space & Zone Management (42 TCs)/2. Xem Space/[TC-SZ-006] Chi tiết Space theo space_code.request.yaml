$kind: http-request
name: '[TC-SZ-006] Chi tiết Space theo space_code'
description: '**Mã TC:** TC-SZ-006

  **Nhóm:** Xem Space

  **API / Thành phần:** GET /api/spaces/:id

  **Loại:** Positive

  **Điều kiện tiên quyết:** Server chạy; đã seed zones/spaces/packages; không cần
  đăng nhập.

  **Dữ liệu vào:** id = SPC-xx

  **Các bước thực hiện:**

  1) GET /api/spaces/<space_code>

  **Kết quả mong đợi:** 200 cùng dữ liệu như tra theo _id (HTTP: 200)

  **Nhánh code bao phủ:** SPC-B05

  '
url: '{{baseUrl}}/api/spaces/{{spaceId}}'
method: GET
headers:
- key: Content-Type
  value: application/json
order: 6000
scripts:
- type: afterResponse
  language: text/javascript
  code: "// [TC-SZ-006] Chi tiết Space theo space_code\npm.test(\"[TC-SZ-006] Status\
    \ code is 200\", function () {\n    pm.expect(pm.response.code).to.be.oneOf([200]);\n\
    });\npm.test(\"[TC-SZ-006] Response valid format\", function () {\n    pm.expect(pm.response.text()).to.be.a('string');\n\
    });"
