$kind: http-request
name: '[TC-SZ-025] Trùng space_code'
description: '**Mã TC:** TC-SZ-025

  **Nhóm:** Admin thêm Space

  **API / Thành phần:** POST /api/spaces

  **Loại:** Negative

  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; đã seed zones/spaces/packages.
  Đã có SPC-T01.

  **Dữ liệu vào:** {"zone_id": "<_id Zone>", "space_code": "SPC-T01", "name": "Phòng
  test", "space_type": "ROOM", "booking_mode": "EXCLUSIVE", "capacity": 6, "min_guests":
  1, "max_guests": 6, "open_time": "08:00", "close_time": "22:00", "image_url": "/img/t.png"}

  **Các bước thực hiện:**

  1) POST /api/spaces lần 2 cùng space_code

  **Kết quả mong đợi:** 409 (E11000 unique space_code) (HTTP: 409)

  **Nhánh code bao phủ:** SPC-B18

  '
url: '{{baseUrl}}/api/spaces'
method: POST
headers:
- key: Content-Type
  value: application/json
- key: x-test-role
  value: ADMIN
order: 25000
body:
  type: json
  raw: "{\n  \"zone_id\": \"<_id Zone>\",\n  \"space_code\": \"SPC-T01\",\n  \"name\"\
    : \"Phòng test\",\n  \"space_type\": \"ROOM\",\n  \"booking_mode\": \"EXCLUSIVE\"\
    ,\n  \"capacity\": 6,\n  \"min_guests\": 1,\n  \"max_guests\": 6,\n  \"open_time\"\
    : \"08:00\",\n  \"close_time\": \"22:00\",\n  \"image_url\": \"/img/t.png\"\n}"
scripts:
- type: afterResponse
  language: text/javascript
  code: "// [TC-SZ-025] Trùng space_code\npm.test(\"[TC-SZ-025] Status code is 409\"\
    , function () {\n    pm.expect(pm.response.code).to.be.oneOf([409]);\n});\npm.test(\"\
    [TC-SZ-025] Response valid format\", function () {\n    pm.expect(pm.response.text()).to.be.a('string');\n\
    });"
