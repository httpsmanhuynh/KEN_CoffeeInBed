    ,\n  \"name\": \"Phòng test\",\n  \"space_type\": \"ROOM\",\n  \"booking_mode\"\
    : \"EXCLUSIVE\",\n  \"capacity\": 6,\n  \"min_guests\": 1,\n  \"max_guests\":\
    \ 6,\n  \"open_time\": \"08:00\",\n  \"close_time\": \"22:00\",\n  \"image_url\"\
    : \"/img/t.png\"\n}"
