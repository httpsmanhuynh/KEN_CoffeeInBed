$kind: http-request
name: '[TC-SZ-027] zone_id không tồn tại'
description: '**Mã TC:** TC-SZ-027

  **Nhóm:** Admin thêm Space

  **API / Thành phần:** POST /api/spaces

  **Loại:** Negative

  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; đã seed zones/spaces/packages.

  **Dữ liệu vào:** {"zone_id": "000000000000000000000000", "space_code": "SPC-T10",
  "name": "Phòng test", "space_type": "ROOM", "booking_mode": "EXCLUSIVE", "capacity":
  6, "min_guests": 1, "max_guests": 6, "open_time": "08:00", "close_time": "22:00",
  "image_url": "/img/t.png"}

  **Các bước thực hiện:**

  1) POST /api/spaces

  **Kết quả mong đợi:** Bị từ chối (422 hoặc 404), không tạo Space mồ côi (HTTP: 422)

  **Nhánh code bao phủ:** SPC-B19

  '
