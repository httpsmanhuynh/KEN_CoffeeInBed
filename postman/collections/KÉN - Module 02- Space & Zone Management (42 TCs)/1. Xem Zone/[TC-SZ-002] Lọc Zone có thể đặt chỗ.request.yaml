  **Nhóm:** Xem Zone

  **API / Thành phần:** GET /api/zones?bookable=true

  **Loại:** Positive

  **Điều kiện tiên quyết:** Server chạy; đã seed zones/spaces/packages; không cần
  đăng nhập.

  **Dữ liệu vào:** ?bookable=true

  **Các bước thực hiện:**

  1) GET /api/zones?bookable=true

  **Kết quả mong đợi:** 200 chỉ gồm zone is_bookable=true (HTTP: 200)

  **Nhánh code bao phủ:** SPC-B02

  '
