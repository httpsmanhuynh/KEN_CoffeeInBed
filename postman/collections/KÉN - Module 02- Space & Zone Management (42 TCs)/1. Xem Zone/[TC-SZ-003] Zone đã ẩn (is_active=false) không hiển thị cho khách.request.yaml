  **Nhóm:** Xem Zone

  **API / Thành phần:** GET /api/zones

  **Loại:** Positive

  **Điều kiện tiên quyết:** Server chạy; đã seed zones/spaces/packages; không cần
  đăng nhập. Có 1 zone is_active=false.

  **Dữ liệu vào:** —

  **Các bước thực hiện:**

  1) GET /api/zones

  **Kết quả mong đợi:** 200 danh sách không chứa zone đã ẩn (HTTP: 200)

  **Nhánh code bao phủ:** SPC-B03

  '
