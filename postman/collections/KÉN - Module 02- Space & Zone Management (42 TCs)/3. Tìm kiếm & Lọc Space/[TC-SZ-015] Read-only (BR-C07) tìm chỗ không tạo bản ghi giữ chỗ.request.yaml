$kind: http-request
name: '[TC-SZ-015] Read-only (BR-C07): tìm chỗ không tạo bản ghi giữ chỗ'
description: '**Mã TC:** TC-SZ-015

  **Nhóm:** Tìm kiếm & Lọc Space

  **API / Thành phần:** GET /api/spaces?startAt

  **Loại:** Positive

  **Điều kiện tiên quyết:** Server chạy; đã seed zones/spaces/packages; không cần
  đăng nhập.

  **Dữ liệu vào:** ?startAt=...&guestCount=2

  **Các bước thực hiện:**

  1) 1) Đếm bookings

  2) 2) GET search 5 lần

  3) 3) Đếm lại bookings

  **Kết quả mong đợi:** Số bản ghi bookings không đổi (HTTP: 200)

  **Nhánh code bao phủ:** SPC-B12

  '
url: '{{baseUrl}}/api/spaces?startAt'
method: GET
headers:
- key: Content-Type
  value: application/json
order: 15000
scripts:
- type: afterResponse
  language: text/javascript
  code: "// [TC-SZ-015] Read-only (BR-C07): tìm chỗ không tạo bản ghi giữ chỗ\npm.test(\"\
    [TC-SZ-015] Status code is 200\", function () {\n    pm.expect(pm.response.code).to.be.oneOf([200]);\n\
    });\npm.test(\"[TC-SZ-015] Response valid format\", function () {\n    pm.expect(pm.response.text()).to.be.a('string');\n\
    });"
