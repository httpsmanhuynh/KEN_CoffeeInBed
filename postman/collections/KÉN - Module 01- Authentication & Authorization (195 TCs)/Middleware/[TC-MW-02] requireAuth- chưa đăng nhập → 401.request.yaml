  type: json
  content: session = {}
scripts:
  - type: afterResponse
    code: |-
      // [TC-MW-02] requireAuth: chưa đăng nhập → 401
      pm.test("[TC-MW-02] Status code is 401", function () {
          pm.expect(pm.response.code).to.be.oneOf([401]);
      });
