name: "[TC-MW-02] requireAuth: chưa đăng nhập → 401"
description: |-
  **Mã TC:** TC-MW-02
  **Loại:** Negative
  **Nhóm:** Middleware
  **Tiền điều kiện:** Unit test
  **Các bước:** npm test (node --test test/*.test.js)
  **Kết quả mong đợi:** Trả 401 UNAUTHENTICATED; next() không được gọi
  **Nhánh code:** MW-B01
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/test"
method: POST
headers:
  Content-Type: application/json
