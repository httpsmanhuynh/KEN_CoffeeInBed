$kind: http-request
name: "[TC-SS-09] Session đã bị thu hồi cũng bị chặn trên toàn bộ các route /api/profile/*"
description: |-
  **Mã TC:** TC-SS-09
  **Loại:** Security
  **Nhóm:** Thu hồi session
  **Tiền điều kiện:** Sau TC-SS-01 (phiên B đã bị thu hồi do phiên A đổi mật khẩu).
  **Các bước:** 1) Ở phiên B: gọi PATCH /api/profile/me {'fullName':'Test'}
  2) Ở phiên B: gọi POST /api/profile/me/otp {'purpose':'CHANGE_PASSWORD'}
  **Kết quả mong đợi:** Cả 2 request đều trả 401 UNAUTHENTICATED và trả header Set-Cookie xóa connect.sid (middleware loadUser trong profile.js kiểm tra pwdAt).
  **Nhánh code:** SES-B01; PRF-B01
  **Ghi chú:** Tham chiếu SS-09 (BR-A05)
url: "{{baseUrl}}/api/profile/me & POST /api/profile/me/otp"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Test Name"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-SS-09] Session đã bị thu hồi cũng bị chặn trên toàn bộ các route /api/profile/*
      pm.test("[TC-SS-09] Status code is 401", function () {
          pm.expect(pm.response.code).to.be.oneOf([401]);
      });
      pm.test("[TC-SS-09] Response contains expected code or keyword: UNAUTHENTICATED", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("UNAUTHENTICATED");
      });
    language: text/javascript
order: 7000
