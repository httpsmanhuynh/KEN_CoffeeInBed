$kind: http-request
name: "[TC-SS-11] Đổi mật khẩu thành công cấp lại Session ID mới và vô hiệu cookie cũ"
description: |-
  **Mã TC:** TC-SS-11
  **Loại:** Security
  **Nhóm:** Thu hồi session
  **Tiền điều kiện:** User đang đăng nhập tại phiên A, có OTP CHANGE_PASSWORD.
  **Các bước:** 1) Ghi lại connect.sid trước khi đổi mật khẩu (SID_cũ)
  2) Gọi POST /api/profile/me/password thành công, ghi lại connect.sid mới (SID_mới)
  3) Gọi GET /api/me bằng SID_cũ và bằng SID_mới
  **Kết quả mong đợi:** SID_mới khác SID_cũ; gọi bằng SID_cũ trả 401 UNAUTHENTICATED; gọi bằng SID_mới trả 200 OK.
  **Nhánh code:** SES-B02; PRF-B07
  **Ghi chú:** Tham chiếu SS-11 (BR-A05)
url: "{{baseUrl}}/api/profile/me/password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "password123",
      "newPassword": "newpassword123",
      "confirmPassword": "newpassword123",
      "code": "<OTP>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-SS-11] Đổi mật khẩu thành công cấp lại Session ID mới và vô hiệu cookie cũ
      pm.test("[TC-SS-11] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 401]);
      });
      pm.test("[TC-SS-11] Response contains expected code or keyword: UNAUTHENTICATED", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("UNAUTHENTICATED");
      });
    language: text/javascript
order: 9000
