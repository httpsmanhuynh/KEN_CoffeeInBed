$kind: http-request
name: "[TC-SS-03] Reset mật khẩu (quên mật khẩu) thu hồi mọi session đang hoạt động"
description: |-
  **Mã TC:** TC-SS-03
  **Loại:** Security
  **Nhóm:** Thu hồi session
  **Tiền điều kiện:** User đang có phiên C đăng nhập hợp lệ.
  **Các bước:** 1) Từ client không cần cookie: gọi forgot-password -> reset-password thành công
  2) Quay lại phiên C: gọi GET /api/me
  **Kết quả mong đợi:** Reset trả 200; phiên C gọi GET /api/me nhận 401 UNAUTHENTICATED và bị xóa cookie.
  **Nhánh code:** SES-B03
  **Ghi chú:** Tham chiếu SS-03 (BR-A07)
url: "{{baseUrl}}/api/auth/reset-password & GET /api/me"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "0909123456",
      "code": "<OTP>",
      "newPassword": "resetpass123",
      "confirmPassword": "resetpass123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-SS-03] Reset mật khẩu (quên mật khẩu) thu hồi mọi session đang hoạt động
      pm.test("[TC-SS-03] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 401]);
      });
      pm.test("[TC-SS-03] Response contains expected code or keyword: UNAUTHENTICATED", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("UNAUTHENTICATED");
      });
    language: text/javascript
order: 3000
