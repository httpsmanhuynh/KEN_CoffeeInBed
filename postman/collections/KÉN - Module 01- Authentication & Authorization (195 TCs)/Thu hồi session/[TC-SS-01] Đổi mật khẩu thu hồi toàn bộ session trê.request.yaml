$kind: http-request
name: "[TC-SS-01] Đổi mật khẩu thu hồi toàn bộ session trên trình duyệt/thiết bị khác"
description: |-
  **Mã TC:** TC-SS-01
  **Loại:** Security
  **Nhóm:** Thu hồi session
  **Tiền điều kiện:** User đang đăng nhập đồng thời trên 2 phiên A và B (2 cookie jar khác nhau).
  **Các bước:** 1) Ở phiên A: gọi POST /api/profile/me/otp (CHANGE_PASSWORD) và POST /api/profile/me/password đúng
  2) Ở phiên B: gọi GET /api/me
  **Kết quả mong đợi:** Phiên A đổi mật khẩu trả 200; phiên B gọi GET /api/me nhận 401 UNAUTHENTICATED (do pwdAt trong session B nhỏ hơn password_changed_at mới của user).
  **Nhánh code:** SES-B01; PRF-B07
  **Ghi chú:** Tham chiếu SS-01 (BR-A05)
url: "{{baseUrl}}/api/profile/me/password & GET /api/me"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "password123",
      "newPassword": "newpassword123",
      "confirmPassword": "newpassword123",
      "code": "<OTP>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-SS-01] Đổi mật khẩu thu hồi toàn bộ session trên trình duyệt/thiết bị khác
      pm.test("[TC-SS-01] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 401]);
      });
      pm.test("[TC-SS-01] Response contains expected code or keyword: UNAUTHENTICATED", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("UNAUTHENTICATED");
      });
    language: text/javascript
order: 1000
