$kind: http-request
name: "[TC-SS-05] Session cũ tạo trước bản vá (thiếu pwdAt khi user đã có password_changed_at)"
description: |-
  **Mã TC:** TC-SS-05
  **Loại:** Security
  **Nhóm:** Thu hồi session
  **Tiền điều kiện:** User có password_changed_at trong DB; session cũ trong store không có trường pwdAt.
  **Các bước:** 1) Gọi GET /api/me và GET /api/profile/me bằng cookie cũ
  2) Đăng nhập lại rồi gọi GET /api/me
  **Kết quả mong đợi:** Lần gọi bằng cookie cũ trả 401 UNAUTHENTICATED (buộc đăng nhập lại); sau khi đăng nhập lại trả 200 bình thường.
  **Nhánh code:** SES-B04
  **Ghi chú:** Tham chiếu SS-05 (BR-A05)
url: "{{baseUrl}}/api/me & GET /api/profile/me"
method: GET
headers:
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      // [TC-SS-05] Session cũ tạo trước bản vá (thiếu pwdAt khi user đã có password_changed_at)
      pm.test("[TC-SS-05] Status code is 401", function () {
          pm.expect(pm.response.code).to.be.oneOf([401, 200]);
      });
      pm.test("[TC-SS-05] Response contains expected code or keyword: UNAUTHENTICATED", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("UNAUTHENTICATED");
      });
    language: text/javascript
order: 4000
