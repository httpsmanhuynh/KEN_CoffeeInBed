$kind: http-request
name: "[TC-SS-10] Đăng nhập 2FA bước 2 cấp Session ID mới (chống Session Fixation ở bước 2FA)"
description: |-
  **Mã TC:** TC-SS-10
  **Loại:** Security
  **Nhóm:** Thu hồi session
  **Tiền điều kiện:** Tài khoản bật 2FA (two_factor_enabled=true).
  **Các bước:** 1) Gọi POST /api/auth/login bước 1, ghi lại giá trị cookie connect.sid (SID_1)
  2) Gọi POST /api/auth/login/2fa đúng OTP, ghi lại connect.sid mới (SID_2)
  3) Dùng SID_1 gọi GET /api/me; dùng SID_2 gọi GET /api/me
  **Kết quả mong đợi:** SID_2 khác SID_1; dùng SID_1 gọi GET /api/me trả 401; dùng SID_2 gọi GET /api/me trả 200.
  **Nhánh code:** SES-B07
  **Ghi chú:** Tham chiếu SS-10 (BR-A05)
url: "{{baseUrl}}/api/auth/login/2fa"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "<OTP 2FA>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-SS-10] Đăng nhập 2FA bước 2 cấp Session ID mới (chống Session Fixation ở bước 2FA)
      pm.test("[TC-SS-10] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 401]);
      });
    language: text/javascript
order: 8000
