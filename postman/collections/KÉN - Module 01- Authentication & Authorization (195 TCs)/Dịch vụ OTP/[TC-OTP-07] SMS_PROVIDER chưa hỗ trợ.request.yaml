$kind: http-request
description: |-
  **Mã TC:** TC-OTP-07
  **Loại:** Negative
  **Nhóm:** Dịch vụ OTP
  **Tiền điều kiện:** Server chạy; đã chạy npm run setup (có membership_tiers, otp_codes, users trên Atlas). SMS_PROVIDER=twilio.
  **Các bước:** 1) POST /api/auth/register (Body: raw JSON)
  2) Quan sát phản hồi
  3) Kiểm tra otp_codes/users trên Atlas
  **Kết quả mong đợi:** 500 INTERNAL_ERROR ('SMS provider chưa được hỗ trợ' trong log)
  **Nhánh code:** OTP-B05; GLB-B02
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/test"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Ngô Thị Phương Thảo",
      "phone": "0909123456",
      "email": "ngothiphuongthao@uel.edu.vn",
      "dateOfBirth": "2004-01-15",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-OTP-07] SMS_PROVIDER chưa hỗ trợ
      pm.test("[TC-OTP-07] Status code is 500", function () {
          pm.expect(pm.response.code).to.be.oneOf([500]);
      });
      pm.test("[TC-OTP-07] Response contains expected code or keyword: INTERNAL_ERROR", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("INTERNAL_ERROR");
      });
    language: text/javascript
order: 7000
