$kind: http-request
description: |-
  **Mã TC:** TC-RST-06
  **Loại:** Negative
  **Nhóm:** Đặt lại mật khẩu
  **Tiền điều kiện:** Server chạy; đã chạy npm run setup (có membership_tiers, otp_codes, users trên Atlas).
  **Các bước:** 1) POST /api/auth/reset-password (Body: phone, code, newPassword, confirmPassword)
  2) Quan sát phản hồi
  3) Đăng nhập thử bằng mật khẩu mới/cũ
  **Kết quả mong đợi:** 422 OTP_INVALID
  **Nhánh code:** RST-B02
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "0911111111",
      "code": "123456",
      "newPassword": "matkhaumoi123",
      "confirmPassword": "matkhaumoi123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-RST-06] SĐT không tồn tại
      pm.test("[TC-RST-06] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-RST-06] Response contains expected code or keyword: OTP_INVALID", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("OTP_INVALID");
      });
    language: text/javascript
order: 6000
