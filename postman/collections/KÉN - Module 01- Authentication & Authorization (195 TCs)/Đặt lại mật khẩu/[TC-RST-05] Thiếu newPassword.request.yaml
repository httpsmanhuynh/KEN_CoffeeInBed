$kind: http-request
description: |-
  **Mã TC:** TC-RST-05
  **Loại:** Negative
  **Nhóm:** Đặt lại mật khẩu
  **Tiền điều kiện:** Đã đăng ký + xác minh OTP thành công cho SĐT 0909123456 (mật khẩu password123). Đã gọi forgot-password và có OTP.
  **Các bước:** 1) POST /api/auth/reset-password (Body: phone, code, newPassword, confirmPassword)
  2) Quan sát phản hồi
  3) Đăng nhập thử bằng mật khẩu mới/cũ
  **Kết quả mong đợi:** 422 VALIDATION_ERROR
  **Nhánh code:** RST-B01
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "0909123456",
      "code": "123456"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-RST-05] Thiếu newPassword
      pm.test("[TC-RST-05] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-RST-05] Response contains expected code or keyword: VALIDATION_ERROR", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("VALIDATION_ERROR");
      });
    language: text/javascript
order: 5000
