$kind: http-request
description: |-
  **Mã TC:** TC-RST-02
  **Loại:** Boundary
  **Nhóm:** Đặt lại mật khẩu
  **Tiền điều kiện:** Đã đăng ký + xác minh OTP thành công cho SĐT 0909123456 (mật khẩu password123). Đã gọi forgot-password và có OTP.
  **Các bước:** 1) POST /api/auth/reset-password (Body: phone, code, newPassword, confirmPassword)
  2) Quan sát phản hồi
  3) Đăng nhập thử bằng mật khẩu mới/cũ
  **Kết quả mong đợi:** 200 Đã đặt lại mật khẩu
  **Nhánh code:** RST-B01; RST-B04
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "0909123456",
      "code": "<OTP>",
      "newPassword": "newpass8",
      "confirmPassword": "newpass8"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-RST-02] Mật khẩu mới đúng 8 ký tự
      pm.test("[TC-RST-02] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 2000
