$kind: http-request
description: |-
  **Mã TC:** TC-RST-01
  **Loại:** Positive
  **Nhóm:** Đặt lại mật khẩu
  **Tiền điều kiện:** Đã đăng ký + xác minh OTP thành công cho SĐT 0909123456 (mật khẩu password123). Đã gọi forgot-password và có OTP.
  **Các bước:** 1) POST /api/auth/reset-password (Body: phone, code, newPassword, confirmPassword)
  2) Quan sát phản hồi
  3) Đăng nhập thử bằng mật khẩu mới/cũ
  **Kết quả mong đợi:** 200 {message:'Đã đặt lại mật khẩu'}; password_hash đổi, updated_at đổi, users.password_changed_at được set; đăng nhập mật khẩu mới → 200; mật khẩu cũ → 401
  **Nhánh code:** RST-B04; RST-B05; OTP-B10
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "0909123456",
      "code": "<OTP>",
      "newPassword": "matkhaumoi123",
      "confirmPassword": "matkhaumoi123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-RST-01] Đặt lại mật khẩu hợp lệ
      pm.test("[TC-RST-01] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 1000
