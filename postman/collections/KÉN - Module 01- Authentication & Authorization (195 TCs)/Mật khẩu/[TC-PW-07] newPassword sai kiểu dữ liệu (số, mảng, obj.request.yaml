$kind: http-request
name: "[TC-PW-07] newPassword sai kiểu dữ liệu (số, mảng, object) ở reset-password và /me/password"
description: |-
  **Mã TC:** TC-PW-07
  **Loại:** Negative
  **Nhóm:** Mật khẩu
  **Tiền điều kiện:** Đã đăng nhập (cho /me/password) hoặc có OTP (cho reset-password).
  **Các bước:** 1) Gửi POST /api/auth/reset-password và POST /api/profile/me/password với newPassword là số 12345678, mảng ['a'], hoặc object {}
  **Kết quả mong đợi:** Trả 422 VALIDATION_ERROR, không gây lỗi 500.
  **Nhánh code:** PWD-B01; PRF-B04
  **Ghi chú:** Tham chiếu PW-07 (BR-A04)
url: "{{baseUrl}}/api/auth/reset-password & POST /api/profile/me/password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "0909123456",
      "code": "123456",
      "newPassword": 12345678,
      "confirmPassword": 12345678
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PW-07] newPassword sai kiểu dữ liệu (số, mảng, object) ở reset-password và /me/password
      pm.test("[TC-PW-07] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-PW-07] Response contains expected code or keyword: VALIDATION_ERROR", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("VALIDATION_ERROR");
      });
    language: text/javascript
order: 6000
