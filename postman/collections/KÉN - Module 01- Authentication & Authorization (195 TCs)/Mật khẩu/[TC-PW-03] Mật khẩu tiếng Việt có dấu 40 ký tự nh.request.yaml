$kind: http-request
name: "[TC-PW-03] Mật khẩu tiếng Việt có dấu 40 ký tự nhưng vượt quá 72 byte UTF-8 bị từ chối"
description: |-
  **Mã TC:** TC-PW-03
  **Loại:** Boundary
  **Nhóm:** Mật khẩu
  **Tiền điều kiện:** SĐT mới chưa đăng ký.
  **Các bước:** 1) Gửi POST /api/auth/register với mật khẩu gồm 40 ký tự 'ệ' (mỗi ký tự 'ệ' chiếm 3 byte UTF-8 -> 120 byte > 72 byte)
  **Kết quả mong đợi:** Trả 422 VALIDATION_ERROR (kiểm tra theo Buffer.byteLength(pw, 'utf8') > 72 chứ không chỉ đếmpw.length).
  **Nhánh code:** PWD-B01
  **Ghi chú:** Tham chiếu PW-03 (BR-A04)
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Test User",
      "phone": "0906666666",
      "dateOfBirth": "2004-01-15",
      "password": "<40 ký tự ệ liên tiếp = 120 byte>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PW-03] Mật khẩu tiếng Việt có dấu 40 ký tự nhưng vượt quá 72 byte UTF-8 bị từ chối
      pm.test("[TC-PW-03] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-PW-03] Response contains expected code or keyword: VALIDATION_ERROR", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("VALIDATION_ERROR");
      });
    language: text/javascript
order: 3000
