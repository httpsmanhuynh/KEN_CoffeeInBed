$kind: http-request
name: "[TC-PW-05] Đổi mật khẩu nhưng mật khẩu mới trùng hệt mật khẩu hiện tại"
description: |-
  **Mã TC:** TC-PW-05
  **Loại:** Negative
  **Nhóm:** Mật khẩu
  **Tiền điều kiện:** Đã đăng nhập; đã gọi /me/otp để lấy mã OTP CHANGE_PASSWORD.
  **Các bước:** 1) Gửi POST /api/profile/me/password với newPassword = confirmPassword = currentPassword
  2) Kiểm tra trạng thái mã OTP trong DB
  **Kết quả mong đợi:** Trả 422 {code:'VALIDATION_ERROR', message:'Mật khẩu mới phải khác mật khẩu hiện tại'}; mật khẩu không đổi và mã OTP chưa bị tiêu thụ (is_used=false).
  **Nhánh code:** PRF-B05
  **Ghi chú:** Tham chiếu PW-05 (BR-A04)
url: "{{baseUrl}}/api/profile/me/password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "password123",
      "newPassword": "password123",
      "confirmPassword": "password123",
      "code": "<OTP>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PW-05] Đổi mật khẩu nhưng mật khẩu mới trùng hệt mật khẩu hiện tại
      pm.test("[TC-PW-05] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-PW-05] Response contains expected code or keyword: VALIDATION_ERROR", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("VALIDATION_ERROR");
      });
    language: text/javascript
order: 4000
