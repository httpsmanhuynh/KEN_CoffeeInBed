$kind: http-request
name: "[TC-PW-09] Đổi mật khẩu với currentPassword sai không làm đăng xuất phiên hiện tại"
description: |-
  **Mã TC:** TC-PW-09
  **Loại:** Negative
  **Nhóm:** Mật khẩu
  **Tiền điều kiện:** Đã đăng nhập; có OTP CHANGE_PASSWORD còn hạn.
  **Các bước:** 1) Gửi POST /api/profile/me/password với currentPassword sai
  2) Gọi GET /api/me
  3) Gửi lại POST /api/profile/me/password với currentPassword đúng và cùng mã OTP
  **Kết quả mong đợi:** Bước 1 trả 422 INVALID_CURRENT_PASSWORD (không trả 401 để Angular không tự đăng xuất); Bước 2 GET /api/me vẫn 200; Bước 3 thành công 200 vì OTP chưa bị tiêu thụ ở bước 1.
  **Nhánh code:** PRF-B02; PRF-B07
  **Ghi chú:** Tham chiếu PW-09 (BR-A06)
url: "{{baseUrl}}/api/profile/me/password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "saimatkhau",
      "newPassword": "newpassword123",
      "confirmPassword": "newpassword123",
      "code": "<OTP>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PW-09] Đổi mật khẩu với currentPassword sai không làm đăng xuất phiên hiện tại
      pm.test("[TC-PW-09] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422, 200]);
      });
      pm.test("[TC-PW-09] Response contains expected code or keyword: INVALID_CURRENT_PASSWORD", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("INVALID_CURRENT_PASSWORD");
      });
    language: text/javascript
order: 8000
