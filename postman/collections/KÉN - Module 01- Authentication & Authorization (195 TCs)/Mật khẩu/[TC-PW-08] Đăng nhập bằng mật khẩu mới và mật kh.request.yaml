$kind: http-request
name: "[TC-PW-08] Đăng nhập bằng mật khẩu mới và mật khẩu cũ sau khi đổi qua /me/password"
description: |-
  **Mã TC:** TC-PW-08
  **Loại:** Positive
  **Nhóm:** Mật khẩu
  **Tiền điều kiện:** Đã đổi mật khẩu thành công từ 'password123' sang 'newpassword123' qua POST /api/profile/me/password.
  **Các bước:** 1) Gửi POST /api/auth/login với mật khẩu mới
  2) Gửi POST /api/auth/login với mật khẩu cũ
  **Kết quả mong đợi:** Mật khẩu mới trả 200 OK; mật khẩu cũ trả 401 INVALID_CREDENTIALS.
  **Nhánh code:** PRF-B07
  **Ghi chú:** Tham chiếu PW-08 (BR-A05)
url: "{{baseUrl}}/api/profile/me/password -> POST /api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "0909123456",
      "password": "newpassword123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PW-08] Đăng nhập bằng mật khẩu mới và mật khẩu cũ sau khi đổi qua /me/password
      pm.test("[TC-PW-08] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 401]);
      });
      pm.test("[TC-PW-08] Response contains expected code or keyword: INVALID_CREDENTIALS", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("INVALID_CREDENTIALS");
      });
    language: text/javascript
order: 7000
