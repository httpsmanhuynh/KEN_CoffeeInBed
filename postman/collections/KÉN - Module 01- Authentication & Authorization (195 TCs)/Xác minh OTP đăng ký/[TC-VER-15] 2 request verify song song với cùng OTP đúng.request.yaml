$kind: http-request
description: |-
  **Mã TC:** TC-VER-15
  **Loại:** Security
  **Nhóm:** Xác minh OTP đăng ký
  **Tiền điều kiện:** Đã gọi register với SĐT 0909123456 và lấy OTP từ terminal ([SMS mock]).
  **Các bước:** 1) Dùng Postman Runner / 2 tab gửi đồng thời 2 request
  2) Đếm user được tạo
  **Kết quả mong đợi:** Chỉ 1 request 200; request còn lại 422 hoặc 409; users chỉ có 1 bản ghi với SĐT
  **Nhánh code:** OTP-B11; OTP-B10
  **Ghi chú:** Race khó tái hiện bằng tay: có thể kiểm tra bằng script chạy Promise.all.
url: "{{baseUrl}}/api/auth/verify-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "0909123456",
      "code": "<OTP>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-VER-15] 2 request verify song song với cùng OTP đúng
      pm.test("[TC-VER-15] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 422]);
      });
    language: text/javascript
order: 15000
