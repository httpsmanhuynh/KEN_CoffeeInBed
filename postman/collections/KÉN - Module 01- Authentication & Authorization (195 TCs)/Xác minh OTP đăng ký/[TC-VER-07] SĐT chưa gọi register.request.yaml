$kind: http-request
description: |-
  **Mã TC:** TC-VER-07
  **Loại:** Negative
  **Nhóm:** Xác minh OTP đăng ký
  **Tiền điều kiện:** Server chạy; đã chạy npm run setup (có membership_tiers, otp_codes, users trên Atlas).
  **Các bước:** 1) POST /api/auth/verify-otp (Body: phone + code)
  2) Quan sát phản hồi
  3) Kiểm tra users/otp_codes trên Atlas
  **Kết quả mong đợi:** 422 OTP_INVALID
  **Nhánh code:** VER-B02; OTP-B07
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/verify-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "0911111111",
      "code": "123456"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-VER-07] SĐT chưa gọi register
      pm.test("[TC-VER-07] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-VER-07] Response contains expected code or keyword: OTP_INVALID", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("OTP_INVALID");
      });
    language: text/javascript
order: 7000
