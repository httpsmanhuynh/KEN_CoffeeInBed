$kind: http-request
description: |-
  **Mã TC:** TC-VER-10
  **Loại:** Negative
  **Nhóm:** Xác minh OTP đăng ký
  **Tiền điều kiện:** Đã gọi register với SĐT 0909123456 và lấy OTP từ terminal ([SMS mock]). Đặt OTP_TTL_SECONDS=1 hoặc sửa expires_at trên Atlas (lưu ý TTL index có thể xóa bản ghi sau ≤ 60 giây).
  **Các bước:** 1) POST /api/auth/verify-otp (Body: phone + code)
  2) Quan sát phản hồi
  3) Kiểm tra users/otp_codes trên Atlas
  (Chờ quá hạn trước khi gửi)
  **Kết quả mong đợi:** 422 {code:'OTP_EXPIRED', message:'Mã OTP đã hết hạn'}
  **Nhánh code:** VER-B03; OTP-B08
  **Ghi chú:** Nếu TTL index đã xóa OTP thì kết quả là OTP_INVALID: vẫn hợp lệ, ghi nhận.
url: "{{baseUrl}}/api/auth/verify-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "0909123456",
      "code": "<OTP>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-VER-10] OTP hết hạn
      pm.test("[TC-VER-10] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-VER-10] Response contains expected code or keyword: OTP_EXPIRED", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("OTP_EXPIRED");
      });
    language: text/javascript
order: 10000
