$kind: http-request
description: |-
  **Mã TC:** TC-VER-08
  **Loại:** Negative
  **Nhóm:** Xác minh OTP đăng ký
  **Tiền điều kiện:** Đã đăng ký + xác minh OTP thành công cho SĐT 0909123456 (mật khẩu password123).
  **Các bước:** 1) POST /api/auth/verify-otp (Body: phone + code)
  2) Quan sát phản hồi
  3) Kiểm tra users/otp_codes trên Atlas
  **Kết quả mong đợi:** 422 OTP_INVALID (OTP đã is_used=true)
  **Nhánh code:** VER-B02; OTP-B07
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/verify-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "0909123456",
      "code": "<OTP cũ>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-VER-08] Dùng lại OTP đã xác minh
      pm.test("[TC-VER-08] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-VER-08] Response contains expected code or keyword: OTP_INVALID", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("OTP_INVALID");
      });
    language: text/javascript
order: 8000
