$kind: http-request
description: |-
  **Mã TC:** TC-VER-14
  **Loại:** Negative
  **Nhóm:** Xác minh OTP đăng ký
  **Tiền điều kiện:** Đã gọi register với SĐT 0909123456 và lấy OTP từ terminal ([SMS mock]). Tạm đổi code của hạng BASIC thành tên khác trên Atlas.
  **Các bước:** 1) POST /api/auth/verify-otp (Body: phone + code)
  2) Quan sát phản hồi
  3) Kiểm tra users/otp_codes trên Atlas
  **Kết quả mong đợi:** 500 {code:'INTERNAL_ERROR', message:'Lỗi hệ thống'}; terminal in lỗi 'Thiếu hạng BASIC...'; không lộ stack ra client
  **Nhánh code:** VER-B05; GLB-B02
  **Ghi chú:** Nhớ khôi phục code=BASIC sau khi test.
url: "{{baseUrl}}/api/auth/verify-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "0909123456",
      "code": "<OTP>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-VER-14] Thiếu hạng BASIC trong membership_tiers
      pm.test("[TC-VER-14] Status code is 500", function () {
          pm.expect(pm.response.code).to.be.oneOf([500]);
      });
      pm.test("[TC-VER-14] Response contains expected code or keyword: INTERNAL_ERROR", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("INTERNAL_ERROR");
      });
    language: text/javascript
order: 14000
