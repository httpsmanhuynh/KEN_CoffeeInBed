$kind: http-request
name: "[TC-VER-12] Nhập đúng OTP sau khi đã bị khóa do sai quá số lần"
description: |-
  **Mã TC:** TC-VER-12
  **Loại:** Negative
  **Nhóm:** Xác minh OTP đăng ký
  **Tiền điều kiện:** Đã gọi register với SĐT 0909123456 và lấy OTP từ terminal ([SMS mock]). Đã sai 5 lần.
  **Các bước:** 1) POST /api/auth/verify-otp (Body: phone + code)
  2) Quan sát phản hồi
  3) Kiểm tra users/otp_codes trên Atlas
  **Kết quả mong đợi:** 429 OTP_TOO_MANY_ATTEMPTS; không tạo user
  **Nhánh code:** VER-B04; OTP-B09
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/verify-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "0909123456",
      "code": "<OTP đúng>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-VER-12] Nhập đúng OTP sau khi đã bị khóa do sai quá số lần
      pm.test("[TC-VER-12] Status code is 429", function () {
          pm.expect(pm.response.code).to.be.oneOf([429]);
      });
      pm.test("[TC-VER-12] Response contains expected code or keyword: OTP_TOO_MANY_ATTEMPTS", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("OTP_TOO_MANY_ATTEMPTS");
      });
    language: text/javascript
order: 12000
