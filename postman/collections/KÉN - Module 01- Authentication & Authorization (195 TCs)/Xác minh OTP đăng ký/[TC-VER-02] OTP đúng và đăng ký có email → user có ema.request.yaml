$kind: http-request
name: "[TC-VER-02] OTP đúng và đăng ký có email → user có email"
description: |-
  **Mã TC:** TC-VER-02
  **Loại:** Positive
  **Nhóm:** Xác minh OTP đăng ký
  **Tiền điều kiện:** Đã gọi register với SĐT 0909123456 và lấy OTP từ terminal ([SMS mock]). (đăng ký có email)
  **Các bước:** 1) POST /api/auth/verify-otp (Body: phone + code)
  2) Quan sát phản hồi
  3) Kiểm tra users/otp_codes trên Atlas
  **Kết quả mong đợi:** 200; users.email = email đã đăng ký (chữ thường)
  **Nhánh code:** VER-B07
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/verify-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "0909123456",
      "code": "<OTP>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-VER-02] OTP đúng và đăng ký có email → user có email
      pm.test("[TC-VER-02] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 2000
