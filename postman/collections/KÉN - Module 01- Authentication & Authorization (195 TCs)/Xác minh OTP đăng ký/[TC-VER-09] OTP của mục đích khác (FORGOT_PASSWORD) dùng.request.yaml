$kind: http-request
name: "[TC-VER-09] OTP của mục đích khác (FORGOT_PASSWORD) dùng ở verify-otp"
description: |-
  **Mã TC:** TC-VER-09
  **Loại:** Negative
  **Nhóm:** Xác minh OTP đăng ký
  **Tiền điều kiện:** Đã gọi forgot-password cho SĐT ACTIVE
  **Các bước:** 1) POST /api/auth/verify-otp (Body: phone + code)
  2) Quan sát phản hồi
  3) Kiểm tra users/otp_codes trên Atlas
  **Kết quả mong đợi:** 422 OTP_INVALID (verify-otp chỉ tìm purpose REGISTER)
  **Nhánh code:** VER-B02; OTP-B07
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/verify-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "0909123456",
      "code": "<OTP quên mật khẩu>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-VER-09] OTP của mục đích khác (FORGOT_PASSWORD) dùng ở verify-otp
      pm.test("[TC-VER-09] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-VER-09] Response contains expected code or keyword: OTP_INVALID", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("OTP_INVALID");
      });
    language: text/javascript
order: 9000
