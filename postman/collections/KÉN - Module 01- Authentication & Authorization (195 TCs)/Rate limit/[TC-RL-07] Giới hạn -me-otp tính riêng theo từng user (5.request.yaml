$kind: http-request
name: "[TC-RL-07] Giới hạn /me/otp tính riêng theo từng user (5 lần / 10 phút)"
description: |-
  **Mã TC:** TC-RL-07
  **Loại:** Negative
  **Nhóm:** Rate limit
  **Tiền điều kiện:** 2 tài khoản User A và User B cùng đang đăng nhập trên cùng IP.
  **Các bước:** 1) User A gọi POST /api/profile/me/otp (purpose=CHANGE_PASSWORD) 6 lần liên tiếp
  2) Ngay sau đó User B gọi POST /api/profile/me/otp (purpose=CHANGE_PASSWORD) 1 lần
  **Kết quả mong đợi:** User A: 5 lần đầu 200, lần thứ 6 trả 429 TOO_MANY_REQUESTS. User B: trả 200 bình thường (key giới hạn theo user._id, không theo IP).
  **Nhánh code:** RL2-B05
  **Ghi chú:** Tham chiếu RL-07 (BR-A08)
url: "{{baseUrl}}/api/profile/me/otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "purpose": "CHANGE_PASSWORD"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-RL-07] Giới hạn /me/otp tính riêng theo từng user (5 lần / 10 phút)
      pm.test("[TC-RL-07] Status code is 429", function () {
          pm.expect(pm.response.code).to.be.oneOf([429, 200]);
      });
      pm.test("[TC-RL-07] Response contains expected code or keyword: TOO_MANY_REQUESTS", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("TOO_MANY_REQUESTS");
      });
    language: text/javascript
order: 10000
