$kind: http-request
description: |-
  **Mã TC:** TC-RL-02
  **Loại:** Negative
  **Nhóm:** Rate limit
  **Tiền điều kiện:** Server chạy; đã chạy npm run setup (có membership_tiers, otp_codes, users trên Atlas).
  **Các bước:** 1) Gửi tiếp request thứ 31 ngay sau
  **Kết quả mong đợi:** 429 {code:'TOO_MANY_REQUESTS', message:'Thử lại sau ít phút'}
  **Nhánh code:** RL-B01
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/test"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: Ngay sau 30 request của TC-RL-01, gửi request thứ 31 với identifier khác (0900000031)
scripts:
  - type: afterResponse
    code: |-
      // [TC-RL-02] Request thứ 31 bị chặn
      pm.test("[TC-RL-02] Status code is 429", function () {
          pm.expect(pm.response.code).to.be.oneOf([429]);
      });
      pm.test("[TC-RL-02] Response contains expected code or keyword: TOO_MANY_REQUESTS", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("TOO_MANY_REQUESTS");
      });
    language: text/javascript
order: 2000
