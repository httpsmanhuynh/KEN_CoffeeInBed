$kind: http-request
name: "[TC-RL-14] Request chưa đăng nhập không làm tốn quota /me/otp của user"
description: |-
  **Mã TC:** TC-RL-14
  **Loại:** Positive
  **Nhóm:** Rate limit
  **Tiền điều kiện:** Cookie sạch (chưa đăng nhập), server mới.
  **Các bước:** 1) Khi chưa đăng nhập: gọi 10 lần POST /api/profile/me/otp (không cookie)
  2) Đăng nhập hợp lệ rồi gọi 5 lần POST /api/profile/me/otp (purpose=CHANGE_PASSWORD)
  **Kết quả mong đợi:** 10 lần đầu trả 401 UNAUTHENTICATED; sau khi đăng nhập cả 5 lần gọi đều trả 200 OK (do otpLimiter đặt sau middleware guard requireAuth + loadUser).
  **Nhánh code:** RL2-B08
  **Ghi chú:** Tham chiếu RL-14 (BR-A08)
url: "{{baseUrl}}/api/profile/me/otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "purpose": "CHANGE_PASSWORD"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-RL-14] Request chưa đăng nhập không làm tốn quota /me/otp của user
      pm.test("[TC-RL-14] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
      pm.test("[TC-RL-14] Response contains expected code or keyword: UNAUTHENTICATED", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("UNAUTHENTICATED");
      });
    language: text/javascript
order: 16000
