$kind: http-request
name: "[TC-RL-15] Request sai định dạng dữ liệu vẫn bị tính vào hạn mức gửi OTP"
description: |-
  **Mã TC:** TC-RL-15
  **Loại:** Negative
  **Nhóm:** Rate limit
  **Tiền điều kiện:** Server mới khởi động.
  **Các bước:** 1) Gửi 6 lần POST /api/auth/register với phone='fgfh78' (sai định dạng)
  **Kết quả mong đợi:** 5 lần đầu trả 422 VALIDATION_ERROR; lần thứ 6 trả 429 TOO_MANY_REQUESTS (limiter chạy trước bước validate).
  **Nhánh code:** RL2-B09
  **Ghi chú:** Tham chiếu RL-15 (BR-A08)
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Test",
      "phone": "fgfh78",
      "dateOfBirth": "2004-01-15",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-RL-15] Request sai định dạng dữ liệu vẫn bị tính vào hạn mức gửi OTP
      pm.test("[TC-RL-15] Status code is 429", function () {
          pm.expect(pm.response.code).to.be.oneOf([429]);
      });
      pm.test("[TC-RL-15] Response contains expected code or keyword: VALIDATION_ERROR", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("VALIDATION_ERROR");
      });
    language: text/javascript
order: 17000
