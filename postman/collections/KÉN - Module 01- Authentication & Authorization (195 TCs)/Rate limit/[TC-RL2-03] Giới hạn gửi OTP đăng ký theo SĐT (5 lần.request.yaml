$kind: http-request
name: "[TC-RL2-03] Giới hạn gửi OTP đăng ký theo SĐT (5 lần / 10 phút)"
description: |-
  **Mã TC:** TC-RL2-03
  **Loại:** Negative
  **Nhóm:** Rate limit
  **Tiền điều kiện:** Server mới khởi động; SĐT 0908888888 chưa đăng ký.
  **Các bước:** 1) Gửi 6 lần liên tiếp POST /api/auth/register hợp lệ cùng phone='0908888888'
  2) Quan sát phản hồi lần 1–5 và lần 6
  **Kết quả mong đợi:** 5 lần đầu trả 201 Đã gửi OTP xác minh; lần thứ 6 trả 429 TOO_MANY_REQUESTS.
  **Nhánh code:** RL2-B02
  **Ghi chú:** Tham chiếu RL-04 (BR-A08)
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Ngô Thị Phương Thảo",
      "phone": "0908888888",
      "dateOfBirth": "2004-01-15",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-RL2-03] Giới hạn gửi OTP đăng ký theo SĐT (5 lần / 10 phút)
      pm.test("[TC-RL2-03] Status code is 429", function () {
          pm.expect(pm.response.code).to.be.oneOf([429]);
      });
      pm.test("[TC-RL2-03] Response contains expected code or keyword: TOO_MANY_REQUESTS", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("TOO_MANY_REQUESTS");
      });
    language: text/javascript
order: 7000
