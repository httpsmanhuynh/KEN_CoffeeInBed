$kind: http-request
name: "[TC-RL-08] Giới hạn thử mật khẩu hiện tại sai theo user (10 lần / 15 phút)"
description: |-
  **Mã TC:** TC-RL-08
  **Loại:** Negative
  **Nhóm:** Rate limit
  **Tiền điều kiện:** User đã đăng nhập; server mới; body hợp lệ để chạm tới bước checkCurrentPassword.
  **Các bước:** 1) Gọi 11 lần POST /api/profile/me/password với currentPassword sai (newPassword hợp lệ)
  2) Quan sát phản hồi lần 1–10 và lần 11
  **Kết quả mong đợi:** 10 lần đầu trả 422 INVALID_CURRENT_PASSWORD; lần thứ 11 trả 429 TOO_MANY_REQUESTS. (Áp dụng tương tự cho /me/2fa, /me/phone, PATCH /me đổi email).
  **Nhánh code:** RL2-B06; PRF-B01
  **Ghi chú:** Tham chiếu RL-08 (BR-A06)
url: "{{baseUrl}}/api/profile/me/password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "sai_mat_khau",
      "newPassword": "matkhaumoi123",
      "confirmPassword": "matkhaumoi123",
      "code": "123456"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-RL-08] Giới hạn thử mật khẩu hiện tại sai theo user (10 lần / 15 phút)
      pm.test("[TC-RL-08] Status code is 429", function () {
          pm.expect(pm.response.code).to.be.oneOf([429]);
      });
      pm.test("[TC-RL-08] Response contains expected code or keyword: INVALID_CURRENT_PASSWORD", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("INVALID_CURRENT_PASSWORD");
      });
    language: text/javascript
order: 11000
