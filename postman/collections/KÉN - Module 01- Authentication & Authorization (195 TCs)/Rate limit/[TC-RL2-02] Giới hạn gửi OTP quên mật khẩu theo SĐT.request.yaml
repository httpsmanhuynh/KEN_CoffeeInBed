$kind: http-request
name: "[TC-RL2-02] Giới hạn gửi OTP quên mật khẩu theo SĐT (5 lần / 10 phút)"
description: |-
  **Mã TC:** TC-RL2-02
  **Loại:** Negative
  **Nhóm:** Rate limit
  **Tiền điều kiện:** Server mới khởi động; không cần tài khoản tồn tại.
  **Các bước:** 1) Gửi 6 lần liên tiếp POST /api/auth/forgot-password cùng phone='0901234567'
  2) Quan sát mã phản hồi ở lần 1–5 và lần 6
  **Kết quả mong đợi:** 5 lần đầu trả 200 (cùng thông điệp 'Nếu số điện thoại đã đăng ký, OTP đã được gửi'); lần thứ 6 trả 429 TOO_MANY_REQUESTS.
  **Nhánh code:** RL2-B02
  **Ghi chú:** Tham chiếu RL-03 (BR-A08)
url: "{{baseUrl}}/api/auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "0901234567"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-RL2-02] Giới hạn gửi OTP quên mật khẩu theo SĐT (5 lần / 10 phút)
      pm.test("[TC-RL2-02] Status code is 429", function () {
          pm.expect(pm.response.code).to.be.oneOf([429]);
      });
      pm.test("[TC-RL2-02] Response contains expected code or keyword: TOO_MANY_REQUESTS", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("TOO_MANY_REQUESTS");
      });
    language: text/javascript
order: 6000
