$kind: http-request
name: "[TC-RL-12] Khóa đăng nhập chuẩn hóa chữ thường (không phân biệt hoa/thường)"
description: |-
  **Mã TC:** TC-RL-12
  **Loại:** Security
  **Nhóm:** Rate limit
  **Tiền điều kiện:** Đã có user email ken@example.com; server mới.
  **Các bước:** 1) Gửi 11 lần POST /api/auth/login xen kẽ identifier 'ken@example.com' và 'KEN@Example.com' với mật khẩu sai
  **Kết quả mong đợi:** 10 lần đầu trả 401; lần thứ 11 trả 429 TOO_MANY_REQUESTS (key của loginLimiter được chuẩn hóa toLowerCase).
  **Nhánh code:** RL2-B01
  **Ghi chú:** Tham chiếu RL-12 (BR-A08)
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "KEN@Example.com",
      "password": "sai"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-RL-12] Khóa đăng nhập chuẩn hóa chữ thường (không phân biệt hoa/thường)
      pm.test("[TC-RL-12] Status code is 429", function () {
          pm.expect(pm.response.code).to.be.oneOf([429]);
      });
      pm.test("[TC-RL-12] Response contains expected code or keyword: TOO_MANY_REQUESTS", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("TOO_MANY_REQUESTS");
      });
    language: text/javascript
order: 14000
