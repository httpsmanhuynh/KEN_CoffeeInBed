$kind: http-request
name: "[TC-RL-11] OTP đăng ký và quên mật khẩu dùng chung bộ đếm theo SĐT"
description: |-
  **Mã TC:** TC-RL-11
  **Loại:** Negative
  **Nhóm:** Rate limit
  **Tiền điều kiện:** Server mới; SĐT 0907777777 chưa đăng ký.
  **Các bước:** 1) Gửi 3 lần POST /api/auth/register hợp lệ với phone='0907777777'
  2) Gửi tiếp 3 lần POST /api/auth/forgot-password với cùng phone='0907777777'
  **Kết quả mong đợi:** 5 request đầu thành công (3 lần 201, 2 lần 200); request thứ 6 (lần forgot-password thứ 3) trả 429 TOO_MANY_REQUESTS.
  **Nhánh code:** RL2-B02
  **Ghi chú:** Tham chiếu RL-11 (BR-A08)
url: "{{baseUrl}}/api/auth/register & POST /api/auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"phone": "0907777777", ...}'
scripts:
  - type: afterResponse
    code: |-
      // [TC-RL-11] OTP đăng ký và quên mật khẩu dùng chung bộ đếm theo SĐT
      pm.test("[TC-RL-11] Status code is 429", function () {
          pm.expect(pm.response.code).to.be.oneOf([429]);
      });
      pm.test("[TC-RL-11] Response contains expected code or keyword: TOO_MANY_REQUESTS", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("TOO_MANY_REQUESTS");
      });
    language: text/javascript
order: 13000
