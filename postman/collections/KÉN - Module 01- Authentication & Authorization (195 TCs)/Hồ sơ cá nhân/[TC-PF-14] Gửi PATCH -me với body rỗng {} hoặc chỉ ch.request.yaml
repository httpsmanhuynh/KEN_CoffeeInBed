$kind: http-request
name: "[TC-PF-14] Gửi PATCH /me với body rỗng {} hoặc chỉ chứa trường lạ không hỗ trợ"
description: |-
  **Mã TC:** TC-PF-14
  **Loại:** Negative
  **Nhóm:** Hồ sơ cá nhân
  **Tiền điều kiện:** User đã đăng nhập.
  **Các bước:** 1) Gửi PATCH /api/profile/me với body {} và {'foo': 1}
  **Kết quả mong đợi:** Trả 422 {code:'VALIDATION_ERROR', message:'Không có thông tin để cập nhật'}.
  **Nhánh code:** PRF-B14
  **Ghi chú:** Tham chiếu PF-14 (BR-A06)
url: "{{baseUrl}}/api/profile/me"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: '{} và {"foo": 1}'
scripts:
  - type: afterResponse
    code: |-
      // [TC-PF-14] Gửi PATCH /me với body rỗng {} hoặc chỉ chứa trường lạ không hỗ trợ
      pm.test("[TC-PF-14] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-PF-14] Response contains expected code or keyword: VALIDATION_ERROR", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("VALIDATION_ERROR");
      });
    language: text/javascript
order: 14000
