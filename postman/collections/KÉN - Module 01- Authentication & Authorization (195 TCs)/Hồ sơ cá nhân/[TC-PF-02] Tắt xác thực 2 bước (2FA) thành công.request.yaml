$kind: http-request
description: |-
  **Mã TC:** TC-PF-02
  **Loại:** Positive
  **Nhóm:** Hồ sơ cá nhân
  **Tiền điều kiện:** User đang bật 2FA (two_factor_enabled=true); đã gọi /me/otp với purpose='TOGGLE_2FA'.
  **Các bước:** 1) Gửi POST /api/profile/me/2fa với enabled=false, currentPassword đúng và OTP đúng
  2) Đăng xuất rồi đăng nhập lại
  **Kết quả mong đợi:** Trả 200 {twoFactorEnabled: false}; lần đăng nhập tiếp theo vào thẳng (không còn yêu cầu OTP 2FA).
  **Nhánh code:** PRF-B08; OTP-B10
  **Ghi chú:** Tham chiếu PF-02 (BR-A06)
url: "{{baseUrl}}/api/profile/me/2fa"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "enabled": false,
      "currentPassword": "password123",
      "code": "<OTP>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PF-02] Tắt xác thực 2 bước (2FA) thành công
      pm.test("[TC-PF-02] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 2000
