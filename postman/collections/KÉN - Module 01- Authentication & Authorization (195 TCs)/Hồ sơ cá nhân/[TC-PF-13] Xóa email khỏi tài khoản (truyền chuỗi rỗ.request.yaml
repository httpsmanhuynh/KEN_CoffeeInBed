$kind: http-request
name: "[TC-PF-13] Xóa email khỏi tài khoản (truyền chuỗi rỗng email: '')"
description: |-
  **Mã TC:** TC-PF-13
  **Loại:** Positive
  **Nhóm:** Hồ sơ cá nhân
  **Tiền điều kiện:** User đang đăng nhập và đã có email.
  **Các bước:** 1) Gửi PATCH /api/profile/me với {'email':'', 'currentPassword':'password123'}
  2) Kiểm tra document user trên Atlas
  **Kết quả mong đợi:** Trả 200 OK; publicUser.email = null; trong MongoDB trường email được $unset hoàn toàn khỏi document (tránh đụng unique index).
  **Nhánh code:** PRF-B13
  **Ghi chú:** Tham chiếu PF-13 (BR-A06)
url: "{{baseUrl}}/api/profile/me"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "",
      "currentPassword": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PF-13] Xóa email khỏi tài khoản (truyền chuỗi rỗng email: '')
      pm.test("[TC-PF-13] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 13000
