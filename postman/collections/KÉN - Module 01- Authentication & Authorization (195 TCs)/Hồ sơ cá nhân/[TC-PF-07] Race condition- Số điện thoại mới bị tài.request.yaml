$kind: http-request
name: "[TC-PF-07] Race condition: Số điện thoại mới bị tài khoản khác đăng ký chiếm sau khi đã gửi OTP"
description: |-
  **Mã TC:** TC-PF-07
  **Loại:** Negative
  **Nhóm:** Hồ sơ cá nhân
  **Tiền điều kiện:** User A xin OTP CHANGE_PHONE cho số X (0917777777); trước khi A xác nhận, User C hoàn tất đăng ký tài khoản mới với số X.
  **Các bước:** 1) User A gửi POST /api/profile/me/phone với newPhone='0917777777' và OTP đúng
  **Kết quả mong đợi:** Trả 409 {code:'PHONE_EXISTS', message:'Số điện thoại đã được đăng ký'} (bắt lỗi E11000 từ unique index uq_users_phone).
  **Nhánh code:** PRF-B09; DB-B01
  **Ghi chú:** Tham chiếu PF-07 (BR-A02)
url: "{{baseUrl}}/api/profile/me/phone"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "newPhone": "0917777777",
      "currentPassword": "password123",
      "code": "<OTP của A>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PF-07] Race condition: Số điện thoại mới bị tài khoản khác đăng ký chiếm sau khi đã gửi OTP
      pm.test("[TC-PF-07] Status code is 409", function () {
          pm.expect(pm.response.code).to.be.oneOf([409]);
      });
      pm.test("[TC-PF-07] Response contains expected code or keyword: PHONE_EXISTS", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("PHONE_EXISTS");
      });
    language: text/javascript
order: 7000
