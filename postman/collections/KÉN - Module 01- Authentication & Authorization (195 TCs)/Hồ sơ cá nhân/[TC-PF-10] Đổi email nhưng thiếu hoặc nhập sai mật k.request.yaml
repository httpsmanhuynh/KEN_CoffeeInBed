$kind: http-request
name: "[TC-PF-10] Đổi email nhưng thiếu hoặc nhập sai mật khẩu hiện tại"
description: |-
  **Mã TC:** TC-PF-10
  **Loại:** Negative
  **Nhóm:** Hồ sơ cá nhân
  **Tiền điều kiện:** User đã đăng nhập.
  **Các bước:** 1) Gửi PATCH /api/profile/me {'email':'a@b.com'} không kèm currentPassword
  2) Gửi tiếp với currentPassword sai
  **Kết quả mong đợi:** Cả 2 lần trả 422 INVALID_CURRENT_PASSWORD (không trả 401); phiên đăng nhập vẫn giữ nguyên.
  **Nhánh code:** PRF-B02; PRF-B12
  **Ghi chú:** Tham chiếu PF-10 (BR-A06)
url: "{{baseUrl}}/api/profile/me"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email": "a@b.com"} và {"email": "a@b.com", "currentPassword": "sai"}'
scripts:
  - type: afterResponse
    code: |-
      // [TC-PF-10] Đổi email nhưng thiếu hoặc nhập sai mật khẩu hiện tại
      pm.test("[TC-PF-10] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-PF-10] Response contains expected code or keyword: INVALID_CURRENT_PASSWORD", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("INVALID_CURRENT_PASSWORD");
      });
    language: text/javascript
order: 10000
