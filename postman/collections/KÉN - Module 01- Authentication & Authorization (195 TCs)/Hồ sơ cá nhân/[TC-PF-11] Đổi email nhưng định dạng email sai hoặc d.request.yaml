$kind: http-request
name: "[TC-PF-11] Đổi email nhưng định dạng email sai hoặc dài quá 100 ký tự"
description: |-
  **Mã TC:** TC-PF-11
  **Loại:** Negative
  **Nhóm:** Hồ sơ cá nhân
  **Tiền điều kiện:** User đã đăng nhập.
  **Các bước:** 1) Gửi PATCH /api/profile/me với email='abc' hoặc email dài 101 ký tự
  **Kết quả mong đợi:** Trả 422 {code:'VALIDATION_ERROR', message:'Email không hợp lệ'}.
  **Nhánh code:** PRF-B12
  **Ghi chú:** Tham chiếu PF-11 (BR-A06)
url: "{{baseUrl}}/api/profile/me"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "abc",
      "currentPassword": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PF-11] Đổi email nhưng định dạng email sai hoặc dài quá 100 ký tự
      pm.test("[TC-PF-11] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-PF-11] Response contains expected code or keyword: VALIDATION_ERROR", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("VALIDATION_ERROR");
      });
    language: text/javascript
order: 11000
