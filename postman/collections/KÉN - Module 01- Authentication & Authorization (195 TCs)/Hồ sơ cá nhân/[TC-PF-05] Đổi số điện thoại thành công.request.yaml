$kind: http-request
description: |-
  **Mã TC:** TC-PF-05
  **Loại:** Positive
  **Nhóm:** Hồ sơ cá nhân
  **Tiền điều kiện:** User đã đăng nhập; đã gọi /me/otp (CHANGE_PHONE) tới số mới 0912345678.
  **Các bước:** 1) Gửi POST /api/profile/me/phone với newPhone, currentPassword đúng và code đúng
  2) Thử đăng nhập bằng SĐT mới và SĐT cũ
  **Kết quả mong đợi:** Trả 200 {message:'Đã đổi số điện thoại', phone:'0912345678'}; đăng nhập bằng SĐT mới trả 200; đăng nhập bằng SĐT cũ trả 401.
  **Nhánh code:** PRF-B09; OTP-B10
  **Ghi chú:** Tham chiếu PF-05 (BR-A06)
url: "{{baseUrl}}/api/profile/me/phone"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "newPhone": "0912345678",
      "currentPassword": "password123",
      "code": "<OTP>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PF-05] Đổi số điện thoại thành công
      pm.test("[TC-PF-05] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 5000
