$kind: http-request
description: |-
  **Mã TC:** TC-ME-04
  **Loại:** Security
  **Nhóm:** Hồ sơ
  **Tiền điều kiện:** Server chạy; đã chạy npm run setup (có membership_tiers, otp_codes, users trên Atlas).
  **Các bước:** 1) GET /api/profile với cookie giả
  **Kết quả mong đợi:** 401 UNAUTHENTICATED
  **Nhánh code:** ME-B01
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/me"
method: GET
headers:
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      // [TC-ME-04] Cookie connect.sid giả mạo
      pm.test("[TC-ME-04] Status code is 401", function () {
          pm.expect(pm.response.code).to.be.oneOf([401]);
      });
      pm.test("[TC-ME-04] Response contains expected code or keyword: UNAUTHENTICATED", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("UNAUTHENTICATED");
      });
    language: text/javascript
order: 4000
