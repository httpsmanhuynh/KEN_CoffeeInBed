$kind: http-request
description: |-
  **Mã TC:** TC-ME-05
  **Loại:** Negative
  **Nhóm:** Hồ sơ
  **Tiền điều kiện:** Đã đăng nhập thành công (Postman giữ cookie connect.sid). Giảm tạm maxAge session còn vài giây.
  **Các bước:** 1) Đăng nhập
  2) Chờ quá maxAge
  3) GET /api/profile
  **Kết quả mong đợi:** 401 UNAUTHENTICATED
  **Nhánh code:** ME-B01
  **Ghi chú:** Khôi phục maxAge=24h sau khi test.
url: "{{baseUrl}}/api/auth/me"
method: GET
headers:
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      // [TC-ME-05] Phiên hết hạn (cookie maxAge)
      pm.test("[TC-ME-05] Status code is 401", function () {
          pm.expect(pm.response.code).to.be.oneOf([401]);
      });
      pm.test("[TC-ME-05] Response contains expected code or keyword: UNAUTHENTICATED", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("UNAUTHENTICATED");
      });
    language: text/javascript
order: 5000
