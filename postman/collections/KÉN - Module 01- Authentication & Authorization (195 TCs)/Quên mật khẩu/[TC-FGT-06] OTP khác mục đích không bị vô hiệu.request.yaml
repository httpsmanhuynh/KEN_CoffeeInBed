$kind: http-request
description: |-
  **Mã TC:** TC-FGT-06
  **Loại:** Positive
  **Nhóm:** Quên mật khẩu
  **Tiền điều kiện:** Đã đăng ký + xác minh OTP thành công cho SĐT 0909123456 (mật khẩu password123). Đang có OTP 2FA_LOGIN chưa dùng.
  **Các bước:** 1) POST /api/auth/forgot-password (Body: phone)
  2) Quan sát phản hồi và terminal
  3) Kiểm tra otp_codes
  **Kết quả mong đợi:** OTP 2FA_LOGIN vẫn is_used=false; chỉ OTP FORGOT_PASSWORD cũ bị đánh dấu
  **Nhánh code:** OTP-B14
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "0909123456"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-FGT-06] OTP khác mục đích không bị vô hiệu
      pm.test("[TC-FGT-06] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
      pm.test("[TC-FGT-06] Response contains expected code or keyword: FORGOT_PASSWORD", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("FORGOT_PASSWORD");
      });
    language: text/javascript
order: 6000
