$kind: http-request
description: |-
  **Mã TC:** TC-FGT-03
  **Loại:** Negative
  **Nhóm:** Quên mật khẩu
  **Tiền điều kiện:** Đã đăng ký + xác minh OTP thành công cho SĐT 0909123456 (mật khẩu password123). status='LOCKED'.
  **Các bước:** 1) POST /api/auth/forgot-password (Body: phone)
  2) Quan sát phản hồi và terminal
  3) Kiểm tra otp_codes
  **Kết quả mong đợi:** 200 {message:'Nếu số điện thoại đã đăng ký, OTP đã được gửi'}; KHÔNG tạo OTP
  **Nhánh code:** FGT-B02
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "0909123456"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-FGT-03] SĐT thuộc tài khoản LOCKED
      pm.test("[TC-FGT-03] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 3000
