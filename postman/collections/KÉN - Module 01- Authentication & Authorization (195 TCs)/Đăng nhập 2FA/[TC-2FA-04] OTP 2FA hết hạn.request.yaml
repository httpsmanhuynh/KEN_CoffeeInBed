$kind: http-request
description: |-
  **Mã TC:** TC-2FA-04
  **Loại:** Negative
  **Nhóm:** Đăng nhập 2FA
  **Tiền điều kiện:** Đã đăng ký + xác minh OTP thành công cho SĐT 0909123456 (mật khẩu password123). two_factor_enabled=true; đã gọi login (bước 1) và có OTP 2FA_LOGIN. Cho OTP quá hạn.
  **Các bước:** 1) POST /api/auth/login/2fa (Body: code) cùng cookie của bước 1
  2) Quan sát phản hồi
  3) GET /api/profile
  **Kết quả mong đợi:** 422 OTP_EXPIRED
  **Nhánh code:** TFA-B04; OTP-B08
  **Ghi chú:** Có thể gặp OTP_INVALID nếu TTL index đã xóa bản ghi.
url: "{{baseUrl}}/api/auth/login/2fa"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "<OTP>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-2FA-04] OTP 2FA hết hạn
      pm.test("[TC-2FA-04] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-2FA-04] Response contains expected code or keyword: OTP_EXPIRED", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("OTP_EXPIRED");
      });
    language: text/javascript
order: 4000
