$kind: http-request
description: |-
  **Mã TC:** TC-2FA-06
  **Loại:** Negative
  **Nhóm:** Đăng nhập 2FA
  **Tiền điều kiện:** Đã đăng ký + xác minh OTP thành công cho SĐT 0909123456 (mật khẩu password123). two_factor_enabled=true; đã gọi login (bước 1) và có OTP 2FA_LOGIN. Đã gọi forgot-password.
  **Các bước:** 1) POST /api/auth/login/2fa (Body: code) cùng cookie của bước 1
  2) Quan sát phản hồi
  3) GET /api/profile
  **Kết quả mong đợi:** 422 OTP_INVALID
  **Nhánh code:** TFA-B04; OTP-B07
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/login/2fa"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "<OTP quên mật khẩu>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-2FA-06] OTP của mục đích khác (FORGOT_PASSWORD)
      pm.test("[TC-2FA-06] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-2FA-06] Response contains expected code or keyword: OTP_INVALID", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("OTP_INVALID");
      });
    language: text/javascript
order: 6000
