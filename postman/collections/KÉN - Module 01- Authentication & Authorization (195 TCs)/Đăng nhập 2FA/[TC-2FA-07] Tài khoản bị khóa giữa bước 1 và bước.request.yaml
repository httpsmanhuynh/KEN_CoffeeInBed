$kind: http-request
name: "[TC-2FA-07] Tài khoản bị khóa giữa bước 1 và bước 2"
description: |-
  **Mã TC:** TC-2FA-07
  **Loại:** Negative
  **Nhóm:** Đăng nhập 2FA
  **Tiền điều kiện:** Đã đăng ký + xác minh OTP thành công cho SĐT 0909123456 (mật khẩu password123). two_factor_enabled=true; đã gọi login (bước 1) và có OTP 2FA_LOGIN. Sau bước 1, đặt status='LOCKED'.
  **Các bước:** 1) POST /api/auth/login/2fa (Body: code) cùng cookie của bước 1
  2) Quan sát phản hồi
  3) GET /api/profile
  **Kết quả mong đợi:** 403 ACCOUNT_LOCKED
  **Nhánh code:** TFA-B02
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/login/2fa"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "<OTP>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-2FA-07] Tài khoản bị khóa giữa bước 1 và bước 2
      pm.test("[TC-2FA-07] Status code is 403", function () {
          pm.expect(pm.response.code).to.be.oneOf([403]);
      });
      pm.test("[TC-2FA-07] Response contains expected code or keyword: ACCOUNT_LOCKED", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("ACCOUNT_LOCKED");
      });
    language: text/javascript
order: 7000
