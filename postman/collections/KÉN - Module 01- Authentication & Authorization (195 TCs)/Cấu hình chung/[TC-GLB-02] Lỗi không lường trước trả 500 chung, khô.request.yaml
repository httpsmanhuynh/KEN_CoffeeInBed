$kind: http-request
name: "[TC-GLB-02] Lỗi không lường trước trả 500 chung, không lộ stack"
description: |-
  **Mã TC:** TC-GLB-02
  **Loại:** Negative
  **Nhóm:** Cấu hình chung
  **Tiền điều kiện:** Server chạy; đã chạy npm run setup (có membership_tiers, otp_codes, users trên Atlas). Gây lỗi (xem TC-VER-14).
  **Các bước:** 1) Kích hoạt lỗi server
  2) Xem response
  **Kết quả mong đợi:** 500 {code:'INTERNAL_ERROR', message:'Lỗi hệ thống'}; body không chứa stack/đường dẫn file
  **Nhánh code:** GLB-B02
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/test"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      // [TC-GLB-02] Lỗi không lường trước trả 500 chung, không lộ stack
      pm.test("[TC-GLB-02] Status code is 500", function () {
          pm.expect(pm.response.code).to.be.oneOf([500]);
      });
      pm.test("[TC-GLB-02] Response contains expected code or keyword: INTERNAL_ERROR", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("INTERNAL_ERROR");
      });
    language: text/javascript
order: 2000
