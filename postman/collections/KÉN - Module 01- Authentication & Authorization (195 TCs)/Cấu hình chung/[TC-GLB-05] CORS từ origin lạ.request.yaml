$kind: http-request
name: "[TC-GLB-05] CORS từ origin lạ"
description: |-
  **Mã TC:** TC-GLB-05
  **Loại:** Security
  **Nhóm:** Cấu hình chung
  **Tiền điều kiện:** Server chạy; đã chạy npm run setup (có membership_tiers, otp_codes, users trên Atlas).
  **Các bước:** 1) Gửi request với Origin lạ
  2) Xem response headers
  **Kết quả mong đợi:** Không có Access-Control-Allow-Origin cho origin lạ (trình duyệt chặn)
  **Nhánh code:** GLB-B04
  **Ghi chú:** Đã cấu hình backend chặn origin lạ, không gửi Access-Control-Allow-Origin.
url: "{{baseUrl}}/"
method: GET
headers:
  - key: Origin
    value: http://evil.example.com
scripts:
  - type: afterResponse
    code: |-
      // [TC-GLB-05] CORS từ origin lạ
      pm.test("[TC-GLB-05] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
      pm.test("[TC-GLB-05] Không có Access-Control-Allow-Origin cho origin lạ", function () {
          var originHeader = pm.response.headers.get("Access-Control-Allow-Origin");
          pm.expect(originHeader).to.not.equal("http://evil.example.com");
      });
    language: text/javascript
order: 5000
