$kind: http-request
description: |-
  **Mã TC:** TC-GLB-05
  **Loại:** Security
  **Nhóm:** Cấu hình chung
  **Tiền điều kiện:** Server chạy; đã chạy npm run setup (có membership_tiers, otp_codes, users trên Atlas).
  **Các bước:** 1) Gửi request với Origin lạ
  2) Xem response headers
  **Kết quả mong đợi:** Không có Access-Control-Allow-Origin cho origin lạ (trình duyệt chặn)
  **Nhánh code:** GLB-B04
  **Ghi chú:** HTTP 200 PASS, kiểm tra 'Không bật CORS origin lạ' FAIL. Cần báo Backend kiểm tra cấu hình CORS; không khẳng định origin lạ đọc được response.
url: "{{baseUrl}}/api/auth/test"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "Header Origin: http://evil.example.com"
scripts:
  - type: afterResponse
    code: |-
      // [TC-GLB-05] CORS từ origin lạ
      pm.test("[TC-GLB-05] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 5000
