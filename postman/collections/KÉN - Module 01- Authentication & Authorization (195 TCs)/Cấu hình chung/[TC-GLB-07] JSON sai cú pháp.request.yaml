$kind: http-request
description: |-
  **Mã TC:** TC-GLB-07
  **Loại:** Negative
  **Nhóm:** Cấu hình chung
  **Tiền điều kiện:** Server chạy; đã chạy npm run setup (có membership_tiers, otp_codes, users trên Atlas).
  **Các bước:** 1) POST /api/auth/login với JSON bị cắt dở
  **Kết quả mong đợi:** 400 {code:'BAD_REQUEST', message:'Yêu cầu không hợp lệ'}.
  **Nhánh code:** GLB-B05
  **Ghi chú:** index.js đã trả 400 theo err.status, kỳ vọng Pass.
url: "{{baseUrl}}/api/auth/test"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"phone": "0909'
scripts:
  - type: afterResponse
    code: |-
      // [TC-GLB-07] JSON sai cú pháp
      pm.test("[TC-GLB-07] Status code is 400", function () {
          pm.expect(pm.response.code).to.be.oneOf([400]);
      });
      pm.test("[TC-GLB-07] Response contains expected code or keyword: BAD_REQUEST", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("BAD_REQUEST");
      });
    language: text/javascript
order: 7000
