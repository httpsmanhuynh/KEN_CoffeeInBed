$kind: http-request
description: |-
  **Mã TC:** TC-GLB-11
  **Loại:** Security
  **Nhóm:** Cấu hình chung
  **Tiền điều kiện:** Đã đăng nhập thành công (Postman giữ cookie connect.sid).
  **Các bước:** 1) Đăng nhập
  2) Xem Set-Cookie
  **Kết quả mong đợi:** connect.sid có HttpOnly và SameSite=Lax; có Secure khi NODE_ENV=production; Max-Age ~ 24 giờ
  **Nhánh code:** GLB-B09
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/test"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      // [TC-GLB-11] Cờ cookie phiên
      pm.test("[TC-GLB-11] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
      pm.test("[TC-GLB-11] Response contains expected code or keyword: NODE_ENV", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("NODE_ENV");
      });
    language: text/javascript
order: 11000
