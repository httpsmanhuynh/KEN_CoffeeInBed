$kind: http-request
description: |-
  **Mã TC:** TC-GLB-06
  **Loại:** Boundary
  **Nhóm:** Cấu hình chung
  **Tiền điều kiện:** Server chạy; đã chạy npm run setup (có membership_tiers, otp_codes, users trên Atlas).
  **Các bước:** 1) POST /api/auth/register với body lớn
  **Kết quả mong đợi:** 413 {code:'PAYLOAD_TOO_LARGE', message:'Yêu cầu không hợp lệ'}; không tạo dữ liệu
  **Nhánh code:** GLB-B05
  **Ghi chú:** index.js đã trả 413 theo err.status, kỳ vọng Pass.
url: "{{baseUrl}}/api/auth/test"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: JSON ~1.5MB
scripts:
  - type: afterResponse
    code: |-
      // [TC-GLB-06] Body JSON lớn hơn 1MB
      pm.test("[TC-GLB-06] Status code is 413", function () {
          pm.expect(pm.response.code).to.be.oneOf([413]);
      });
      pm.test("[TC-GLB-06] Response contains expected code or keyword: PAYLOAD_TOO_LARGE", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("PAYLOAD_TOO_LARGE");
      });
    language: text/javascript
order: 6000
