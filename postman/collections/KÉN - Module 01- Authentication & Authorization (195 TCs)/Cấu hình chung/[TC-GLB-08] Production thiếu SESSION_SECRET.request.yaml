$kind: http-request
description: |-
  **Mã TC:** TC-GLB-08
  **Loại:** Security
  **Nhóm:** Cấu hình chung
  **Tiền điều kiện:** Đặt NODE_ENV=production, bỏ SESSION_SECRET
  **Các bước:** 1) npm start
  **Kết quả mong đợi:** Server throw 'SESSION_SECRET is required in production' khi khởi động
  **Nhánh code:** GLB-B06
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/test"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      // [TC-GLB-08] Production thiếu SESSION_SECRET
      pm.test("[TC-GLB-08] Status code is —", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
      pm.test("[TC-GLB-08] Response contains expected code or keyword: SESSION_SECRET", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("SESSION_SECRET");
      });
    language: text/javascript
order: 8000
