$kind: http-request
description: |-
  **Mã TC:** TC-LOG-03
  **Loại:** Positive
  **Nhóm:** Đăng nhập
  **Tiền điều kiện:** Đã đăng ký + xác minh OTP thành công cho SĐT 0909123456 (mật khẩu password123). (đăng ký có email)
  **Các bước:** 1) POST /api/auth/login (Body: identifier + password)
  2) Quan sát phản hồi và header Set-Cookie
  3) GET /api/profile để xác nhận phiên
  **Kết quả mong đợi:** 200 (email được toLowerCase)
  **Nhánh code:** LOG-B05; LOG-B04
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "NgoThiPhuongThao@UEL.edu.vn",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-LOG-03] Đăng nhập bằng email viết HOA
      pm.test("[TC-LOG-03] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 3000
