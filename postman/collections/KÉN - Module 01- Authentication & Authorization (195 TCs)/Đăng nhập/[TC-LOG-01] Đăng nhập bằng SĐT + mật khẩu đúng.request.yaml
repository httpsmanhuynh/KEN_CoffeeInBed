$kind: http-request
description: |-
  **Mã TC:** TC-LOG-01
  **Loại:** Positive
  **Nhóm:** Đăng nhập
  **Tiền điều kiện:** Đã đăng ký + xác minh OTP thành công cho SĐT 0909123456 (mật khẩu password123).
  **Các bước:** 1) POST /api/auth/login (Body: identifier + password)
  2) Quan sát phản hồi và header Set-Cookie
  3) GET /api/profile để xác nhận phiên
  **Kết quả mong đợi:** 200 {user:{id, fullName, phone, email, role:'CUSTOMER', twoFactorEnabled:false, membershipTier:'BASIC', tierPoints:0, coinsBalance:0}}; có Set-Cookie connect.sid (HttpOnly); response KHÔNG chứa password_hash; /profile trả 200
  **Nhánh code:** LOG-B04; ME-B03
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "0909123456",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-LOG-01] Đăng nhập bằng SĐT + mật khẩu đúng
      pm.test("[TC-LOG-01] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 1000
