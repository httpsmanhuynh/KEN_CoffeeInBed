$kind: http-request
name: "[TC-LOG-13] Session ID đổi sau khi đăng nhập (chống session fixation)"
description: |-
  **Mã TC:** TC-LOG-13
  **Loại:** Security
  **Nhóm:** Đăng nhập
  **Tiền điều kiện:** Đã đăng ký + xác minh OTP thành công cho SĐT 0909123456 (mật khẩu password123).
  **Các bước:** 1) GET / hoặc login lỗi để lấy connect.sid cũ
  2) Đăng nhập thành công
  3) So sánh connect.sid
  **Kết quả mong đợi:** connect.sid sau đăng nhập khác connect.sid trước đăng nhập
  **Nhánh code:** LOG-B04; MW-B05
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "0909123456",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-LOG-13] Session ID đổi sau khi đăng nhập (chống session fixation)
      pm.test("[TC-LOG-13] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 13000
