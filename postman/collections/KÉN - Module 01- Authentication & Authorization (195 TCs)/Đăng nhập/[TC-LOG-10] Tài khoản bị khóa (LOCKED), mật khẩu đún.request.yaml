$kind: http-request
name: "[TC-LOG-10] Tài khoản bị khóa (LOCKED), mật khẩu đúng"
description: |-
  **Mã TC:** TC-LOG-10
  **Loại:** Negative
  **Nhóm:** Đăng nhập
  **Tiền điều kiện:** Đã đăng ký + xác minh OTP thành công cho SĐT 0909123456 (mật khẩu password123). Đặt users.status='LOCKED' trên Atlas.
  **Các bước:** 1) POST /api/auth/login (Body: identifier + password)
  2) Quan sát phản hồi và header Set-Cookie
  3) GET /api/profile để xác nhận phiên
  **Kết quả mong đợi:** 403 {code:'ACCOUNT_LOCKED', message:'Tài khoản đã bị khóa'}
  **Nhánh code:** LOG-B02
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "0909123456",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-LOG-10] Tài khoản bị khóa (LOCKED), mật khẩu đúng
      pm.test("[TC-LOG-10] Status code is 403", function () {
          pm.expect(pm.response.code).to.be.oneOf([403]);
      });
      pm.test("[TC-LOG-10] Response contains expected code or keyword: ACCOUNT_LOCKED", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("ACCOUNT_LOCKED");
      });
    language: text/javascript
order: 10000
