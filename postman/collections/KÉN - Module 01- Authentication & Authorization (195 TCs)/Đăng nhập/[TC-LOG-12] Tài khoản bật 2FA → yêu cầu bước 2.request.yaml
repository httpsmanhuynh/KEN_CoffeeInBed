$kind: http-request
description: |-
  **Mã TC:** TC-LOG-12
  **Loại:** Positive
  **Nhóm:** Đăng nhập
  **Tiền điều kiện:** Đã đăng ký + xác minh OTP thành công cho SĐT 0909123456 (mật khẩu password123). Đặt users.two_factor_enabled=true trên Atlas.
  **Các bước:** 1) POST /api/auth/login (Body: identifier + password)
  2) Quan sát phản hồi và header Set-Cookie
  3) GET /api/profile để xác nhận phiên
  **Kết quả mong đợi:** 200 {requires2FA:true}; otp_codes có OTP purpose=2FA_LOGIN với user_id; terminal in OTP; GET /profile vẫn 401 (chưa có session.user)
  **Nhánh code:** LOG-B03
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "0909123456",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-LOG-12] Tài khoản bật 2FA → yêu cầu bước 2
      pm.test("[TC-LOG-12] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 12000
