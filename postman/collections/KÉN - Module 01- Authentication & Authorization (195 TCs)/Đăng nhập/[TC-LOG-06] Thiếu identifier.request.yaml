$kind: http-request
description: |-
  **Mã TC:** TC-LOG-06
  **Loại:** Negative
  **Nhóm:** Đăng nhập
  **Tiền điều kiện:** Server chạy; đã chạy npm run setup (có membership_tiers, otp_codes, users trên Atlas).
  **Các bước:** 1) POST /api/auth/login (Body: identifier + password)
  2) Quan sát phản hồi và header Set-Cookie
  3) GET /api/profile để xác nhận phiên
  **Kết quả mong đợi:** 401 INVALID_CREDENTIALS
  **Nhánh code:** LOG-B06; LOG-B01
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-LOG-06] Thiếu identifier
      pm.test("[TC-LOG-06] Status code is 401", function () {
          pm.expect(pm.response.code).to.be.oneOf([401]);
      });
      pm.test("[TC-LOG-06] Response contains expected code or keyword: INVALID_CREDENTIALS", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("INVALID_CREDENTIALS");
      });
    language: text/javascript
order: 6000
