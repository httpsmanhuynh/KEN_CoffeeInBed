$kind: http-request
name: "[TC-CF-01] Cấu hình CORS động theo biến môi trường CORS_ORIGIN"
description: |-
  **Mã TC:** TC-CF-01
  **Loại:** Positive
  **Nhóm:** Cấu hình / deploy
  **Tiền điều kiện:** Đặt biến môi trường CORS_ORIGIN=http://localhost:4200 (hoặc domain cấu hình).
  **Các bước:** 1) Gửi request kèm Origin khớp CORS_ORIGIN
  2) Gửi request kèm Origin khác
  **Kết quả mong đợi:** Origin khớp có header Access-Control-Allow-Origin và Access-Control-Allow-Credentials: true; origin khác không được cấp header.
  **Nhánh code:** GLB-B04
  **Ghi chú:** Tham chiếu CF-01
url: "{{baseUrl}}/api/auth/test"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "Header Origin: http://localhost:4200 vs Origin: http://other.com"
scripts:
  - type: afterResponse
    code: |-
      // [TC-CF-01] Cấu hình CORS động theo biến môi trường CORS_ORIGIN
      pm.test("[TC-CF-01] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 1000
