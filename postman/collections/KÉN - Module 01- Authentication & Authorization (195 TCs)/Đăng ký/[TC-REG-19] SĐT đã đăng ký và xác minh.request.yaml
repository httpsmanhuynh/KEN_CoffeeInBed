$kind: http-request
description: |-
  **Mã TC:** TC-REG-19
  **Loại:** Negative
  **Nhóm:** Đăng ký
  **Tiền điều kiện:** Đã đăng ký + xác minh OTP thành công cho SĐT 0909123456 (mật khẩu password123).
  **Các bước:** 1) POST /api/auth/register (Body: raw JSON)
  2) Quan sát phản hồi
  3) Kiểm tra otp_codes/users trên Atlas
  **Kết quả mong đợi:** 409 {code:'PHONE_EXISTS', message:'Số điện thoại đã được đăng ký'}
  **Nhánh code:** REG-B06
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Ngô Thị Phương Thảo",
      "phone": "0909123456",
      "dateOfBirth": "2004-01-15",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-REG-19] SĐT đã đăng ký và xác minh
      pm.test("[TC-REG-19] Status code is 409", function () {
          pm.expect(pm.response.code).to.be.oneOf([409]);
      });
      pm.test("[TC-REG-19] Response contains expected code or keyword: PHONE_EXISTS", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("PHONE_EXISTS");
      });
    language: text/javascript
order: 19000
