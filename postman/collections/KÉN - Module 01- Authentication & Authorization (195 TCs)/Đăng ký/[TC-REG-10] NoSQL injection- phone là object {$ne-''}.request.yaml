$kind: http-request
name: "[TC-REG-10] NoSQL injection: phone là object {$ne:''}"
description: |-
  **Mã TC:** TC-REG-10
  **Loại:** Security
  **Nhóm:** Đăng ký
  **Tiền điều kiện:** Server chạy; đã chạy npm run setup (có membership_tiers, otp_codes, users trên Atlas).
  **Các bước:** 1) POST /api/auth/register (Body: raw JSON)
  2) Quan sát phản hồi
  3) Kiểm tra otp_codes/users trên Atlas
  **Kết quả mong đợi:** 422 VALIDATION_ERROR (hàm str() chặn object), không lỗi 500
  **Nhánh code:** REG-B02
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Test User",
      "phone": {
        "$ne": ""
      },
      "dateOfBirth": "2004-01-15",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-REG-10] NoSQL injection: phone là object {$ne:''}
      pm.test("[TC-REG-10] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-REG-10] Response contains expected code or keyword: VALIDATION_ERROR", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("VALIDATION_ERROR");
      });
    language: text/javascript
order: 10000
