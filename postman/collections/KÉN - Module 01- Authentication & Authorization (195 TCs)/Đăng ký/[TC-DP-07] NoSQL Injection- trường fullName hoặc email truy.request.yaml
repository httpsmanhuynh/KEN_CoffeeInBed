$kind: http-request
name: "[TC-DP-07] NoSQL Injection: trường fullName hoặc email truyền vào là object {$gt:''}"
description: |-
  **Mã TC:** TC-DP-07
  **Loại:** Security
  **Nhóm:** Đăng ký
  **Tiền điều kiện:** Server đang chạy.
  **Các bước:** 1) Gửi POST /api/auth/register với fullName là object {'$gt':''} hoặc email là {'$ne':null}
  **Kết quả mong đợi:** Trả 422 VALIDATION_ERROR (hàm str() ép mọi giá trị không phải string về chuỗi rỗng ''), không lỗi 500.
  **Nhánh code:** REG2-B01; REG2-B05
  **Ghi chú:** Tham chiếu DP-07 (Mở rộng TC-REG-10 cho fullName/email)
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": {
        "$gt": ""
      },
      "phone": "0905555555",
      "email": {
        "$ne": null
      },
      "dateOfBirth": "2004-01-15",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-DP-07] NoSQL Injection: trường fullName hoặc email truyền vào là object {$gt:''}
      pm.test("[TC-DP-07] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-DP-07] Response contains expected code or keyword: VALIDATION_ERROR", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("VALIDATION_ERROR");
      });
    language: text/javascript
order: 25000
