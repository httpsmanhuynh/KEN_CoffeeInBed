$kind: http-request
name: "[TC-REG-21] Email trùng nhưng khác chữ hoa/thường"
description: |-
  **Mã TC:** TC-REG-21
  **Loại:** Negative
  **Nhóm:** Đăng ký
  **Tiền điều kiện:** Đã đăng ký + xác minh OTP thành công cho SĐT 0909123456 (mật khẩu password123).
  **Các bước:** 1) POST /api/auth/register (Body: raw JSON)
  2) Quan sát phản hồi
  3) Kiểm tra otp_codes/users trên Atlas
  **Kết quả mong đợi:** 409 EMAIL_EXISTS (email được toLowerCase trước khi so sánh)
  **Nhánh code:** REG-B07
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Ngô Thị Phương Thảo",
      "phone": "0909999999",
      "email": "NgoThiPhuongThao@UEL.edu.vn",
      "dateOfBirth": "2004-01-15",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-REG-21] Email trùng nhưng khác chữ hoa/thường
      pm.test("[TC-REG-21] Status code is 409", function () {
          pm.expect(pm.response.code).to.be.oneOf([409]);
      });
      pm.test("[TC-REG-21] Response contains expected code or keyword: EMAIL_EXISTS", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("EMAIL_EXISTS");
      });
    language: text/javascript
order: 21000
