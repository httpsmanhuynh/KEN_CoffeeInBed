  type: json
  content: |-
    {
      "fullName": "Ngô Thị Phương Thảo",
      "phone": "0909123456",
      "email": "abc@",
      "dateOfBirth": "2004-01-15",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-REG-17] email sai định dạng
      pm.test("[TC-REG-17] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
