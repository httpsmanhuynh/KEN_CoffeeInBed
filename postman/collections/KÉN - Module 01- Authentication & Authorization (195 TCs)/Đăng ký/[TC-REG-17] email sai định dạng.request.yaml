$kind: http-request
description: |-
  **Mã TC:** TC-REG-17
  **Loại:** Negative
  **Nhóm:** Đăng ký
  **Tiền điều kiện:** Server chạy; đã chạy npm run setup (có membership_tiers, otp_codes, users trên Atlas).
  **Các bước:** 1) POST /api/auth/register (Body: raw JSON)
  2) Quan sát phản hồi
  3) Kiểm tra otp_codes/users trên Atlas
  **Kết quả mong đợi:** 422 {code:'VALIDATION_ERROR', message:'Thông tin đăng ký không hợp lệ'}; không có bản ghi mới trong otp_codes
  **Nhánh code:** REG-B05
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
