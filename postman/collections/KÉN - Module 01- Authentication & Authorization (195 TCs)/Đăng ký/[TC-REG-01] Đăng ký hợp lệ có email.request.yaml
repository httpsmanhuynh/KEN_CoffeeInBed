$kind: http-request
description: |-
  **Mã TC:** TC-REG-01
  **Loại:** Positive
  **Nhóm:** Đăng ký
  **Tiền điều kiện:** Server chạy; đã chạy npm run setup (có membership_tiers, otp_codes, users trên Atlas).
  **Các bước:** 1) POST /api/auth/register (Body: raw JSON)
  2) Quan sát phản hồi
  3) Kiểm tra otp_codes/users trên Atlas
  4) Xem terminal lấy OTP
  **Kết quả mong đợi:** 201 {message:'Đã gửi OTP xác minh'}. otp_codes có 1 bản ghi purpose=REGISTER, user_id=null, pending_data (full_name, email, date_of_birth, password_hash đã băm bcrypt). users CHƯA có SĐT này. Terminal in '[SMS mock] <sđt>: Ma OTP KEN...'
  **Nhánh code:** REG-B08; OTP-B01; OTP-B02; OTP-B03
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Ngô Thị Phương Thảo",
      "phone": "0909123456",
      "email": "ngothiphuongthao@uel.edu.vn",
      "dateOfBirth": "2004-01-15",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-REG-01] Đăng ký hợp lệ có email
      pm.test("[TC-REG-01] Status code is 201", function () {
          pm.expect(pm.response.code).to.be.oneOf([201]);
      });
      pm.test("[TC-REG-01] Response contains expected code or keyword: REGISTER", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("REGISTER");
      });
    language: text/javascript
order: 1000
