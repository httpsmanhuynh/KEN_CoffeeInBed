$kind: http-request
name: "[TC-OT-12] Chặn dùng OTP của người khác (otpNotOwned): User B dùng OTP CHANGE_PHONE do User A yêu cầu"
description: |-
  **Mã TC:** TC-OT-12
  **Loại:** Security
  **Nhóm:** OTP Hồ sơ
  **Tiền điều kiện:** User A và User B đều đang đăng nhập; User A gọi /me/otp xin đổi sang số mới X (0918888888) và nhận được mã OTP_A.
  **Các bước:** 1) User B gọi POST /api/profile/me/phone với newPhone='0918888888', currentPassword của B và code=OTP_A
  **Kết quả mong đợi:** Trả 422 OTP_INVALID (hàm otpNotOwned phát hiện otp.user_id !== B._id); SĐT của B không đổi.
  **Nhánh code:** PRF-B06; PRF-B10
  **Ghi chú:** Tham chiếu OT-12 (BR-A08)
url: "{{baseUrl}}/api/profile/me/phone"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "newPhone": "0918888888",
      "currentPassword": "<MK của B>",
      "code": "<OTP_A>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-OT-12] Chặn dùng OTP của người khác (otpNotOwned): User B dùng OTP CHANGE_PHONE do User A yêu cầu
      pm.test("[TC-OT-12] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-OT-12] Response contains expected code or keyword: OTP_INVALID", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("OTP_INVALID");
      });
    language: text/javascript
order: 12000
