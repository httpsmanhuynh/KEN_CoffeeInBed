$kind: http-request
name: "[TC-OT-04] Yêu cầu OTP CHANGE_PHONE nhưng newPhone trùng với số điện thoại hiện tại"
description: |-
  **Mã TC:** TC-OT-04
  **Loại:** Negative
  **Nhóm:** OTP Hồ sơ
  **Tiền điều kiện:** User đã đăng nhập (SĐT hiện tại 0909123456).
  **Các bước:** 1) Gửi POST /api/profile/me/otp với purpose='CHANGE_PHONE', newPhone='0909123456'
  **Kết quả mong đợi:** Trả 422 {code:'PHONE_UNCHANGED', message:'Số điện thoại mới trùng số hiện tại'}; không sinh OTP.
  **Nhánh code:** PRF-B03
  **Ghi chú:** Tham chiếu OT-04 (BR-A06)
url: "{{baseUrl}}/api/profile/me/otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "purpose": "CHANGE_PHONE",
      "newPhone": "0909123456"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-OT-04] Yêu cầu OTP CHANGE_PHONE nhưng newPhone trùng với số điện thoại hiện tại
      pm.test("[TC-OT-04] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-OT-04] Response contains expected code or keyword: PHONE_UNCHANGED", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("PHONE_UNCHANGED");
      });
    language: text/javascript
order: 4000
