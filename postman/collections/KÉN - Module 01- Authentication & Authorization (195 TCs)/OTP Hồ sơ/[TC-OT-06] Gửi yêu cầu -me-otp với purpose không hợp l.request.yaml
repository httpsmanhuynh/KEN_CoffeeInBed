$kind: http-request
name: "[TC-OT-06] Gửi yêu cầu /me/otp với purpose không hợp lệ (REGISTER, FORGOT_PASSWORD, rỗng, object)"
description: |-
  **Mã TC:** TC-OT-06
  **Loại:** Negative
  **Nhóm:** OTP Hồ sơ
  **Tiền điều kiện:** User đã đăng nhập.
  **Các bước:** 1) Lần lượt gửi POST /api/profile/me/otp với purpose='FORGOT_PASSWORD', 'REGISTER', '', thiếu, hoặc object
  **Kết quả mong đợi:** Tất cả đều trả 422 {code:'VALIDATION_ERROR', message:'Mục đích OTP không hợp lệ'}; không tạo bản ghi OTP.
  **Nhánh code:** PRF-B03
  **Ghi chú:** Tham chiếu OT-06 (BR-A06)
url: "{{baseUrl}}/api/profile/me/otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"purpose": "FORGOT_PASSWORD"} / {"purpose": "REGISTER"} / {} / {"purpose": {"$ne": ""}}'
scripts:
  - type: afterResponse
    code: |-
      // [TC-OT-06] Gửi yêu cầu /me/otp với purpose không hợp lệ (REGISTER, FORGOT_PASSWORD, rỗng, object)
      pm.test("[TC-OT-06] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-OT-06] Response contains expected code or keyword: VALIDATION_ERROR", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("VALIDATION_ERROR");
      });
    language: text/javascript
order: 6000
