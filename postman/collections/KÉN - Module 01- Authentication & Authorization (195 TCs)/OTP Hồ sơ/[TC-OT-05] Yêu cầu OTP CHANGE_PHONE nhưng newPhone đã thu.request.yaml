$kind: http-request
name: "[TC-OT-05] Yêu cầu OTP CHANGE_PHONE nhưng newPhone đã thuộc về user khác"
description: |-
  **Mã TC:** TC-OT-05
  **Loại:** Negative
  **Nhóm:** OTP Hồ sơ
  **Tiền điều kiện:** User A đang đăng nhập; số 0901112222 đã thuộc về User B.
  **Các bước:** 1) User A gửi POST /api/profile/me/otp với purpose='CHANGE_PHONE', newPhone='0901112222'
  **Kết quả mong đợi:** Trả 409 {code:'PHONE_EXISTS', message:'Số điện thoại đã được đăng ký'}; không sinh OTP.
  **Nhánh code:** PRF-B03
  **Ghi chú:** Tham chiếu OT-05 (BR-A02)
url: "{{baseUrl}}/api/profile/me/otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "purpose": "CHANGE_PHONE",
      "newPhone": "0901112222"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-OT-05] Yêu cầu OTP CHANGE_PHONE nhưng newPhone đã thuộc về user khác
      pm.test("[TC-OT-05] Status code is 409", function () {
          pm.expect(pm.response.code).to.be.oneOf([409]);
      });
      pm.test("[TC-OT-05] Response contains expected code or keyword: PHONE_EXISTS", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("PHONE_EXISTS");
      });
    language: text/javascript
order: 5000
