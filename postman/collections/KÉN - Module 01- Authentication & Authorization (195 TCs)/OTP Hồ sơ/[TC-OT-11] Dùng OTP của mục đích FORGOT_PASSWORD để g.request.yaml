$kind: http-request
name: "[TC-OT-11] Dùng OTP của mục đích FORGOT_PASSWORD để gọi API đổi mật khẩu /me/password"
description: |-
  **Mã TC:** TC-OT-11
  **Loại:** Security
  **Nhóm:** OTP Hồ sơ
  **Tiền điều kiện:** User đang đăng nhập; gọi /api/auth/forgot-password để lấy mã OTP FORGOT_PASSWORD của chính SĐT đó.
  **Các bước:** 1) Dùng mã OTP FORGOT_PASSWORD gửi vào POST /api/profile/me/password
  **Kết quả mong đợi:** Trả 422 OTP_INVALID (do verifyOtp truy vấn theo purpose='CHANGE_PASSWORD').
  **Nhánh code:** PRF-B06; OTP-B07
  **Ghi chú:** Tham chiếu OT-11 (BR-A08)
url: "{{baseUrl}}/api/profile/me/password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "password123",
      "newPassword": "newpassword123",
      "confirmPassword": "newpassword123",
      "code": "<OTP FORGOT_PASSWORD>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-OT-11] Dùng OTP của mục đích FORGOT_PASSWORD để gọi API đổi mật khẩu /me/password
      pm.test("[TC-OT-11] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-OT-11] Response contains expected code or keyword: OTP_INVALID", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("OTP_INVALID");
      });
    language: text/javascript
order: 11000
