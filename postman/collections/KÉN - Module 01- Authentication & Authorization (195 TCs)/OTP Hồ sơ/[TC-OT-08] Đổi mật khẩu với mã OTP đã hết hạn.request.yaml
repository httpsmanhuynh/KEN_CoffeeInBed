$kind: http-request
description: |-
  **Mã TC:** TC-OT-08
  **Loại:** Negative
  **Nhóm:** OTP Hồ sơ
  **Tiền điều kiện:** Đã đăng nhập; có OTP CHANGE_PASSWORD nhưng đã quá hạn (chờ hết TTL hoặc chỉnh expires_at trên Atlas).
  **Các bước:** 1) Gửi POST /api/profile/me/password với mã OTP đã hết hạn
  **Kết quả mong đợi:** Trả 422 {code:'OTP_EXPIRED', message:'Mã OTP đã hết hạn'} (hoặc OTP_INVALID nếu TTL index đã xóa).
  **Nhánh code:** PRF-B06; OTP-B08
  **Ghi chú:** Tham chiếu OT-08 (BR-A08)
url: "{{baseUrl}}/api/profile/me/password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "password123",
      "newPassword": "newpassword123",
      "confirmPassword": "newpassword123",
      "code": "<OTP đúng>"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-OT-08] Đổi mật khẩu với mã OTP đã hết hạn
      pm.test("[TC-OT-08] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-OT-08] Response contains expected code or keyword: OTP_EXPIRED", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("OTP_EXPIRED");
      });
    language: text/javascript
order: 8000
