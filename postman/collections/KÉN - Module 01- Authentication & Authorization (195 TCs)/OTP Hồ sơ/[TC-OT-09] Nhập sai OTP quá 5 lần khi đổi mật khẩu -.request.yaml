$kind: http-request
name: "[TC-OT-09] Nhập sai OTP quá 5 lần khi đổi mật khẩu -> khóa OTP"
description: |-
  **Mã TC:** TC-OT-09
  **Loại:** Negative
  **Nhóm:** OTP Hồ sơ
  **Tiền điều kiện:** Đã đăng nhập; có OTP CHANGE_PASSWORD còn hạn.
  **Các bước:** 1) Gửi 5 lần POST /api/profile/me/password với code sai
  2) Lần thứ 6 gửi lại với code ĐÚNG
  **Kết quả mong đợi:** Lần 1–4 trả 422 OTP_INVALID; lần 5 trả 429 OTP_TOO_MANY_ATTEMPTS; lần 6 nhập code đúng vẫn trả 429 (OTP đã bị vô hiệu).
  **Nhánh code:** PRF-B06; OTP-B12; OTP-B09
  **Ghi chú:** Tham chiếu OT-09 (BR-A08)
url: "{{baseUrl}}/api/profile/me/password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "password123",
      "newPassword": "newpassword123",
      "confirmPassword": "newpassword123",
      "code": "000000"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-OT-09] Nhập sai OTP quá 5 lần khi đổi mật khẩu -> khóa OTP
      pm.test("[TC-OT-09] Status code is 429", function () {
          pm.expect(pm.response.code).to.be.oneOf([429]);
      });
      pm.test("[TC-OT-09] Response contains expected code or keyword: OTP_INVALID", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("OTP_INVALID");
      });
    language: text/javascript
order: 9000
