$kind: http-request
name: "[TC-OT-01] Gửi OTP đổi mật khẩu (CHANGE_PASSWORD) và bật/tắt 2FA (TOGGLE_2FA) về SĐT hiện tại"
description: |-
  **Mã TC:** TC-OT-01
  **Loại:** Positive
  **Nhóm:** OTP Hồ sơ
  **Tiền điều kiện:** User đã đăng nhập (SĐT hiện tại 0909123456).
  **Các bước:** 1) Gửi POST /api/profile/me/otp với {'purpose':'CHANGE_PASSWORD'}
  2) Gửi POST /api/profile/me/otp với {'purpose':'TOGGLE_2FA'}
  3) Kiểm tra bản ghi trong otp_codes và terminal
  **Kết quả mong đợi:** Cả hai trả 200 {message:'Đã gửi OTP về số điện thoại đã đăng ký'}; otp_codes lưu đúng user_id của user và phone='0909123456'.
  **Nhánh code:** PRF-B03; OTP-B01
  **Ghi chú:** Tham chiếu OT-01 (BR-A08)
url: "{{baseUrl}}/api/profile/me/otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"purpose": "CHANGE_PASSWORD"} và {"purpose": "TOGGLE_2FA"}'
scripts:
  - type: afterResponse
    code: |-
      // [TC-OT-01] Gửi OTP đổi mật khẩu (CHANGE_PASSWORD) và bật/tắt 2FA (TOGGLE_2FA) về SĐT hiện tại
      pm.test("[TC-OT-01] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 1000
