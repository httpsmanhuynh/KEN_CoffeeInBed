$kind: http-request
name: "[TC-OT-03] Yêu cầu OTP CHANGE_PHONE với newPhone sai định dạng hoặc bị thiếu"
description: |-
  **Mã TC:** TC-OT-03
  **Loại:** Negative
  **Nhóm:** OTP Hồ sơ
  **Tiền điều kiện:** User đã đăng nhập.
  **Các bước:** 1) Gửi POST /api/profile/me/otp với purpose='CHANGE_PHONE', newPhone='123'
  2) Gửi tiếp nhưng không truyền trường newPhone
  **Kết quả mong đợi:** Cả 2 lần đều trả 422 {code:'VALIDATION_ERROR', message:'Số điện thoại mới không hợp lệ'}; không sinh OTP.
  **Nhánh code:** PRF-B03
  **Ghi chú:** Tham chiếu OT-03 (BR-A06)
url: "{{baseUrl}}/api/profile/me/otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"purpose": "CHANGE_PHONE", "newPhone": "123"} và {"purpose": "CHANGE_PHONE"}'
scripts:
  - type: afterResponse
    code: |-
      // [TC-OT-03] Yêu cầu OTP CHANGE_PHONE với newPhone sai định dạng hoặc bị thiếu
      pm.test("[TC-OT-03] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-OT-03] Response contains expected code or keyword: VALIDATION_ERROR", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("VALIDATION_ERROR");
      });
    language: text/javascript
order: 3000
