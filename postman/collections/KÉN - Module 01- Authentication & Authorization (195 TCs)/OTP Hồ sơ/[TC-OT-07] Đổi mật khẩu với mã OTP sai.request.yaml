$kind: http-request
description: |-
  **Mã TC:** TC-OT-07
  **Loại:** Negative
  **Nhóm:** OTP Hồ sơ
  **Tiền điều kiện:** Đã đăng nhập; đã gọi /me/otp lấy mã OTP CHANGE_PASSWORD.
  **Các bước:** 1) Gửi POST /api/profile/me/password với currentPassword đúng nhưng code='000000' (sai)
  **Kết quả mong đợi:** Trả 422 {code:'OTP_INVALID', message:'Mã OTP không đúng'}; attempt_count tăng 1; mật khẩu không thay đổi.
  **Nhánh code:** PRF-B06; OTP-B13
  **Ghi chú:** Tham chiếu OT-07 (BR-A08)
url: "{{baseUrl}}/api/profile/me/password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "password123",
      "newPassword": "newpassword123",
      "confirmPassword": "newpassword123",
      "code": "000000"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-OT-07] Đổi mật khẩu với mã OTP sai
      pm.test("[TC-OT-07] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
      pm.test("[TC-OT-07] Response contains expected code or keyword: OTP_INVALID", function () {
          var resText = pm.response.text();
          pm.expect(resText).to.include("OTP_INVALID");
      });
    language: text/javascript
order: 7000
