$kind: http-request
name: "TC-REC-06: [REC-06] Lọc dự báo nguyên vật liệu và số lượng món theo khoảng thời gian ?from&to (Branch: REC-B06)"
description: |-
  **Mã TC:** REC-06 (TC-REC-06)
  **Nhóm:** Admin Forecast nguyên vật liệu & món
  **API / Thành phần:** GET /api/admin/forecast/ingredients?from&to
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; đã import kết quả mô hình ML.
  **Dữ liệu vào:** ?from={{fromDate}}&to={{toDate}}
  **Các bước thực hiện:**
  1) GET /api/admin/forecast/ingredients?from={{fromDate}}&to={{toDate}}
  **Kết quả mong đợi:** 200 chỉ tính tổng dự báo số lượng món và nguyên vật liệu của các ngày nằm trong khoảng [from, to] (HTTP: 200)
  **Nhánh code bao phủ:** REC-B06
url: "{{baseUrl}}/api/admin/forecast/ingredients?from={{fromDate}}&to={{toDate}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // [TC-REC-06] Lọc dự báo theo khoảng thời gian
      pm.test("[TC-REC-06] Status code is 200", function () {
          pm.expect(pm.response.code).to.eql(200);
      });
      pm.test("[TC-REC-06] Bộ lọc filters.from và filters.to khớp tham số truyền vào", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("filters");
          pm.expect(json.filters.from).to.be.a("string");
          pm.expect(json.filters.to).to.be.a("string");
      });
    language: text/javascript
order: 2000
