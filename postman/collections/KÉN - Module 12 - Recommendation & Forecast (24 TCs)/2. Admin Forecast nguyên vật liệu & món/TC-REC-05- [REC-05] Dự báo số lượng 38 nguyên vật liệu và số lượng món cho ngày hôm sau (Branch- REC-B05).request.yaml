$kind: http-request
name: "TC-REC-05: [REC-05] Truy xuất dự báo số lượng 38 nguyên vật liệu và số lượng món (dishes) cho ngày hôm sau từ ML (Branch: REC-B05)"
description: |-
  **Mã TC:** REC-05 (TC-REC-05)
  **Nhóm:** Admin Forecast nguyên vật liệu & món
  **API / Thành phần:** GET /api/admin/forecast (hoặc /api/admin/forecast/ingredients)
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; đã có dữ liệu dự báo ngày hôm sau trong demand_forecasts.
  **Dữ liệu vào:** — (mặc định ngày hôm sau theo giờ VN)
  **Các bước thực hiện:**
  1) GET /api/admin/forecast/ingredients&#10;2) Kiểm tra targetDate = ngày hôm sau, danh sách dishes[] (số lượng món) và items[] (38 nguyên vật liệu)
  **Kết quả mong đợi:** 200 trả đúng targetDate = ngày hôm sau, gồm cả dishes[] (tên món, predictedQty) và items[] (đủ 38 nguyên vật liệu kèm tên, đơn vị, predictedDemand, currentStock) (HTTP: 200)
  **Nhánh code bao phủ:** REC-B05
url: "{{baseUrl}}/api/admin/forecast/ingredients"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // [TC-REC-05] Dự báo số lượng nguyên vật liệu VÀ số lượng món cho ngày hôm sau
      pm.test("[TC-REC-05] Status code is 200", function () {
          pm.expect(pm.response.code).to.eql(200);
      });
      pm.test("[TC-REC-05] Có targetDate (ngày hôm sau), danh sách dishes (số lượng món) và 38 nguyên vật liệu", function () {
          const json = pm.response.json();
          pm.expect(json).to.include.all.keys("targetDate", "dishes", "items", "totalIngredients", "totalDishes");
          pm.expect(json.totalIngredients).to.eql(38);
          pm.expect(json.dishes).to.be.an("array");
          if (json.items.length > 0) {
              pm.expect(json.items.length).to.eql(38);
              pm.expect(json.items[0]).to.include.all.keys("ingredientCode", "name", "unit", "predictedDemand", "projectedRemainingStock", "shortfallQty", "recommendedOrderQty", "dishBreakdown", "forecastDate");
          }
          if (json.dishes.length > 0) {
              pm.expect(json.dishes[0]).to.include.all.keys("itemCode", "name", "predictedQty", "forecastDate");
          }
      });
    language: text/javascript
order: 1000
