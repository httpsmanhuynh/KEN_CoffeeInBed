$kind: http-request
name: "TC-REC-08: [REC-08] Xem chi tiết một nguyên vật liệu kèm lịch sử ingredient_stock_movements (Branch: REC-B08)"
description: |-
  **Mã TC:** REC-08 (TC-REC-08)
  **Nhóm:** Admin Forecast nguyên vật liệu & món
  **API / Thành phần:** GET /api/admin/forecast/ingredients/:id
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; có nguyên vật liệu {{ingredientId}} và lịch sử kho.
  **Dữ liệu vào:** id = {{ingredientId}}
  **Các bước thực hiện:**
  1) GET /api/admin/forecast/ingredients/{{ingredientId}}
  **Kết quả mong đợi:** 200 chi tiết nguyên vật liệu + lịch sử movements sắp xếp theo thời gian mới nhất trước (HTTP: 200)
  **Nhánh code bao phủ:** REC-B08
url: "{{baseUrl}}/api/admin/forecast/ingredients/{{ingredientId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // [TC-REC-08] Xem chi tiết một nguyên vật liệu kèm lịch sử ingredient_stock_movements
      pm.test("[TC-REC-08] Status code is 200", function () {
          pm.expect(pm.response.code).to.eql(200);
      });
      pm.test("[TC-REC-08] Có thông tin ingredient, recipes và lịch sử movements đúng thứ tự thời gian", function () {
          const json = pm.response.json();
          pm.expect(json).to.include.all.keys("ingredient", "recipes", "movements");
          pm.expect(json.movements).to.be.an("array");
          for (let i = 1; i < json.movements.length; i++) {
              const prev = new Date(json.movements[i - 1].created_at).getTime();
              const curr = new Date(json.movements[i].created_at).getTime();
              pm.expect(prev).to.be.at.least(curr);
          }
      });
    language: text/javascript
order: 4000
