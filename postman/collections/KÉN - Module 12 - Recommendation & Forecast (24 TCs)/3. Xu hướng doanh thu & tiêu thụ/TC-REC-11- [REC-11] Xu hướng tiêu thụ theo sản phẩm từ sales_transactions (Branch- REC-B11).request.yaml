$kind: http-request
name: "TC-REC-11: [REC-11] Xu hướng tiêu thụ theo sản phẩm từ sales_transactions (Branch: REC-B11)"
description: |-
  **Mã TC:** REC-11 (TC-REC-11)
  **Nhóm:** Xu hướng doanh thu/tiêu thụ
  **API / Thành phần:** GET /api/admin/forecast/trends?productId=...
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; có sales_transactions.
  **Dữ liệu vào:** ?from=2026-10-01&to=2026-10-31&productId={{prodMatchaId}}
  **Các bước thực hiện:**
  1) GET /api/admin/forecast/trends?from=2026-10-01&to=2026-10-31&productId={{prodMatchaId}}
  **Kết quả mong đợi:** 200 trả về chuỗi tiêu thụ của đúng sản phẩm từ sales_transactions (HTTP: 200)
  **Nhánh code bao phủ:** REC-B11
url: "{{baseUrl}}/api/admin/forecast/trends?from=2026-10-01&to=2026-10-31&productId={{prodMatchaId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // [TC-REC-11] Xu hướng tiêu thụ theo sản phẩm từ sales_transactions
      pm.test("[TC-REC-11] Status code is 200", function () {
          pm.expect(pm.response.code).to.eql(200);
      });
      pm.test("[TC-REC-11] Nguồn dữ liệu là sales_transactions và đúng productId", function () {
          const json = pm.response.json();
          pm.expect(json.sourceCollection).to.eql("sales_transactions");
          pm.expect(json.productId).to.be.a("string");
          pm.expect(json.series).to.be.an("array");
      });
    language: text/javascript
order: 2000
