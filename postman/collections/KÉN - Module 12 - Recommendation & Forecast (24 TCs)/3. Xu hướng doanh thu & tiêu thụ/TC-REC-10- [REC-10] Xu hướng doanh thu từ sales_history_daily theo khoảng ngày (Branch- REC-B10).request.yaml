$kind: http-request
name: "TC-REC-10: [REC-10] Xu hướng doanh thu từ sales_history_daily (Branch: REC-B10)"
description: |-
  **Mã TC:** REC-10 (TC-REC-10)
  **Nhóm:** Xu hướng doanh thu/tiêu thụ
  **API / Thành phần:** GET /api/admin/forecast/trends
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin; có dữ liệu sales_history_daily.
  **Dữ liệu vào:** ?from=2026-10-01&to=2026-10-31
  **Các bước thực hiện:**
  1) GET /api/admin/forecast/trends?from=2026-10-01&to=2026-10-31&#10;2) Đối chiếu chuỗi theo ngày với sales_history_daily
  **Kết quả mong đợi:** 200 trả về chuỗi series theo ngày khớp dữ liệu nguồn sales_history_daily (HTTP: 200)
  **Nhánh code bao phủ:** REC-B10
url: "{{baseUrl}}/api/admin/forecast/trends?from=2026-10-01&to=2026-10-31"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // [TC-REC-10] Xu hướng doanh thu từ sales_history_daily
      pm.test("[TC-REC-10] Status code is 200", function () {
          pm.expect(pm.response.code).to.eql(200);
      });
      pm.test("[TC-REC-10] Chuỗi series theo ngày khớp nguồn sales_history_daily", function () {
          const json = pm.response.json();
          pm.expect(json.sourceCollection).to.eql("sales_history_daily");
          pm.expect(json.series).to.be.an("array");
          pm.expect(json).to.have.property("totals");
      });
    language: text/javascript
order: 1000
