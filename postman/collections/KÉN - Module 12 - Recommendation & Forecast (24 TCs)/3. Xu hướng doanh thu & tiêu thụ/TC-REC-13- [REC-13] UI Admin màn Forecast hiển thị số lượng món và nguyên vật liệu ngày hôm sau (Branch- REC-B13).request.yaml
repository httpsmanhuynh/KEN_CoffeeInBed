$kind: http-request
name: "TC-REC-13: [REC-13] API Tổng hợp Forecast Admin ngày hôm sau — số lượng món (dishes) & nguyên vật liệu (items) (Branch: REC-B13)"
description: |-
  **Mã TC:** REC-13 (TC-REC-13)
  **Nhóm:** Xu hướng doanh thu/tiêu thụ
  **API / Thành phần:** GET /api/admin/forecast (Backend API phục vụ Admin Forecast)
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin.
  **Dữ liệu vào:** —
  **Các bước thực hiện:**
  1) GET /api/admin/forecast&#10;2) Đối chiếu targetDate = ngày hôm sau, danh sách dishes[] và items[] (kèm dishBreakdown, recommendedOrderQty)
  **Kết quả mong đợi:** 200 trả đủ targetDate, dishes[], items[], totalDishes, totalIngredients phục vụ Admin Forecast ngày hôm sau (HTTP: 200)
  **Nhánh code bao phủ:** REC-B13
url: "{{baseUrl}}/api/admin/forecast"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("[TC-REC-13] Status code is 200", function () {
          pm.expect(pm.response.code).to.eql(200);
      });
      pm.test("[TC-REC-13] Có đủ targetDate, dishes và items cho ngày hôm sau", function () {
          const json = pm.response.json();
          pm.expect(json).to.include.all.keys("targetDate", "dishes", "items", "totalDishes", "totalIngredients");
      });
    language: text/javascript
order: 4000
