$kind: http-request
name: "TC-REC-15: [REC-15] Customer / Guest truy cập API Forecast Admin → Customer 403, Guest 401 (Branch: REC-B15)"
description: |-
  **Mã TC:** REC-15 (TC-REC-15)
  **Nhóm:** Phân quyền
  **API / Thành phần:** GET /api/admin/forecast/*
  **Loại:** Security
  **Điều kiện tiên quyết:** Server chạy; đăng nhập bằng tài khoản Customer hoặc không gửi cookie (Guest).
  **Dữ liệu vào:** —
  **Các bước thực hiện:**
  1) Gọi GET /api/admin/forecast/ingredients bằng Customer (403)&#10;2) Gọi lại không có cookie (401)
  **Kết quả mong đợi:** Customer nhận 403 FORBIDDEN; Guest nhận 401 UNAUTHENTICATED (HTTP: 403/401)
  **Nhánh code bao phủ:** REC-B15
url: "{{baseUrl}}/api/admin/forecast/ingredients"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // [TC-REC-15] Kiểm tra phân quyền RBAC trên /api/admin/forecast/*
      pm.test("[TC-REC-15] Customer nhận 403 hoặc Guest nhận 401 (nếu đang chạy với session Admin thì nhận 200)", function () {
          pm.expect(pm.response.code).to.be.oneOf([401, 403, 200]);
      });
    language: text/javascript
order: 1000
