$kind: http-request
name: "TC-REC-03: [REC-03] Thiếu thông tin cụm / Guest / lịch sử rỗng → tự động fallback an toàn (HTTP 200) (Branch: REC-B03)"
description: |-
  **Mã TC:** REC-03 (TC-REC-03)
  **Nhóm:** Customer Recommend
  **API / Thành phần:** GET /api/recommendations/booking
  **Loại:** Boundary
  **Điều kiện tiên quyết:** Server chạy; Customer chưa có ml_cluster_id hoặc Guest hoặc cụm chưa có lịch sử.
  **Dữ liệu vào:** ?limit=4
  **Các bước thực hiện:**
  1) GET /api/recommendations/booking?limit=4 (khi user chưa có ml_cluster_id hoặc không gửi cookie)
  **Kết quả mong đợi:** 200 không báo lỗi 500, tự động fallback về xu hướng chung (fallbackUsed=true, vẫn trả đủ menu inclusions[] và addons[]) (HTTP: 200)
  **Nhánh code bao phủ:** REC-B03
url: "{{baseUrl}}/api/recommendations/booking?limit=4"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("[TC-REC-03] Status code is 200 (không lỗi 500)", function () {
          pm.expect(pm.response.code).to.eql(200);
      });
      pm.test("[TC-REC-03] Fallback tự động trả menu inclusions và addons hợp lệ", function () {
          const json = pm.response.json();
          pm.expect(["PERSONALIZED_ML_CLUSTER", "TRENDING_FALLBACK", "DEFAULT_FALLBACK"]).to.include(json.strategy);
          pm.expect(json.inclusions).to.be.an("array");
          pm.expect(json.addons).to.be.an("array");
      });
    language: text/javascript
order: 3000
