$kind: http-request
name: "TC-REC-02: [REC-02] Trang Top Trending (gắn footer) không phân role — GET /api/recommendations/top-trending (Branch: REC-B02)"
description: |-
  **Mã TC:** REC-02 (TC-REC-02)
  **Nhóm:** Customer Recommend
  **API / Thành phần:** GET /api/recommendations/top-trending
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; không phân biệt Guest / Customer / Admin.
  **Dữ liệu vào:** — (mặc định limit=12)
  **Các bước thực hiện:**
  1) GET /api/recommendations/top-trending
  **Kết quả mong đợi:** 200 roleScoped=false, topTrendingPath='/top-trending', trả danh sách Top Trending kèm listedPrice, rank, totalSold (HTTP: 200)
  **Nhánh code bao phủ:** REC-B02
url: "{{baseUrl}}/api/recommendations/top-trending"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("[TC-REC-02] Status code is 200", function () {
          pm.expect(pm.response.code).to.eql(200);
      });
      pm.test("[TC-REC-02] Trang Top Trending trả roleScoped=false và topTrendingPath=/top-trending", function () {
          const json = pm.response.json();
          pm.expect(json.roleScoped).to.eql(false);
          pm.expect(json.topTrendingPath).to.eql("/top-trending");
          pm.expect(json.items).to.be.an("array");
          json.items.forEach(function (item) {
              pm.expect(item).to.include.all.keys("listedPrice", "rank", "totalSold");
              pm.expect(item.price).to.be.a("number");
          });
      });
    language: text/javascript
order: 2000
