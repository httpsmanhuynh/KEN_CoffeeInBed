$kind: http-request
name: "TC-SYS-11: [SYS-11] Transaction rollback khi lỗi giữa chừng (không để dữ liệu nửa vời) (Branch: SYS-B11)"
description: |-
  **Mã TC:** SYS-11 (TC-SYS-11)
  **Nhóm:** Database Transaction
  **API / Thành phần:** POST /api/bookings
  **Loại:** Security
  **Điều kiện tiên quyết:** Server chạy; kết nối MongoDB Atlas.
  **Dữ liệu vào:** Giả lập lỗi sau khi giữ Voucher
  **Các bước thực hiện:**
  1) Bật lỗi giả lập trước bước ghi bookings&#10;2) POST /api/bookings&#10;3) Kiểm tra vouchers/spaces/bookings
  **Kết quả mong đợi:** Không đơn nào được tạo; usage_count và lock_version không đổi (HTTP: 500)
  **Nhánh code bao phủ:** SYS-B11
  **Ghi chú:** Cần can thiệp môi trường để giả lập lỗi
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "invalid_id_trigger_rollback",
      "date": "2026-05-10"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Transaction rolls back cleanly on error, no orphan data", function () {
          pm.expect([400, 401, 422, 500]).to.include(pm.response.code);
      });
    language: text/javascript
order: 3000
