$kind: http-request
name: "TC-SYS-02: [SYS-02] Origin lạ bị chặn (Branch: SYS-B02)"
description: |-
  **Mã TC:** SYS-02 (TC-SYS-02)
  **Nhóm:** CORS
  **API / Thành phần:** Mọi API
  **Loại:** Security
  **Điều kiện tiên quyết:** Server chạy; kết nối MongoDB Atlas.
  **Dữ liệu vào:** Origin: https://evil.example
  **Các bước thực hiện:**
  1) Gửi request kèm Origin lạ&#10;2) Từ trang lạ gọi fetch có credentials
  **Kết quả mong đợi:** Không có Allow-Origin cho origin lạ; trình duyệt chặn (HTTP: —)
  **Nhánh code bao phủ:** SYS-B02
  **Ghi chú:** 
url: "{{baseUrl}}/"
method: GET
headers:
  Origin: https://evil.example
scripts:
  - type: afterResponse
    code: |-
      pm.test("Origin lạ không được cấp header Access-Control-Allow-Origin", function () {
          const allowOrigin = pm.response.headers.get("Access-Control-Allow-Origin");
          pm.expect(allowOrigin).to.not.eql("https://evil.example");
      });
    language: text/javascript
order: 2000
