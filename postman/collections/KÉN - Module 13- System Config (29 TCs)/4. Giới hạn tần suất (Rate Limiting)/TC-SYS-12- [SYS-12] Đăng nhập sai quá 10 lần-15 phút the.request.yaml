$kind: http-request
name: "TC-SYS-12: [SYS-12] Đăng nhập sai quá 10 lần/15 phút theo identifier (Branch: SYS-B12)"
description: |-
  **Mã TC:** SYS-12 (TC-SYS-12)
  **Nhóm:** Rate Limiting
  **API / Thành phần:** POST /api/login
  **Loại:** Security
  **Điều kiện tiên quyết:** Server chạy; kết nối MongoDB Atlas.
  **Dữ liệu vào:** Cùng SĐT, mật khẩu sai 11 lần
  **Các bước thực hiện:**
  1) POST /api/login 11 lần
  **Kết quả mong đợi:** Lần 11 trả 429 kèm Retry-After; SĐT khác không bị ảnh hưởng (HTTP: 429)
  **Nhánh code bao phủ:** SYS-B12
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "0999999999",
      "password": "wrong_password_attempt"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Rate limiter trả 401 khi chưa vượt ngưỡng hoặc 429 khi vượt 10 lần", function () {
          pm.expect([401, 429]).to.include(pm.response.code);
          if (pm.response.code === 429) {
              pm.expect(pm.response.json().code).to.eql("TOO_MANY_REQUESTS");
          }
      });
    language: text/javascript
order: 1000
