$kind: http-request
name: "TC-SYS-21: [SYS-21] Response không bao giờ trả password_hash / otp_hash (Branch: SYS-B21)"
description: |-
  **Mã TC:** SYS-21 (TC-SYS-21)
  **Nhóm:** Hash bcrypt
  **API / Thành phần:** GET /api/me
  **Loại:** Security
  **Điều kiện tiên quyết:** Server chạy; kết nối MongoDB Atlas.
  **Dữ liệu vào:** —
  **Các bước thực hiện:**
  1) GET /api/me&#10;2) Xem body mọi API trả user
  **Kết quả mong đợi:** Không có password_hash, otp_hash trong response (HTTP: 200)
  **Nhánh code bao phủ:** SYS-B21
  **Ghi chú:** 
url: "{{baseUrl}}/api/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response không bao giờ để lộ password_hash hoặc code_hash", function () {
          if (pm.response.code === 200) {
              const text = pm.response.text();
              pm.expect(text).to.not.include("password_hash");
              pm.expect(text).to.not.include("code_hash");
          }
      });
    language: text/javascript
order: 4000
