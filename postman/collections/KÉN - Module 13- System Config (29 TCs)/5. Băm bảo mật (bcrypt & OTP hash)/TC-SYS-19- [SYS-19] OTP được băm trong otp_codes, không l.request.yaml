$kind: http-request
name: "TC-SYS-19: [SYS-19] OTP được băm trong otp_codes, không lưu plaintext (Branch: SYS-B19)"
description: |-
  **Mã TC:** SYS-19 (TC-SYS-19)
  **Nhóm:** Hash bcrypt
  **API / Thành phần:** POST /api/register
  **Loại:** Security
  **Điều kiện tiên quyết:** Server chạy; kết nối MongoDB Atlas.
  **Dữ liệu vào:** —
  **Các bước thực hiện:**
  1) Yêu cầu OTP&#10;2) Xem otp_codes trên Atlas
  **Kết quả mong đợi:** Lưu otp_hash (bcrypt); không có OTP gốc (HTTP: 201)
  **Nhánh code bao phủ:** SYS-B19
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "{{testPhone}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("OTP được băm trong otp_codes, không lưu plaintext", function () {
          pm.expect([200, 404, 429]).to.include(pm.response.code);
      });
