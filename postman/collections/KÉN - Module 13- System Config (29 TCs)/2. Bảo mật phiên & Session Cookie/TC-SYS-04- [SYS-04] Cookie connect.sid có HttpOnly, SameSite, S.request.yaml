$kind: http-request
name: "TC-SYS-04: [SYS-04] Cookie connect.sid có HttpOnly, SameSite, Secure (production) (Branch: SYS-B04)"
description: |-
  **Mã TC:** SYS-04 (TC-SYS-04)
  **Nhóm:** Session Cookie
  **API / Thành phần:** POST /api/login
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; kết nối MongoDB Atlas.
  **Dữ liệu vào:** Đăng nhập hợp lệ
  **Các bước thực hiện:**
  1) POST /api/login&#10;2) Xem header Set-Cookie
  **Kết quả mong đợi:** HttpOnly=true; SameSite đúng cấu hình; Secure=true khi production; Max-Age ≈ 24 giờ (HTTP: 200)
  **Nhánh code bao phủ:** SYS-B04
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "{{testPhone}}",
      "password": "{{testPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Set-Cookie connect.sid có HttpOnly, SameSite", function () {
          pm.expect([200, 401]).to.include(pm.response.code);
          if (pm.response.code === 200) {
              const setCookie = pm.response.headers.get("Set-Cookie");
              pm.expect(setCookie).to.include("connect.sid");
              pm.expect(setCookie.toLowerCase()).to.include("httponly");
              pm.expect(setCookie.toLowerCase()).to.include("samesite=lax");
          }
      });
    language: text/javascript
order: 1000
