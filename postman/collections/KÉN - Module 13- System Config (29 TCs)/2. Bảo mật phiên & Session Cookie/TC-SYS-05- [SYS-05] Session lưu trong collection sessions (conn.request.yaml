$kind: http-request
name: "TC-SYS-05: [SYS-05] Session lưu trong collection sessions (connect-mongo), hạn 24 giờ (Branch: SYS-B05)"
description: |-
  **Mã TC:** SYS-05 (TC-SYS-05)
  **Nhóm:** Session Cookie
  **API / Thành phần:** GET /api/me
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; kết nối MongoDB Atlas.
  **Dữ liệu vào:** —
  **Các bước thực hiện:**
  1) Đăng nhập&#10;2) Kiểm tra collection sessions trên Atlas
  **Kết quả mong đợi:** Có bản ghi session với expires ≈ 24 giờ (HTTP: 200)
  **Nhánh code bao phủ:** SYS-B05
  **Ghi chú:** 
url: "{{baseUrl}}/api/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Session valid in MongoDB sessions collection", function () {
          pm.expect([200, 401]).to.include(pm.response.code);
          if (pm.response.code === 200) {
              pm.expect(pm.response.json()).to.have.property("user");
          }
      });
    language: text/javascript
order: 2000
