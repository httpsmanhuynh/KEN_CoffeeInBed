$kind: http-request
name: "TC-SYS-07: [SYS-07] Session hết hạn / cookie bị sửa (Branch: SYS-B07)"
description: |-
  **Mã TC:** SYS-07 (TC-SYS-07)
  **Nhóm:** Session Cookie
  **API / Thành phần:** GET /api/me
  **Loại:** Negative
  **Điều kiện tiên quyết:** Server chạy; kết nối MongoDB Atlas.
  **Dữ liệu vào:** Cookie connect.sid sai
  **Các bước thực hiện:**
  1) GET /api/me với cookie bị sửa
  **Kết quả mong đợi:** 401; không lỗi 500 (HTTP: 401)
  **Nhánh code bao phủ:** SYS-B07
  **Ghi chú:** 
url: "{{baseUrl}}/api/me"
method: GET
headers:
  Cookie: connect.sid=s%3Ainvalid_tampered_cookie_signature
scripts:
  - type: afterResponse
    code: |-
      pm.test("Cookie bị sửa trả về 401 UNAUTHENTICATED, không lỗi 500", function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 4000
