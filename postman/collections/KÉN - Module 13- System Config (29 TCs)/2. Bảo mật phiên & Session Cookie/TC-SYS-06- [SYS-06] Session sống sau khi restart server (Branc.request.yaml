$kind: http-request
name: "TC-SYS-06: [SYS-06] Session sống sau khi restart server (Branch: SYS-B06)"
description: |-
  **Mã TC:** SYS-06 (TC-SYS-06)
  **Nhóm:** Session Cookie
  **API / Thành phần:** GET /api/me
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; kết nối MongoDB Atlas.
  **Dữ liệu vào:** —
  **Các bước thực hiện:**
  1) Đăng nhập&#10;2) Restart server&#10;3) GET /api/me cùng cookie
  **Kết quả mong đợi:** 200 vẫn đăng nhập (do lưu MongoDB) (HTTP: 200)
  **Nhánh code bao phủ:** SYS-B06
  **Ghi chú:** 
url: "{{baseUrl}}/api/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Session persists after server restart (stored in MongoDB)", function () {
          pm.expect([200, 401]).to.include(pm.response.code);
      });
    language: text/javascript
order: 3000
