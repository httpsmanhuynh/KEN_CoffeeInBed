$kind: http-request
name: "TC-SYS-23: [SYS-23] Chuẩn hóa múi giờ: client gửi ISO UTC, giờ mở cửa tính theo UTC+7 (Branch: SYS-B23)"
description: |-
  **Mã TC:** SYS-23 (TC-SYS-23)
  **Nhóm:** Server Time
  **API / Thành phần:** POST /api/availability
  **Loại:** Boundary
  **Điều kiện tiên quyết:** Server chạy; kết nối MongoDB Atlas.
  **Dữ liệu vào:** startAt = 2026-11-10T00:30:00Z (07:30 VN)
  **Các bước thực hiện:**
  1) POST availability với ISO UTC
  **Kết quả mong đợi:** Hiểu là 07:30 VN → ngoài giờ mở cửa (isAvailable=false) (HTTP: 200)
  **Nhánh code bao phủ:** SYS-B23
  **Ghi chú:** 
url: "{{baseUrl}}/api/availability"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "date": "2026-05-10",
      "spaceId": "SP01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Chuẩn hóa múi giờ client ISO UTC và giờ mở cửa UTC+7", function () {
          pm.expect([200, 400, 404]).to.include(pm.response.code);
      });
    language: text/javascript
order: 2000
