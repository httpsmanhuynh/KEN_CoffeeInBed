$kind: http-request
name: "TC-SYS-24: [SYS-24] Ngày giờ hiển thị đúng khi server chạy ở múi giờ khác (Branch: SYS-B24)"
description: |-
  **Mã TC:** SYS-24 (TC-SYS-24)
  **Nhóm:** Server Time
  **API / Thành phần:** GET /api/bookings/me
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; kết nối MongoDB Atlas.
  **Dữ liệu vào:** Chạy server với TZ=UTC
  **Các bước thực hiện:**
  1) Chạy server TZ=UTC&#10;2) Tạo đơn 10:00 VN&#10;3) Xem hiển thị
  **Kết quả mong đợi:** Giờ hiển thị vẫn 10:00 (VN); không lệch múi giờ (HTTP: 200)
  **Nhánh code bao phủ:** SYS-B24
  **Ghi chú:** 
url: "{{baseUrl}}/api/bookings/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Ngày giờ hiển thị đúng định dạng ISO / UTC+7", function () {
          pm.expect([200, 401]).to.include(pm.response.code);
      });
    language: text/javascript
order: 3000
