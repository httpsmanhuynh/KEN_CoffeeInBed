$kind: http-request
name: "TC-SYS-25: [SYS-25] Lỗi 500 trả JSON chuẩn, không lộ stack trace (Branch: SYS-B25)"
description: |-
  **Mã TC:** SYS-25 (TC-SYS-25)
  **Nhóm:** Xử lý lỗi tập trung
  **API / Thành phần:** Mọi API
  **Loại:** Negative
  **Điều kiện tiên quyết:** Server chạy; kết nối MongoDB Atlas.
  **Dữ liệu vào:** Gây lỗi bất ngờ (vd body hỏng)
  **Các bước thực hiện:**
  1) Gửi body JSON sai cú pháp&#10;2) Xem response
  **Kết quả mong đợi:** 400/422 JSON {code, message}; không có stack trace (HTTP: 400)
  **Nhánh code bao phủ:** SYS-B25
  **Ghi chú:** 
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"broken_json": '
scripts:
  - type: afterResponse
    code: |-
      pm.test("Body JSON sai cú pháp trả 400 BAD_REQUEST và không lộ stack trace", function () {
          pm.response.to.have.status(400);
          const json = pm.response.json();
          pm.expect(json.code).to.eql("BAD_REQUEST");
          pm.expect(json).to.not.have.property("stack");
      });
    language: text/javascript
order: 1000
