$kind: http-request
name: "TC-PRICING-044: [PRICING-044] Hạng thành viên cấu hình tỷ lệ giảm ngoài 0–1 bị từ chối (Branch: TIE-B02)"
description: |-
  **Mã TC:** PRICING-044 (TC-PRICING-044)
  **Nhóm:** Giảm theo hạng
  **API / Thành phần:** POST /api/bookings (MongoDB Compass + UI Checkout (Customer))
  **Loại:** Exception
  **Điều kiện tiên quyết:** Server chạy; có quyền ghi MongoDB Compass; ghi lại giá trị gốc của document sẽ sửa để khôi phục sau test; ứng dụng giao diện chạy với tài khoản Customer.
  **Dữ liệu vào:** MEMBERSHIP_TIER của tài khoản test: discount_rate = 1.5 (sai cố ý; đơn vị 0..1)&#10;Tài khoản: Customer thuộc hạng đó; Package trọn gói 200.000đ
  **Các bước thực hiện:**
  1) Compass: sửa discount_rate của hạng thử thành 1.5.&#10;2) UI: đăng nhập Customer thuộc hạng đó, chọn Package 200.000đ, tới Checkout.&#10;3) Quan sát; kiểm tra bookings.&#10;4) Khôi phục discount_rate gốc.
  **Kết quả mong đợi:** Không áp dụng tỷ lệ sai; không tạo Booking; Thành tiền không bị âm. Backend từ chối yêu cầu: không tạo Booking (collection bookings không có bản ghi mới), không trừ lượt Voucher; người dùng nhận thông báo lỗi (nội dung thông báo: TBD – chưa có trong tài liệu). (HTTP: 400/422/500)
  **Nhánh code bao phủ:** TIE-B02
  **Ghi chú:** Auto liên quan (chỉ để truy vết, KHÔNG phải kết quả Manual): AUTO-PRICING-034: đầu vào không hợp lệ
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{pkgFixedSpace200kId}}",
      "startAt": "2026-12-20T02:00:00.000Z",
      "guestCount": 1
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRICING-044] Hạng thành viên cấu hình tỷ lệ giảm ngoài 0–1 bị từ chối
      pm.test("[TC-PRICING-044] Status code is 400 or 422 or 500", function () {
          pm.expect(pm.response.code).to.be.oneOf([400,422,500]);
      });
      pm.test("[TC-PRICING-044] Phản hồi từ chối hợp lệ kèm mã lỗi nghiệp vụ", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("code");
          pm.expect(["INVALID_TIER_RATE","INTERNAL_ERROR"]).to.include(json.code);
          pm.expect(json).to.have.property("message");
      });
    language: text/javascript
order: 5000
