$kind: http-request
name: "TC-PRICING-057: [PRICING-057] Nâng/hạ hạng sau khi đặt: Booking cũ giữ tier_rate đã đóng băng (Branch: SNP-B02)"
description: |-
  **Mã TC:** PRICING-057 (TC-PRICING-057)
  **Nhóm:** Price Snapshot
  **API / Thành phần:** GET /api/bookings/{{bookingId}} (MongoDB Compass: collection bookings (price_snapshot))
  **Loại:** State Transition
  **Điều kiện tiên quyết:** Server chạy (http://localhost:3002) và ứng dụng giao diện chạy; đã chạy npm run setup (có hạng thành viên); dữ liệu giá/Inclusion/Add-on/Voucher theo cột 'Dữ liệu vào' đã có trong MongoDB (tạo bằng Compass nếu chưa có).
  **Dữ liệu vào:** Tài khoản: Customer hạng Bạc (5%) đặt Package 200.000đ, không Voucher&#10;Sau khi đặt: đổi hạng tài khoản lên Vàng (10%) bằng Compass
  **Các bước thực hiện:**
  1) Đăng nhập Customer hạng Bạc, đặt Package 200.000đ; ghi lại tier_rate và final_amount.&#10;2) Compass: đổi hạng của tài khoản lên Vàng.&#10;3) UI: mở chi tiết Booking vừa tạo.&#10;4) Compass: xem lại price_snapshot của Booking đó.&#10;5) Đặt thêm 1 Booking mới.&#10;6) Khôi phục hạng gốc.
  **Kết quả mong đợi:** Booking cũ: tier_rate = 0.05, tier_discount 10.000đ, Thành tiền 190.000đ (không đổi). Booking mới: tier_rate = 0.1, tier_discount 20.000đ, Thành tiền 180.000đ. (HTTP: 200)
  **Nhánh code bao phủ:** SNP-B02
  **Ghi chú:** CẦN XEM XÉT – ánh xạ không 1-1 (AUTO-PRICING-041 dùng chung cho 4 Manual TC). Automated TC ứng viên (chưa xác nhận, chỉ để truy vết, KHÔNG phải kết quả Manual): AUTO-PRICING-041: toPriceSnapshot: đóng băng sâu, có chi tiết dòng, khớp trường phẳng
url: "{{baseUrl}}/api/bookings/{{bookingId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRICING-057] Nâng/hạ hạng sau khi đặt: Booking cũ giữ tier_rate đã đóng băng
      pm.test("[TC-PRICING-057] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
      pm.test("[TC-PRICING-057] Snapshot giá trên Booking khớp đúng dữ liệu đóng băng từ DB", function () {
          const json = pm.response.json();
          pm.expect(json.package_price).to.eql(200000);
          pm.expect(json.subtotal).to.eql(200000);
          pm.expect(json.tier_rate).to.eql(0.05);
          pm.expect(json.tier_discount).to.eql(10000);
          pm.expect(json.discount_amount).to.eql(10000);
          pm.expect(json.final_amount).to.eql(190000);
          pm.expect(Number.isInteger(json.final_amount) && json.final_amount >= 0).to.be.true;
          if (json._id) { pm.collectionVariables.set("lastCreatedBookingId", String(json._id)); }
      });
    language: text/javascript
order: 3000
