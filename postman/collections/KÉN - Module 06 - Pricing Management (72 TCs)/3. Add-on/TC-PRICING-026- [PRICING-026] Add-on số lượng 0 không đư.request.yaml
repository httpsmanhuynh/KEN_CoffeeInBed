$kind: http-request
name: "TC-PRICING-026: [PRICING-026] Add-on số lượng 0 không được tính vào đơn (Branch: ADD-B03)"
description: |-
  **Mã TC:** PRICING-026 (TC-PRICING-026)
  **Nhóm:** Add-on
  **API / Thành phần:** POST /api/bookings (UI Checkout / Tóm tắt đơn (Customer))
  **Loại:** Negative
  **Điều kiện tiên quyết:** Server chạy (http://localhost:3002) và ứng dụng giao diện chạy; đã chạy npm run setup (có hạng thành viên); dữ liệu giá/Inclusion/Add-on/Voucher theo cột 'Dữ liệu vào' đã có trong MongoDB (tạo bằng Compass nếu chưa có).
  **Dữ liệu vào:** Tài khoản: Customer hạng BASIC&#10;Package trọn gói 140.000đ&#10;Add-on 40.000đ, số lượng nhập: 0
  **Các bước thực hiện:**
  1) Đăng nhập UI bằng Customer hạng BASIC.&#10;2) Chọn Package 140.000đ.&#10;3) Chọn Add-on 40.000đ và nhập số lượng = 0.&#10;4) Tới Checkout; quan sát; kiểm tra bookings.
  **Kết quả mong đợi:** Hệ thống từ chối số lượng 0 (không tạo Booking với dòng Add-on số lượng 0). Backend từ chối yêu cầu: không tạo Booking (collection bookings không có bản ghi mới), không trừ lượt Voucher; người dùng nhận thông báo lỗi (nội dung thông báo: TBD – chưa có trong tài liệu). (HTTP: 400/422)
  **Nhánh code bao phủ:** ADD-B03
  **Ghi chú:** CẦN XEM XÉT – ánh xạ không 1-1 (AUTO-PRICING-020 dùng chung cho 5 Manual TC). Automated TC ứng viên (chưa xác nhận, chỉ để truy vết, KHÔNG phải kết quả Manual): AUTO-PRICING-020: quantity không hợp lệ / unit sai bị từ chối
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "2026-12-20T02:00:00.000Z",
      "guestCount": 1,
      "addons": [
        {
          "addonId": "{{addon40kId}}",
          "quantity": 0
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRICING-026] Add-on số lượng 0 không được tính vào đơn
      pm.test("[TC-PRICING-026] Status code is 400 or 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([400,422]);
      });
      pm.test("[TC-PRICING-026] Phản hồi từ chối hợp lệ kèm mã lỗi nghiệp vụ", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("code");
          pm.expect(["INVALID_ADDON_QTY","INVALID_QUANTITY"]).to.include(json.code);
          pm.expect(json).to.have.property("message");
      });
    language: text/javascript
order: 5000
