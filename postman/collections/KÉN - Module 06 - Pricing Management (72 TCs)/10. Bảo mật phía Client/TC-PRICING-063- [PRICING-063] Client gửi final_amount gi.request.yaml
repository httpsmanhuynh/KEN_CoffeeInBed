$kind: http-request
name: "TC-PRICING-063: [PRICING-063] Client gửi final_amount giả: Backend bỏ qua và tự tính lại (Branch: ALL-B02; SNP-B02)"
description: |-
  **Mã TC:** PRICING-063 (TC-PRICING-063)
  **Nhóm:** Bảo mật phía Client
  **API / Thành phần:** POST /api/bookings (Backend – API tạo Booking (endpoint TBD) – Postman)
  **Loại:** Security
  **Điều kiện tiên quyết:** Server chạy (http://localhost:3002); Postman bật Cookie jar và đã đăng nhập Customer; dữ liệu theo cột 'Dữ liệu vào' đã có trong MongoDB. Endpoint tạo Booking: TBD (chưa có trong tài liệu được cấp) – điền endpoint thực tế vào bước 2 trước khi chạy.
  **Dữ liệu vào:** Tài khoản: Customer hạng Bạc (5%)&#10;Package trọn gói 200.000đ&#10;Body thêm: "final_amount": 1000, "subtotal": 1000
  **Các bước thực hiện:**
  1) Postman: gọi API tạo Booking (endpoint TBD) với dữ liệu hợp lệ cho Package 200.000đ và thêm 2 trường giả final_amount = 1000, subtotal = 1000.&#10;2) Ghi lại HTTP status và body.&#10;3) Compass: xem price_snapshot của Booking vừa tạo.
  **Kết quả mong đợi:** Booking được tạo (hoặc bị từ chối) nhưng KHÔNG dùng 1.000đ: nếu tạo thành công thì price_snapshot.subtotal = 200.000đ, tier_discount = 10.000đ, final_amount = 190.000đ. (HTTP: 201)
  **Nhánh code bao phủ:** ALL-B02; SNP-B02
  **Ghi chú:** CẦN XEM XÉT – ánh xạ không 1-1 (AUTO-PRICING-039 dùng chung cho 2 Manual TC). Automated TC ứng viên (chưa xác nhận, chỉ để truy vết, KHÔNG phải kết quả Manual): AUTO-PRICING-039: bất biến: mọi số tiền là số nguyên không âm; final = subtotal − discount; discount ≤ subtotal
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{pkgFixedSpace200kId}}",
      "startAt": "2026-12-23T02:00:00.000Z",
      "guestCount": 1,
      "final_amount": 1000,
      "subtotal": 1000
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRICING-063] Client gửi final_amount giả: Backend bỏ qua và tự tính lại
      pm.test("[TC-PRICING-063] Status code is 201", function () {
          pm.expect(pm.response.code).to.be.oneOf([201]);
      });
      pm.test("[TC-PRICING-063] Snapshot giá trên Booking khớp đúng dữ liệu đóng băng từ DB", function () {
          const json = pm.response.json();
          pm.expect(json.package_price).to.eql(200000);
          pm.expect(json.subtotal).to.eql(200000);
          pm.expect(json.tier_discount).to.eql(10000);
          pm.expect(json.final_amount).to.eql(190000);
          pm.expect(Number.isInteger(json.final_amount) && json.final_amount >= 0).to.be.true;
          if (json._id) { pm.collectionVariables.set("lastCreatedBookingId", String(json._id)); }
      });
    language: text/javascript
order: 1000
