$kind: http-request
name: "TC-PRICING-064: [PRICING-064] Client gửi tier_rate giả: Backend dùng tỷ lệ hạng trong DB (Branch: TIE-B03; SNP-B02)"
description: |-
  **Mã TC:** PRICING-064 (TC-PRICING-064)
  **Nhóm:** Bảo mật phía Client
  **API / Thành phần:** POST /api/bookings (Backend – API tạo Booking (endpoint TBD) – Postman)
  **Loại:** Security
  **Điều kiện tiên quyết:** Server chạy (http://localhost:3002); Postman bật Cookie jar và đã đăng nhập Customer; dữ liệu theo cột 'Dữ liệu vào' đã có trong MongoDB. Endpoint tạo Booking: TBD (chưa có trong tài liệu được cấp) – điền endpoint thực tế vào bước 2 trước khi chạy.
  **Dữ liệu vào:** Tài khoản: Customer hạng BASIC (0%)&#10;Package trọn gói 200.000đ&#10;Body thêm: "tier_rate": 0.15
  **Các bước thực hiện:**
  1) Postman: gọi API tạo Booking với dữ liệu hợp lệ và thêm trường giả tier_rate = 0.15.&#10;2) Ghi lại HTTP status/body.&#10;3) Compass: xem price_snapshot của Booking vừa tạo.
  **Kết quả mong đợi:** Nếu tạo thành công: price_snapshot.tier_rate = 0, tier_discount = 0, final_amount = 200.000đ (không giảm 15%). (HTTP: 201)
  **Nhánh code bao phủ:** TIE-B03; SNP-B02
  **Ghi chú:** CẦN XEM XÉT – ánh xạ không 1-1 (AUTO-PRICING-032 dùng chung cho 2 Manual TC). Automated TC ứng viên (chưa xác nhận, chỉ để truy vết, KHÔNG phải kết quả Manual): AUTO-PRICING-032: hạng BASIC (0) hoặc không truyền -> 0
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{pkgFixedSpace200kId}}",
      "startAt": "2026-12-24T02:00:00.000Z",
      "guestCount": 1,
      "tier_rate": 0.15
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRICING-064] Client gửi tier_rate giả: Backend dùng tỷ lệ hạng trong DB
      pm.test("[TC-PRICING-064] Status code is 201", function () {
          pm.expect(pm.response.code).to.be.oneOf([201]);
      });
      pm.test("[TC-PRICING-064] Snapshot giá trên Booking khớp đúng dữ liệu đóng băng từ DB", function () {
          const json = pm.response.json();
          pm.expect(json.package_price).to.eql(200000);
          pm.expect(json.subtotal).to.eql(200000);
          pm.expect(json.tier_rate).to.eql(0);
          pm.expect(json.tier_discount).to.eql(0);
          pm.expect(json.final_amount).to.eql(200000);
          pm.expect(Number.isInteger(json.final_amount) && json.final_amount >= 0).to.be.true;
          if (json._id) { pm.collectionVariables.set("lastCreatedBookingId", String(json._id)); }
      });
    language: text/javascript
order: 2000
