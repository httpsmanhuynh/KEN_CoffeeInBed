$kind: http-request
name: "TC-PRICING-051: [PRICING-051] Bộ số 3: gói theo giờ + đầu người, Inclusion, Add-on, Voucher %, hạng Kim Cương (Branch: ALL-B02; PKG-B05; PKG-B07; INC-B04; ADD-B04; VCH-B05; TIE-B04)"
description: |-
  **Mã TC:** PRICING-051 (TC-PRICING-051)
  **Nhóm:** Tổng hợp & thứ tự
  **API / Thành phần:** POST /api/bookings/quote (UI Checkout / Tóm tắt đơn (Customer))
  **Loại:** Business Rule
  **Điều kiện tiên quyết:** Server chạy (http://localhost:3002) và ứng dụng giao diện chạy; đã chạy npm run setup (có hạng thành viên); dữ liệu giá/Inclusion/Add-on/Voucher theo cột 'Dữ liệu vào' đã có trong MongoDB (tạo bằng Compass nếu chưa có).
  **Dữ liệu vào:** Tài khoản: Customer hạng Kim Cương (giảm 15%)&#10;Package: theo giờ, tính theo đầu người, đơn giá 50.000đ, 3 khách, 2 giờ&#10;Inclusion: giá 62.000đ × 1, định mức 50.000đ&#10;Add-on: 33.333đ × 3&#10;Voucher: giảm 10%
  **Các bước thực hiện:**
  1) Đăng nhập UI bằng tài khoản ở 'Dữ liệu vào'.&#10;2) Chọn Package theo 'Dữ liệu vào' (nhập số khách/số giờ nếu có).&#10;3) Chọn các Inclusion theo 'Dữ liệu vào'.&#10;4) Chọn Add-on và nhập số lượng theo 'Dữ liệu vào'.&#10;5) Nhập/chọn Voucher theo 'Dữ liệu vào'.&#10;6) Mở màn hình Checkout/Tóm tắt đơn, ghi lại Tạm tính, Giảm Voucher, Giảm hạng, Thành tiền.&#10;7) Đối chiếu từng dòng với 'Kết quả mong đợi' (tính tay theo công thức, không dùng số do UI tự tính làm chuẩn).
  **Kết quả mong đợi:** Tạm tính 411.999đ (Package 300.000đ + phụ phí Inclusion 12.000đ + Add-on 99.999đ); Giảm Voucher 41.199đ; Giảm hạng 55.620đ; Tổng giảm 96.819đ; Thành tiền 315.180đ. UI hiển thị đúng các số này, không có phần thập phân. (HTTP: 200)
  **Nhánh code bao phủ:** ALL-B02; PKG-B05; PKG-B07; INC-B04; ADD-B04; VCH-B05; TIE-B04
  **Ghi chú:** CẦN XEM XÉT – ánh xạ không 1-1 (AUTO-PRICING-039 dùng chung cho 2 Manual TC). Automated TC ứng viên (chưa xác nhận, chỉ để truy vết, KHÔNG phải kết quả Manual): AUTO-PRICING-039: bất biến: mọi số tiền là số nguyên không âm; final = subtotal − discount; discount ≤ subtotal
url: "{{baseUrl}}/api/bookings/quote"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceWorkLoungeId}}",
      "packageId": "{{pkgHourlyPerson50kId}}",
      "startAt": "2026-12-20T02:00:00.000Z",
      "hours": 2,
      "guestCount": 3,
      "inclusions": [
        {
          "packageInclusionId": "{{incWlDrinkId}}",
          "productId": "{{prodDrink62kId}}",
          "quantity": 1
        }
      ],
      "addons": [
        {
          "addonId": "{{addon33333Id}}",
          "quantity": 3
        }
      ],
      "voucherCode": "WELCOME10"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRICING-051] Bộ số 3: gói theo giờ + đầu người, Inclusion, Add-on, Voucher %, hạng Kim Cương
      pm.test("[TC-PRICING-051] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
      pm.test("[TC-PRICING-051] Cấu trúc JSON báo giá hợp lệ và mọi số tiền là số nguyên VNĐ không âm", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("pricing");
          const pr = json.pricing;
          ["packagePrice", "inclusionSurcharge", "addonTotal", "subtotal", "voucherDiscount", "tierDiscount", "discountAmount", "finalAmount"].forEach(function (k) {
              pm.expect(Number.isInteger(pr[k]), k + " phải là số nguyên").to.be.true;
              pm.expect(pr[k], k + " không được âm").to.be.at.least(0);
          });
      });
      pm.test("[TC-PRICING-051] Kết quả tính giá khớp công thức nghiệp vụ Pricing", function () {
          const json = pm.response.json();
          const pr = json.pricing;
          pm.expect(pr.packagePrice).to.eql(300000);
          pm.expect(pr.inclusionSurcharge).to.eql(12000);
          pm.expect(pr.addonTotal).to.eql(99999);
          pm.expect(pr.subtotal).to.eql(411999);
          pm.expect(pr.voucherDiscount).to.eql(41199);
          pm.expect(pr.tierDiscount).to.eql(55620);
          pm.expect(pr.discountAmount).to.eql(96819);
          pm.expect(pr.finalAmount).to.eql(315180);
          pm.expect(json.tierRate).to.eql(0.15);
          pm.expect(pr.subtotal).to.eql(pr.packagePrice + pr.inclusionSurcharge + pr.addonTotal);
          pm.expect(pr.discountAmount).to.eql(pr.voucherDiscount + pr.tierDiscount);
          pm.expect(pr.finalAmount).to.eql(pr.subtotal - pr.discountAmount);
      });
    language: text/javascript
order: 3000
