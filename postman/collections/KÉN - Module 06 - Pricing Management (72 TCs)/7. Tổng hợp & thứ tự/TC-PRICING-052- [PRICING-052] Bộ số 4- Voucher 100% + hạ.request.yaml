$kind: http-request
name: "TC-PRICING-052: [PRICING-052] Bộ số 4: Voucher 100% + hạng Vàng: hạng không giảm thêm (Branch: ALL-B02; VCH-B05; TIE-B04)"
description: |-
  **Mã TC:** PRICING-052 (TC-PRICING-052)
  **Nhóm:** Tổng hợp & thứ tự
  **API / Thành phần:** POST /api/bookings/quote (UI Checkout / Tóm tắt đơn (Customer))
  **Loại:** Business Rule
  **Điều kiện tiên quyết:** Server chạy (http://localhost:3002) và ứng dụng giao diện chạy; đã chạy npm run setup (có hạng thành viên); dữ liệu giá/Inclusion/Add-on/Voucher theo cột 'Dữ liệu vào' đã có trong MongoDB (tạo bằng Compass nếu chưa có).
  **Dữ liệu vào:** Tài khoản: Customer hạng Vàng (giảm 10%)&#10;Package: trọn gói, tính theo không gian, đơn giá 140.000đ&#10;Inclusion: không có phụ phí&#10;Add-on: 40.000đ × 1&#10;Voucher: giảm 100%
  **Các bước thực hiện:**
  1) Đăng nhập UI bằng tài khoản ở 'Dữ liệu vào'.&#10;2) Chọn Package theo 'Dữ liệu vào' (nhập số khách/số giờ nếu có).&#10;3) Chọn Add-on và nhập số lượng theo 'Dữ liệu vào'.&#10;4) Nhập/chọn Voucher theo 'Dữ liệu vào'.&#10;5) Mở màn hình Checkout/Tóm tắt đơn, ghi lại Tạm tính, Giảm Voucher, Giảm hạng, Thành tiền.&#10;6) Đối chiếu từng dòng với 'Kết quả mong đợi' (tính tay theo công thức, không dùng số do UI tự tính làm chuẩn).
  **Kết quả mong đợi:** Tạm tính 180.000đ (Package 140.000đ + phụ phí Inclusion 0đ + Add-on 40.000đ); Giảm Voucher 180.000đ; Giảm hạng 0đ; Tổng giảm 180.000đ; Thành tiền 0đ. UI hiển thị đúng các số này, không có phần thập phân. (HTTP: 200)
  **Nhánh code bao phủ:** ALL-B02; VCH-B05; TIE-B04
  **Ghi chú:** Auto liên quan (chỉ để truy vết, KHÔNG phải kết quả Manual): AUTO-PRICING-033: Voucher đã trừ hết -> không còn gì để giảm theo hạng
url: "{{baseUrl}}/api/bookings/quote"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "2026-12-20T02:00:00.000Z",
      "guestCount": 1,
      "inclusions": [],
      "addons": [
        {
          "addonId": "{{addon40kId}}",
          "quantity": 1
        }
      ],
      "voucherCode": "FREE100"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRICING-052] Bộ số 4: Voucher 100% + hạng Vàng: hạng không giảm thêm
      pm.test("[TC-PRICING-052] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
      pm.test("[TC-PRICING-052] Cấu trúc JSON báo giá hợp lệ và mọi số tiền là số nguyên VNĐ không âm", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("pricing");
          const pr = json.pricing;
          ["packagePrice", "inclusionSurcharge", "addonTotal", "subtotal", "voucherDiscount", "tierDiscount", "discountAmount", "finalAmount"].forEach(function (k) {
              pm.expect(Number.isInteger(pr[k]), k + " phải là số nguyên").to.be.true;
              pm.expect(pr[k], k + " không được âm").to.be.at.least(0);
          });
      });
      pm.test("[TC-PRICING-052] Kết quả tính giá khớp công thức nghiệp vụ Pricing", function () {
          const json = pm.response.json();
          const pr = json.pricing;
          pm.expect(pr.packagePrice).to.eql(140000);
          pm.expect(pr.inclusionSurcharge).to.eql(0);
          pm.expect(pr.addonTotal).to.eql(40000);
          pm.expect(pr.subtotal).to.eql(180000);
          pm.expect(pr.voucherDiscount).to.eql(180000);
          pm.expect(pr.tierDiscount).to.eql(0);
          pm.expect(pr.discountAmount).to.eql(180000);
          pm.expect(pr.finalAmount).to.eql(0);
          pm.expect(json.tierRate).to.eql(0.1);
          pm.expect(pr.subtotal).to.eql(pr.packagePrice + pr.inclusionSurcharge + pr.addonTotal);
          pm.expect(pr.discountAmount).to.eql(pr.voucherDiscount + pr.tierDiscount);
          pm.expect(pr.finalAmount).to.eql(pr.subtotal - pr.discountAmount);
      });
    language: text/javascript
order: 4000
