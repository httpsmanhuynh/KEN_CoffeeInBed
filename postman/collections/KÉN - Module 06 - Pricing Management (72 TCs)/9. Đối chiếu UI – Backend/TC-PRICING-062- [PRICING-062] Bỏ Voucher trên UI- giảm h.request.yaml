$kind: http-request
name: "TC-PRICING-062: [PRICING-062] Bỏ Voucher trên UI: giảm hạng tính lại trên Tạm tính (Branch: VCH-B01; ALL-B02)"
description: |-
  **Mã TC:** PRICING-062 (TC-PRICING-062)
  **Nhóm:** Đối chiếu UI – Backend
  **API / Thành phần:** POST /api/bookings/quote (UI Checkout / Tóm tắt đơn (Customer))
  **Loại:** State Transition
  **Điều kiện tiên quyết:** Server chạy (http://localhost:3002) và ứng dụng giao diện chạy; đã chạy npm run setup (có hạng thành viên); dữ liệu giá/Inclusion/Add-on/Voucher theo cột 'Dữ liệu vào' đã có trong MongoDB (tạo bằng Compass nếu chưa có).
  **Dữ liệu vào:** Tài khoản: Customer hạng Vàng (10%)&#10;Package trọn gói 200.000đ&#10;Voucher cố định 50.000đ: áp dụng rồi gỡ
  **Các bước thực hiện:**
  1) Đăng nhập Customer hạng Vàng, chọn Package 200.000đ, áp dụng Voucher 50.000đ; ghi lại Thành tiền.&#10;2) Gỡ Voucher; ghi lại Thành tiền.
  **Kết quả mong đợi:** Có Voucher: giảm hạng 15.000đ, Thành tiền 135.000đ. Gỡ Voucher: giảm hạng 20.000đ (10% × 200.000), Thành tiền 180.000đ. (HTTP: 200)
  **Nhánh code bao phủ:** VCH-B01; ALL-B02
  **Ghi chú:** Không có Automated Test tương ứng – chỉ kiểm tra thủ công.
url: "{{baseUrl}}/api/bookings/quote"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{pkgFixedSpace200kId}}",
      "startAt": "2026-12-22T02:00:00.000Z",
      "guestCount": 1,
      "inclusions": [],
      "addons": [],
      "voucherCode": null
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRICING-062] Bỏ Voucher trên UI: giảm hạng tính lại trên Tạm tính
      pm.test("[TC-PRICING-062] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
      pm.test("[TC-PRICING-062] Cấu trúc JSON báo giá hợp lệ và mọi số tiền là số nguyên VNĐ không âm", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("pricing");
          const pr = json.pricing;
          ["packagePrice", "inclusionSurcharge", "addonTotal", "subtotal", "voucherDiscount", "tierDiscount", "discountAmount", "finalAmount"].forEach(function (k) {
              pm.expect(Number.isInteger(pr[k]), k + " phải là số nguyên").to.be.true;
              pm.expect(pr[k], k + " không được âm").to.be.at.least(0);
          });
      });
      pm.test("[TC-PRICING-062] Kết quả tính giá khớp công thức nghiệp vụ Pricing", function () {
          const json = pm.response.json();
          const pr = json.pricing;
          pm.expect(pr.packagePrice).to.eql(200000);
          pm.expect(pr.inclusionSurcharge).to.eql(0);
          pm.expect(pr.addonTotal).to.eql(0);
          pm.expect(pr.subtotal).to.eql(200000);
          pm.expect(pr.voucherDiscount).to.eql(0);
          pm.expect(pr.tierDiscount).to.eql(20000);
          pm.expect(pr.discountAmount).to.eql(20000);
          pm.expect(pr.finalAmount).to.eql(180000);
          pm.expect(json.tierRate).to.eql(0.1);
          pm.expect(pr.subtotal).to.eql(pr.packagePrice + pr.inclusionSurcharge + pr.addonTotal);
          pm.expect(pr.discountAmount).to.eql(pr.voucherDiscount + pr.tierDiscount);
          pm.expect(pr.finalAmount).to.eql(pr.subtotal - pr.discountAmount);
      });
    language: text/javascript
order: 4000
