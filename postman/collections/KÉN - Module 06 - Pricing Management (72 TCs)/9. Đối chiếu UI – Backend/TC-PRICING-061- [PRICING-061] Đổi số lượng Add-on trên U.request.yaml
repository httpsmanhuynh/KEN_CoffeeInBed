$kind: http-request
name: "TC-PRICING-061: [PRICING-061] Đổi số lượng Add-on trên UI: tổng tiền cập nhật đúng (Branch: ADD-B04; TIE-B04)"
description: |-
  **Mã TC:** PRICING-061 (TC-PRICING-061)
  **Nhóm:** Đối chiếu UI – Backend
  **API / Thành phần:** POST /api/bookings/quote (UI Checkout / Tóm tắt đơn (Customer))
  **Loại:** State Transition
  **Điều kiện tiên quyết:** Server chạy (http://localhost:3002) và ứng dụng giao diện chạy; đã chạy npm run setup (có hạng thành viên); dữ liệu giá/Inclusion/Add-on/Voucher theo cột 'Dữ liệu vào' đã có trong MongoDB (tạo bằng Compass nếu chưa có).
  **Dữ liệu vào:** Tài khoản: Customer hạng Bạc (5%)&#10;Package trọn gói 140.000đ&#10;Add-on 40.000đ: số lượng 1 rồi đổi thành 3
  **Các bước thực hiện:**
  1) Đăng nhập Customer hạng Bạc, chọn Package 140.000đ và Add-on 40.000đ số lượng 1; ghi lại Thành tiền.&#10;2) Đổi số lượng Add-on thành 3; ghi lại Thành tiền.&#10;3) Đổi lại về 1; ghi lại Thành tiền.
  **Kết quả mong đợi:** Số lượng 1: Tạm tính 180.000đ, giảm hạng 9.000đ, Thành tiền 171.000đ. Số lượng 3: Tạm tính 260.000đ, giảm hạng 13.000đ, Thành tiền 247.000đ. Quay về 1: lại 171.000đ. (HTTP: 200)
  **Nhánh code bao phủ:** ADD-B04; TIE-B04
  **Ghi chú:** Không có Automated Test tương ứng – chỉ kiểm tra thủ công.
url: "{{baseUrl}}/api/bookings/quote"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "2026-12-22T02:00:00.000Z",
      "guestCount": 1,
      "inclusions": [],
      "addons": [
        {
          "addonId": "{{addon40kId}}",
          "quantity": 3
        }
      ],
      "voucherCode": null
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRICING-061] Đổi số lượng Add-on trên UI: tổng tiền cập nhật đúng
      pm.test("[TC-PRICING-061] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
      pm.test("[TC-PRICING-061] Cấu trúc JSON báo giá hợp lệ và mọi số tiền là số nguyên VNĐ không âm", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("pricing");
          const pr = json.pricing;
          ["packagePrice", "inclusionSurcharge", "addonTotal", "subtotal", "voucherDiscount", "tierDiscount", "discountAmount", "finalAmount"].forEach(function (k) {
              pm.expect(Number.isInteger(pr[k]), k + " phải là số nguyên").to.be.true;
              pm.expect(pr[k], k + " không được âm").to.be.at.least(0);
          });
      });
      pm.test("[TC-PRICING-061] Kết quả tính giá khớp công thức nghiệp vụ Pricing", function () {
          const json = pm.response.json();
          const pr = json.pricing;
          pm.expect(pr.packagePrice).to.eql(140000);
          pm.expect(pr.inclusionSurcharge).to.eql(0);
          pm.expect(pr.addonTotal).to.eql(120000);
          pm.expect(pr.subtotal).to.eql(260000);
          pm.expect(pr.voucherDiscount).to.eql(0);
          pm.expect(pr.tierDiscount).to.eql(13000);
          pm.expect(pr.discountAmount).to.eql(13000);
          pm.expect(pr.finalAmount).to.eql(247000);
          pm.expect(json.tierRate).to.eql(0.05);
          pm.expect(pr.subtotal).to.eql(pr.packagePrice + pr.inclusionSurcharge + pr.addonTotal);
          pm.expect(pr.discountAmount).to.eql(pr.voucherDiscount + pr.tierDiscount);
          pm.expect(pr.finalAmount).to.eql(pr.subtotal - pr.discountAmount);
      });
    language: text/javascript
order: 3000
