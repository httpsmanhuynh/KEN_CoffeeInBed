$kind: http-request
name: "TC-PRICING-059: [PRICING-059] Số tiền ở Checkout khớp Backend (bộ số 1) (Branch: ALL-B02; SNP-B02)"
description: |-
  **Mã TC:** PRICING-059 (TC-PRICING-059)
  **Nhóm:** Đối chiếu UI – Backend
  **API / Thành phần:** POST /api/bookings/quote (UI Checkout / Tóm tắt đơn (Customer))
  **Loại:** Business Rule
  **Điều kiện tiên quyết:** Server chạy (http://localhost:3002) và ứng dụng giao diện chạy; đã chạy npm run setup (có hạng thành viên); dữ liệu giá/Inclusion/Add-on/Voucher theo cột 'Dữ liệu vào' đã có trong MongoDB (tạo bằng Compass nếu chưa có).
  **Dữ liệu vào:** Tài khoản: Customer hạng Vàng (giảm 10%)&#10;Package: trọn gói, tính theo không gian, đơn giá 140.000đ&#10;Inclusion: giá 55.000đ × 1, định mức 50.000đ&#10;Add-on: 40.000đ × 1; 25.000đ × 2&#10;Voucher: giảm cố định 30.000đ
  **Các bước thực hiện:**
  1) Đăng nhập UI bằng tài khoản ở 'Dữ liệu vào'.&#10;2) Chọn Package theo 'Dữ liệu vào' (nhập số khách/số giờ nếu có).&#10;3) Chọn các Inclusion theo 'Dữ liệu vào'.&#10;4) Chọn Add-on và nhập số lượng theo 'Dữ liệu vào'.&#10;5) Nhập/chọn Voucher theo 'Dữ liệu vào'.&#10;6) Mở màn hình Checkout/Tóm tắt đơn, ghi lại Tạm tính, Giảm Voucher, Giảm hạng, Thành tiền.&#10;7) Đối chiếu từng dòng với 'Kết quả mong đợi' (tính tay theo công thức, không dùng số do UI tự tính làm chuẩn).&#10;8) Hoàn tất tạo Booking, Compass: so Thành tiền ở bước 6 với bookings.price_snapshot.final_amount.
  **Kết quả mong đợi:** Tạm tính 235.000đ (Package 140.000đ + phụ phí Inclusion 5.000đ + Add-on 90.000đ); Giảm Voucher 30.000đ; Giảm hạng 20.500đ; Tổng giảm 50.500đ; Thành tiền 184.500đ. UI hiển thị đúng các số này, không có phần thập phân. Số hiển thị trên UI trùng khớp với price_snapshot.final_amount trong Compass. (HTTP: 200)
  **Nhánh code bao phủ:** ALL-B02; SNP-B02
  **Ghi chú:** CẦN XEM XÉT – ánh xạ không 1-1 (AUTO-PRICING-035 dùng chung cho 2 Manual TC). Automated TC ứng viên (chưa xác nhận, chỉ để truy vết, KHÔNG phải kết quả Manual): AUTO-PRICING-035: ví dụ đầy đủ: Package + phụ phí + Add-on − Voucher − hạng Vàng 10%
url: "{{baseUrl}}/api/bookings/quote"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "2026-12-22T02:00:00.000Z",
      "guestCount": 1,
      "inclusions": [
        {
          "packageInclusionId": "{{incFpDrinkId}}",
          "productId": "{{prodMatchaId}}",
          "quantity": 1
        }
      ],
      "addons": [
        {
          "addonId": "{{addon40kId}}",
          "quantity": 1
        },
        {
          "addonId": "{{addon25kId}}",
          "quantity": 2
        }
      ],
      "voucherCode": "KEN30K"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRICING-059] Số tiền ở Checkout khớp Backend (bộ số 1)
      pm.test("[TC-PRICING-059] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
      pm.test("[TC-PRICING-059] Cấu trúc JSON báo giá hợp lệ và mọi số tiền là số nguyên VNĐ không âm", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("pricing");
          const pr = json.pricing;
          ["packagePrice", "inclusionSurcharge", "addonTotal", "subtotal", "voucherDiscount", "tierDiscount", "discountAmount", "finalAmount"].forEach(function (k) {
              pm.expect(Number.isInteger(pr[k]), k + " phải là số nguyên").to.be.true;
              pm.expect(pr[k], k + " không được âm").to.be.at.least(0);
          });
      });
      pm.test("[TC-PRICING-059] Kết quả tính giá khớp công thức nghiệp vụ Pricing", function () {
          const json = pm.response.json();
          const pr = json.pricing;
          pm.expect(pr.packagePrice).to.eql(140000);
          pm.expect(pr.inclusionSurcharge).to.eql(5000);
          pm.expect(pr.addonTotal).to.eql(90000);
          pm.expect(pr.subtotal).to.eql(235000);
          pm.expect(pr.voucherDiscount).to.eql(30000);
          pm.expect(pr.tierDiscount).to.eql(20500);
          pm.expect(pr.discountAmount).to.eql(50500);
          pm.expect(pr.finalAmount).to.eql(184500);
          pm.expect(json.tierRate).to.eql(0.1);
          pm.expect(pr.subtotal).to.eql(pr.packagePrice + pr.inclusionSurcharge + pr.addonTotal);
          pm.expect(pr.discountAmount).to.eql(pr.voucherDiscount + pr.tierDiscount);
          pm.expect(pr.finalAmount).to.eql(pr.subtotal - pr.discountAmount);
      });
    language: text/javascript
order: 1000
