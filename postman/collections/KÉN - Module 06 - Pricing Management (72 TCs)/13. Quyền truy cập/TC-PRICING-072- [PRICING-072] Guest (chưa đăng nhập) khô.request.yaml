$kind: http-request
name: "TC-PRICING-072: [PRICING-072] Guest (chưa đăng nhập) không thể tạo Booking (Branch: Ngoài pricing.js (middleware đăng nhập – bộ TC Auth))"
description: |-
  **Mã TC:** PRICING-072 (TC-PRICING-072)
  **Nhóm:** Quyền truy cập
  **API / Thành phần:** POST /api/bookings (Backend – API tạo Booking (endpoint TBD) – Postman)
  **Loại:** Permission
  **Điều kiện tiên quyết:** Server chạy (http://localhost:3002); Postman bật Cookie jar và KHÔNG đăng nhập (xóa cookie); dữ liệu theo cột 'Dữ liệu vào' đã có trong MongoDB. Endpoint tạo Booking: TBD (chưa có trong tài liệu được cấp) – điền endpoint thực tế vào bước 2 trước khi chạy.
  **Dữ liệu vào:** Tài khoản: Guest (không cookie phiên)&#10;Body hợp lệ cho Package trọn gói 140.000đ
  **Các bước thực hiện:**
  1) Postman: xóa Cookie jar.&#10;2) Gọi API tạo Booking (endpoint TBD) với body hợp lệ.&#10;3) Ghi lại HTTP status/body.&#10;4) Kiểm tra bookings không có bản ghi mới.
  **Kết quả mong đợi:** 401 UNAUTHENTICATED (theo middleware đăng nhập hiện có trong Auth); không tạo Booking. (HTTP: 401)
  **Nhánh code bao phủ:** Ngoài pricing.js (middleware đăng nhập – bộ TC Auth)
  **Ghi chú:** Không có Automated Test tương ứng – chỉ kiểm tra thủ công.
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "2026-12-28T02:00:00.000Z",
      "guestCount": 1
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRICING-072] Guest (chưa đăng nhập) không thể tạo Booking
      pm.test("[TC-PRICING-072] Status code is 401", function () {
          pm.expect(pm.response.code).to.be.oneOf([401]);
      });
      pm.test("[TC-PRICING-072] Phản hồi từ chối hợp lệ kèm mã lỗi nghiệp vụ", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("code");
          pm.expect(["UNAUTHENTICATED"]).to.include(json.code);
          pm.expect(json).to.have.property("message");
      });
    language: text/javascript
order: 1000
