$kind: http-request
name: "TC-PRICING-037: [PRICING-037] Voucher cấu hình giảm 101% bị từ chối (Branch: VCH-B04)"
description: |-
  **Mã TC:** PRICING-037 (TC-PRICING-037)
  **Nhóm:** Voucher
  **API / Thành phần:** POST /api/bookings (MongoDB Compass + UI Checkout (Customer))
  **Loại:** Exception
  **Điều kiện tiên quyết:** Server chạy; có quyền ghi MongoDB Compass; ghi lại giá trị gốc của document sẽ sửa để khôi phục sau test; ứng dụng giao diện chạy với tài khoản Customer.
  **Dữ liệu vào:** Voucher trong DB: discount_type = PERCENT, discount_value = 101 (giá trị sai cố ý)&#10;Tài khoản: Customer hạng BASIC; Package trọn gói 140.000đ
  **Các bước thực hiện:**
  1) Compass: tạo/sửa 1 Voucher thử với PERCENT = 101.&#10;2) UI: chọn Package 140.000đ, nhập Voucher đó, tới Checkout.&#10;3) Quan sát; kiểm tra bookings.&#10;4) Xóa/khôi phục Voucher thử.
  **Kết quả mong đợi:** Voucher không được áp dụng với giá trị vượt 100%; Thành tiền không bị âm; không tạo Booking với Voucher này. Backend từ chối yêu cầu: không tạo Booking (collection bookings không có bản ghi mới), không trừ lượt Voucher; người dùng nhận thông báo lỗi (nội dung thông báo: TBD – chưa có trong tài liệu). (HTTP: 400/422/500)
  **Nhánh code bao phủ:** VCH-B04
  **Ghi chú:** CẦN XEM XÉT – ánh xạ không 1-1 (AUTO-PRICING-028 dùng chung cho 3 Manual TC). Automated TC ứng viên (chưa xác nhận, chỉ để truy vết, KHÔNG phải kết quả Manual): AUTO-PRICING-028: Voucher cấu hình sai bị từ chối
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{packageId}}",
      "startAt": "2026-12-20T02:00:00.000Z",
      "guestCount": 1,
      "voucherCode": "BAD101PCT"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRICING-037] Voucher cấu hình giảm 101% bị từ chối
      pm.test("[TC-PRICING-037] Status code is 400 or 422 or 500", function () {
          pm.expect(pm.response.code).to.be.oneOf([400,422,500]);
      });
      pm.test("[TC-PRICING-037] Phản hồi từ chối hợp lệ kèm mã lỗi nghiệp vụ", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("code");
          pm.expect(["INVALID_VOUCHER_VALUE","VOUCHER_INVALID","INTERNAL_ERROR"]).to.include(json.code);
          pm.expect(json).to.have.property("message");
      });
    language: text/javascript
order: 7000
