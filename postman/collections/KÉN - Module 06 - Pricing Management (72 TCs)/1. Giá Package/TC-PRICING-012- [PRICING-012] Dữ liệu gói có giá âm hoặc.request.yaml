$kind: http-request
name: "TC-PRICING-012: [PRICING-012] Dữ liệu gói có giá âm hoặc số thập phân bị từ chối (Branch: PKG-B03)"
description: |-
  **Mã TC:** PRICING-012 (TC-PRICING-012)
  **Nhóm:** Giá Package
  **API / Thành phần:** POST /api/bookings (MongoDB Compass + UI Checkout (Customer))
  **Loại:** Exception
  **Điều kiện tiên quyết:** Server chạy; có quyền ghi MongoDB Compass; ghi lại giá trị gốc của document sẽ sửa để khôi phục sau test; ứng dụng giao diện chạy với tài khoản Customer.
  **Dữ liệu vào:** Package trong DB: price = -1000 (lần 1) rồi price = 70000.5 (lần 2)&#10;Tài khoản: Customer hạng BASIC
  **Các bước thực hiện:**
  1) Compass: sửa giá của 1 gói thử thành -1000.&#10;2) UI: chọn gói, tới Checkout; quan sát; kiểm tra bookings.&#10;3) Lặp lại với giá 70000.5.&#10;4) Khôi phục giá gốc.
  **Kết quả mong đợi:** Cả 2 lần: không tính được giá, không tạo Booking. Backend từ chối yêu cầu: không tạo Booking (collection bookings không có bản ghi mới), không trừ lượt Voucher; người dùng nhận thông báo lỗi (nội dung thông báo: TBD – chưa có trong tài liệu). (HTTP: 400/422/500)
  **Nhánh code bao phủ:** PKG-B03
  **Ghi chú:** CẦN XEM XÉT – ánh xạ không 1-1 (1 Manual TC ↔ 2 Automated TC; AUTO-PRICING-008 dùng chung cho 3 Manual TC). Automated TC ứng viên (chưa xác nhận, chỉ để truy vết, KHÔNG phải kết quả Manual): AUTO-PRICING-008: đầu vào không hợp lệ: giá âm, số thực, loại sai | AUTO-PRICING-048: đầu vào sai vẫn ném RangeError với thông điệp cũ
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "spaceId": "{{spaceId}}",
      "packageId": "{{pkgInvalidPriceId}}",
      "startAt": "2026-12-20T02:00:00.000Z",
      "guestCount": 1
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-PRICING-012] Dữ liệu gói có giá âm hoặc số thập phân bị từ chối
      pm.test("[TC-PRICING-012] Status code is 400 or 422 or 500", function () {
          pm.expect(pm.response.code).to.be.oneOf([400,422,500]);
      });
      pm.test("[TC-PRICING-012] Phản hồi từ chối hợp lệ kèm mã lỗi nghiệp vụ", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("code");
          pm.expect(["INVALID_AMOUNT","INTERNAL_ERROR"]).to.include(json.code);
          pm.expect(json).to.have.property("message");
      });
    language: text/javascript
order: 12000
