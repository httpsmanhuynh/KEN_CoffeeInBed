$kind: http-request
name: "TC-REV-18: [REV-18] Xem trạng thái và chi tiết đánh giá của 1 Booking ở chế độ chỉ xem sau khi đã gửi (Branch: REV-B18)"
description: |-
  **Mã TC:** REV-18 (TC-REV-18)
  **Nhóm:** Xem đánh giá
  **API / Thành phần:** GET /api/reviews/booking/:bookingId
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer (chủ đơn) hoặc Admin; đơn đã có đánh giá.
  **Dữ liệu vào:** bookingId hợp lệ đã có review
  **Các bước thực hiện:**
  1) GET /api/reviews/booking/:bookingId&#10;2) Kiểm tra cờ trạng thái và nội dung review trả về
  **Kết quả mong đợi:** 200; hasReview=true, canReview=false, reviewReminder=false; trả kèm đối tượng review đầy đủ (rating, comment, created_at) (HTTP: 200)
  **Nhánh code bao phủ:** REV-B18
  **Ghi chú:** Phục vụ hiển thị đánh giá ở chế độ chỉ xem (AF2 - UC-16)
url: "{{baseUrl}}/api/reviews/booking/{{bookingId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // [TC-REV-18] Xem trạng thái và chi tiết đánh giá của 1 Booking ở chế độ chỉ xem sau khi đã gửi
      pm.test("[TC-REV-18] Status code is 200", function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
order: 4000
