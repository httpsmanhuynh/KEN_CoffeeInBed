$kind: http-request
name: "TC-REV-11: [REV-11] Gửi 2 đánh giá đồng thời cho cùng Booking (Branch: REV-B11)"
description: |-
  **Mã TC:** REV-11 (TC-REV-11)
  **Nhóm:** Chặn đánh giá trùng
  **API / Thành phần:** POST /api/reviews
  **Loại:** Security
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer; có đơn CHECKED_OUT của Customer.
  **Dữ liệu vào:** 2 request đồng thời
  **Các bước thực hiện:**
  1) Gửi đồng thời 2 POST /api/reviews
  **Kết quả mong đợi:** Chỉ 1 bản ghi được tạo (unique index theo booking_id) (HTTP: 201/409)
  **Nhánh code bao phủ:** REV-B11
  **Ghi chú:** Test concurrency thủ công
url: "{{baseUrl}}/api/reviews"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "bookingId": "{{bookingId}}",
      "rating": 5,
      "comment": "Không gian rất ổn"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-REV-11] Gửi 2 đánh giá đồng thời cho cùng Booking
      pm.test("[TC-REV-11] Status code is 201/409", function () {
          pm.expect(pm.response.code).to.be.oneOf([201, 409]);
      });
    language: text/javascript
order: 2000
