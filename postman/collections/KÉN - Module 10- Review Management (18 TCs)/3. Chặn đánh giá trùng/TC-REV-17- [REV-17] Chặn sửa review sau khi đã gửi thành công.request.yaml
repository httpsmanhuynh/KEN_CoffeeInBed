$kind: http-request
name: "TC-REV-17: [REV-17] Chặn sửa review sau khi đã gửi thành công (Branch: REV-B17)"
description: |-
  **Mã TC:** REV-17 (TC-REV-17)
  **Nhóm:** Chặn đánh giá trùng
  **API / Thành phần:** PATCH /api/reviews/:id
  **Loại:** Negative
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer; đã gửi đánh giá cho đơn CHECKED_OUT.
  **Dữ liệu vào:** {"rating": 1, "comment": "Sửa lại"}
  **Các bước thực hiện:**
  1) PATCH /api/reviews/<id> (hoặc POST cập nhật)&#10;2) GET lại đánh giá
  **Kết quả mong đợi:** 404/409; không có endpoint sửa đánh giá (đánh giá bị đóng băng sau khi gửi); dữ liệu trong DB giữ nguyên (HTTP: 404/409)
  **Nhánh code bao phủ:** REV-B17
  **Ghi chú:** Đánh giá sau khi gửi chỉ ở chế độ chỉ xem (AF2)
url: "{{baseUrl}}/api/reviews/{{bookingId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "rating": 1,
      "comment": "Sửa lại"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-REV-17] Chặn sửa review sau khi đã gửi thành công
      pm.test("[TC-REV-17] Status code is 404/409", function () {
          pm.expect(pm.response.code).to.be.oneOf([404, 409]);
      });
    language: text/javascript
order: 3000
