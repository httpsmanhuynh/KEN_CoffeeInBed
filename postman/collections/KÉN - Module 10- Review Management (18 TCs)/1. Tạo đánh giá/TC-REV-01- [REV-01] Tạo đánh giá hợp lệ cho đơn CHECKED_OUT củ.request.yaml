$kind: http-request
name: "TC-REV-01: [REV-01] Tạo đánh giá hợp lệ cho đơn CHECKED_OUT của chính mình (Branch: REV-B01)"
description: |-
  **Mã TC:** REV-01 (TC-REV-01)
  **Nhóm:** Tạo đánh giá
  **API / Thành phần:** POST /api/reviews
  **Loại:** Positive
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer; có đơn CHECKED_OUT của Customer.
  **Dữ liệu vào:** {"bookingId": "<id>", "rating": 5, "comment": "Không gian rất ổn"}
  **Các bước thực hiện:**
  1) POST /api/reviews&#10;2) Kiểm tra collection reviews
  **Kết quả mong đợi:** 201; bản ghi đúng validator reviews (rating 1..5, comment) (HTTP: 201)
  **Nhánh code bao phủ:** REV-B01
  **Ghi chú:** 
url: "{{baseUrl}}/api/reviews"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "bookingId": "{{bookingId}}",
      "rating": 5,
      "comment": "Không gian rất ổn"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-REV-01] Tạo đánh giá hợp lệ cho đơn CHECKED_OUT của chính mình
      pm.test("[TC-REV-01] Status code is 201", function () {
          pm.expect(pm.response.code).to.be.oneOf([201]);
      });
    language: text/javascript
order: 1000
