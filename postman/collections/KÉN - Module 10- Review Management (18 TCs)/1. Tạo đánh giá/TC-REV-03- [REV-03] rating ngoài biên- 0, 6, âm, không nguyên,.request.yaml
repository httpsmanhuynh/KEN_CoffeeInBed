$kind: http-request
name: "TC-REV-03: [REV-03] rating ngoài biên: 0, 6, âm, không nguyên, chuỗi (Branch: REV-B03)"
description: |-
  **Mã TC:** REV-03 (TC-REV-03)
  **Nhóm:** Tạo đánh giá
  **API / Thành phần:** POST /api/reviews
  **Loại:** Boundary
  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer; có đơn CHECKED_OUT của Customer.
  **Dữ liệu vào:** rating = 0 ; 6 ; -1 ; 4.5 ; "abc"
  **Các bước thực hiện:**
  1) POST /api/reviews 5 lần
  **Kết quả mong đợi:** Cả 5 lần 422 VALIDATION_ERROR; không tạo bản ghi (HTTP: 422)
  **Nhánh code bao phủ:** REV-B03
  **Ghi chú:** 
url: "{{baseUrl}}/api/reviews"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "bookingId": "{{bookingId}}",
      "rating": 6,
      "comment": "Không gian rất ổn"
    }
scripts:
  - type: afterResponse
    code: |-
      // [TC-REV-03] rating ngoài biên: 0, 6, âm, không nguyên, chuỗi
      pm.test("[TC-REV-03] Status code is 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([422]);
      });
    language: text/javascript
order: 3000
