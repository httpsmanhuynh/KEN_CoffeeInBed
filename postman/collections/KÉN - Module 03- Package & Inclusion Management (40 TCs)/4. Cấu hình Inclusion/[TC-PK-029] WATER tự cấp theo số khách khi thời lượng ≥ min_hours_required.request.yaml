  **API / Thành phần:** POST /api/bookings/quote

  **Loại:** Positive

  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer; đã seed spaces/packages/package_prices/package_inclusions.

  **Dữ liệu vào:** guestCount=3, hours=2 và hours=1

  **Các bước thực hiện:**

  1) POST quote hours=2

  2) POST quote hours=1

  **Kết quả mong đợi:** hours=2: fixed_inclusions có 3 nước lọc; hours=1: không cấp
  (HTTP: 200)

  **Nhánh code bao phủ:** PKG-B26

  '
