  language: text/javascript
  code: "// [TC-PM-017] Admin xử lý đơn CANCELLED có refund_status=FAILED → MANUALLY_RESOLVED\n\
    pm.test(\"[TC-PM-017] Status code is 200\", function () {\n    pm.expect(pm.response.code).to.be.oneOf([200]);\n\
    });\npm.test(\"[TC-PM-017] Response valid format\", function () {\n    pm.expect(pm.response.text()).to.be.a('string');\n\
    });"
