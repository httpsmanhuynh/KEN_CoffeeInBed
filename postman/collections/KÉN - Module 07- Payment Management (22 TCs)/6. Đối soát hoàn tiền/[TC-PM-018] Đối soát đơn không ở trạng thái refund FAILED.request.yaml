  **API / Thành phần:** POST /api/bookings/:id/refund-reconcile

  **Loại:** Negative

  **Điều kiện tiên quyết:** Server chạy; đăng nhập Admin.

  **Dữ liệu vào:** Đơn REFUNDED / NONE

  **Các bước thực hiện:**

  1) POST refund-reconcile

  **Kết quả mong đợi:** 409 từ chối; không ghi giao dịch (HTTP: 409)

  **Nhánh code bao phủ:** PAY-B18

  '
