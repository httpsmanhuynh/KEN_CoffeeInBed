$kind: http-request
name: '[TC-PM-008] Biên hạn: ngay trước payment_expires_at được; sau đó bị chặn'
description: '**Mã TC:** TC-PM-008

  **Nhóm:** Hết hạn thanh toán

  **API / Thành phần:** POST /api/bookings/:id/pay

  **Loại:** Boundary

  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer; có đơn PENDING_PAYMENT
  còn hạn.

  **Dữ liệu vào:** now < expires; now ≥ expires

  **Các bước thực hiện:**

  1) Thanh toán sát hạn

  2) Thanh toán sau hạn

  **Kết quả mong đợi:** Trước hạn thành công; từ lúc hết hạn bị từ chối (HTTP: 200/409)

  **Nhánh code bao phủ:** PAY-B08

  '
url: '{{baseUrl}}/api/bookings/{{bookingId}}/pay'
method: POST
headers:
- key: Content-Type
  value: application/json
- key: x-test-role
  value: CUSTOMER
order: 8000
body:
  type: json
  raw: '{"data": "now < expires; now ≥ expires"}'
scripts:
- type: afterResponse
  language: text/javascript
  code: "// [TC-PM-008] Biên hạn: ngay trước payment_expires_at được; sau đó bị chặn\n\
    pm.test(\"[TC-PM-008] Status code is 200/409\", function () {\n    pm.expect(pm.response.code).to.be.oneOf([200,\
    \ 409]);\n});\npm.test(\"[TC-PM-008] Response valid format\", function () {\n\
    \    pm.expect(pm.response.text()).to.be.a('string');\n});"
