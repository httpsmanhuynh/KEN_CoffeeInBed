$kind: http-request
name: '[TC-PM-007] Thanh toán lại khi đã quá hạn 15 phút'
description: '**Mã TC:** TC-PM-007

  **Nhóm:** Thanh toán thất bại & thanh toán lại

  **API / Thành phần:** POST /api/bookings/:id/pay

  **Loại:** Negative

  **Điều kiện tiên quyết:** Server chạy; đăng nhập Customer; có đơn PENDING_PAYMENT
  còn hạn.

  **Dữ liệu vào:** Đơn FAILED rồi chờ quá hạn

  **Các bước thực hiện:**

  1) POST pay FAILED

  2) Chờ quá payment_expires_at

  3) POST pay SUCCESS

  **Kết quả mong đợi:** Bị từ chối (HOLD_EXPIRED); đơn → EXPIRED (HTTP: 409)

  **Nhánh code bao phủ:** PAY-B07

  '
url: '{{baseUrl}}/api/bookings/{{bookingId}}/pay'
method: POST
headers:
- key: Content-Type
  value: application/json
- key: x-test-role
  value: CUSTOMER
order: 7000
body:
  type: json
  raw: '{"data": "Đơn FAILED rồi chờ quá hạn"}'
scripts:
- type: afterResponse
  language: text/javascript
  code: "// [TC-PM-007] Thanh toán lại khi đã quá hạn 15 phút\npm.test(\"[TC-PM-007]\
    \ Status code is 409\", function () {\n    pm.expect(pm.response.code).to.be.oneOf([409]);\n\
    });\npm.test(\"[TC-PM-007] Response valid format\", function () {\n    pm.expect(pm.response.text()).to.be.a('string');\n\
    });"
