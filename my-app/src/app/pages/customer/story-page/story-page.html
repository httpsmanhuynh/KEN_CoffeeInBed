<div class="story-page">
  <section class="story-hero">
    <div class="story-container">
      <span class="story-eyebrow">CHUYỆN Ở KÉN</span>

      <h1>Chuyện ở KÉN</h1>

      <p class="story-tagline">Lười một chút, chill một góc</p>

      <p class="story-intro">
        Câu chuyện, cẩm nang và những nhịp sống giữa ba không gian.
      </p>
    </div>
  </section>

  <main class="story-content">
    <div class="story-container">

      <div class="story-row-group"
           *ngFor="let row of rows; let rowIndex = index">

        <div class="story-grid">
          <article class="story-card" *ngFor="let card of row">

            <div class="story-image-wrap">
              <img
                class="story-image"
                [src]="card.image"
                [alt]="card.title"
                loading="lazy"
              />

              <span
                class="story-category"
                [class.warm]="card.tone === 'warm'">
                {{ card.category }}
              </span>
            </div>

            <div class="story-card-body">
              <div class="story-card-heading">
                <h2>{{ card.title }}</h2>

                <button
                  type="button"
                  class="story-save"
                  [attr.aria-label]="
                    isSaved(card.id)
                      ? 'Bỏ lưu ' + card.title
                      : 'Lưu ' + card.title
                  "
                  [attr.aria-pressed]="isSaved(card.id)"
                  (click)="toggleSaved(card.id)"
                >
                  <img
                    [src]="isSaved(card.id)
                      ? '/images/ken-figma/stories-bookmark-filled.svg'
                      : '/images/ken-figma/stories-bookmark.svg'"
                    alt=""
                  />
                </button>
              </div>

              <p>{{ card.description }}</p>

              <a [routerLink]="card.route" class="story-read-more">
                Đọc thêm →
              </a>
            </div>

          </article>
        </div>

        <img
          *ngIf="rowIndex < 2"
          class="story-divider"
          src="/images/ken-figma/stories-divider.svg"
          alt=""
        />

      </div>
    </div>
  </main>
</div>
