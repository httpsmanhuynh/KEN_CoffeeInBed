<aside class="side" aria-label="Điều hướng tài khoản">
  <div class="profile">
    <div class="avatar">
      @if (displayAvatar) {
        <img class="avatar__photo" [src]="displayAvatar" alt="Ảnh đại diện" />
      } @else {
        <lucide-icon
          class="avatar__default-icon"
          name="user-round"
          [size]="24"
          [strokeWidth]="1.8"
          color="#4A3123"
          aria-hidden="true"
        ></lucide-icon>
      }
    </div>
    <p class="profile__name">{{ displayName }}</p>
    <div class="rank">
      <span class="rank__badge">{{ displayTier }}</span>
      <span class="rank__points">{{ displayPoints }}</span>
    </div>
  </div>

  <nav class="menu">
    @for (it of items; track it.key) {
      <a
        class="item"
        [class.is-active]="it.key === active"
        [routerLink]="it.path"
        [attr.aria-current]="it.key === active ? 'page' : null"
      >
        <lucide-icon
          [name]="it.icon"
          [size]="20"
          [strokeWidth]="1.8"
          aria-hidden="true"
        ></lucide-icon>
        <span>{{ it.label }}</span>
        @if (it.key === active) {
          <i class="item__bar" aria-hidden="true"></i>
        }
      </a>
    }
    <button type="button" class="item item--logout" (click)="requestLogout()">
      <lucide-icon name="log-out" [size]="20" [strokeWidth]="1.8" aria-hidden="true"></lucide-icon>
      <span>Đăng xuất</span>
    </button>
  </nav>

  <div class="help">
    <p class="help__title">Một chút hỗ trợ từ KÉN</p>
    <p class="help__text">Về đặt chỗ, quyền lợi hay tài khoản — KÉN luôn sẵn lòng.</p>
    <a class="help__link" routerLink="/support">Nhắn KÉN ↗</a>
  </div>
</aside>
<app-confirm-dialog
  [isOpen]="showLogoutConfirm"
  (confirmed)="confirmLogout()"
  (cancelled)="cancelLogout()"
></app-confirm-dialog>
