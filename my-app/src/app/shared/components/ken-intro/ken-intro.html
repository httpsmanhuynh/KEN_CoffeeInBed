<div
  class="ki-intro"
  #introRoot
  role="presentation"
  (click)="skip()"
  title="Nhấn để vào KÉN ngay"
>
  <div class="ki-shell ki-shell-left" aria-hidden="true">
    <div class="ki-silk"></div>
  </div>
  <div class="ki-shell ki-shell-right" aria-hidden="true">
    <div class="ki-silk"></div>
  </div>
  <div class="ki-seam" aria-hidden="true"></div>

  <div class="ki-center">
    <div class="ki-nest">
      <svg class="ki-svg" viewBox="0 0 180 180" fill="none" aria-hidden="true">
        <ellipse
          class="ki-ring"
          cx="90"
          cy="90"
          rx="76"
          ry="62"
          transform="rotate(-18 90 90)"
          stroke="#e3a52f"
          stroke-width="1.4"
          stroke-dasharray="440"
        />
        <ellipse
          class="ki-ring"
          cx="90"
          cy="90"
          rx="74"
          ry="58"
          transform="rotate(24 90 90)"
          stroke="#f2cb79"
          stroke-width="1.1"
          stroke-dasharray="440"
        />
        <ellipse
          class="ki-ring"
          cx="90"
          cy="90"
          rx="66"
          ry="66"
          stroke="rgba(247, 239, 226, 0.45)"
          stroke-width="1"
          stroke-dasharray="440"
        />
      </svg>
      <span class="ki-wordmark">KÉN</span>
    </div>

    <div class="ki-caption">
      <p>Chui ra khỏi ổ, chọn một góc bình yên...</p>
      <div class="ki-progress" aria-hidden="true">
        <span class="ki-progress-fill"></span>
      </div>
    </div>
  </div>
</div>
